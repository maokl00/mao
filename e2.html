.hide{display:none!important}
footer{margin-top:40px;color:var(--muted);font-size:13px}

 it, too?\", \"Ｃ\": \"Are you all right?\", \"Ｄ\": \"Let’s not be nice to him next time.\"}, \"ans\": \"Ａ\", \"exp\": \"Lisa　知道　Jay　凌晨　12：30　在廚房吃掉了　Iris　的巧克力蛋糕。Iris　贊同　Lisa　的說法，她發現「Jay　晚餐時一直注視著它啊！」。所以凌晨　12：30　在廚房偷吃掉它。\"}], \"group\": [], \"sections\": [[0, 113], [113, 168]]};\nconst IMGS = {};\nconst CFG = {\"full\": 168, \"singlePts\": 1, \"groupPts\": 1, \"blanks\": true, \"latinFont\": true, \"sections\": [{\"title\": \"文法選擇\", \"note\": \"共 113 題，每題 1 分\", \"start\": 0, \"end\": 113}, {\"title\": \"對話與完成句子\", \"note\": \"共 55 題，每題 1 分\", \"start\": 113, \"end\": 168}]};\ndocument.getElementById('full').textContent=CFG.full;\nif(CFG.latinFont) document.documentElement.style.setProperty('--kai','\"Georgia\",\"Times New Roman\",\"BiauKai\",\"DFKai-SB\",\"標楷體\",\"TW-Kai\",\"Kaiti TC\",\"Noto Serif TC\",serif');\nconst FW = '１２３４５６７８９';\nconst LET = ['Ａ','Ｂ','Ｃ','Ｄ'];\nlet mode = 'practice';\nlet submitted = false;\nlet wrongOnly = false;\nlet retryIds = null; // Set of ids being re-practised\nlet retryRound = 0;\nconst st = {};   // id -> {pick, revealed, open:{vals,self}}\nconst items = []; // {id, kind:'mc'|'open', pts, ans, navLabel, cardId}\n\nfunction el(tag, attrs={}, ...kids){\n  const e=document.createElement(tag);\n  for(const[k,v] of Object.entries(attrs)){\n    if(k==='class') e.className=v; else if(k==='text') e.textContent=v; else e.setAttribute(k,v);\n  }\n  for(const k of kids){ if(k!=null) e.append(k); }\n  return e;\n}\nfunction renderStem(blocks){\n  const box=el('div',{class:'stem'});\n  for(const b of blocks){\n    if(b.k==='tbl'){\n      const t=el('table',{class:'t'});\n      for(const r of b.rows){\n        const tr=el('tr');\n        for(const c of r){\n          const td=el('td',{text:c.v});\n          if(c.cs>1) td.colSpan=c.cs; if(c.rs>1) td.rowSpan=c.rs;\n          tr.append(td);\n        }\n        t.append(tr);\n      }\n      box.append(el('div',{class:'tblwrap'},t));\n      continue;\n    }\n    const hasImg=b.c.some(n=>n.k==='img');\n    if(hasImg){\n      const fig=el('div',{class:'fig'});\n      for(const n of b.c){\n        if(n.k!=='img') continue;\n        fig.append(makeImg(n,1.6));\n      }\n      box.append(fig);\n    } else {\n      const txt=b.c.map(n=>n.v).join('');\n      if(/^▲?\\s*圖\\s*[\\(（]?[一二三四五六七八九十]+[\\)）]?$/.test(txt.trim())) box.append(el('div',{class:'caption',text:txt.trim()}));\n      else box.append(CFG.blanks ? blankP(txt) : el('p',{text:txt}));\n    }\n  }\n  return box;\n}\nfunction blankP(txt){\n  const p=el('p');\n  txt.split(/(\\u3000{3,})/).forEach((seg,i)=>{\n    if(i%2) p.append(el('span',{class:'blank','aria-label':'空格'}));\n    else if(seg) p.append(seg);\n  });\n  return p;\n}\nfunction makeImg(n,scale){\n  const W=Math.round(n.w*scale), H=Math.round(n.h*scale);\n  const img=el('img',{src:IMGS[n.src],alt:'附圖',tabindex:'0'});\n  if(!n.crop){\n    img.width=W; img.height=H; img.style.width=W+'px';\n    return img;\n  }\n  // reproduce Word's crop without altering the original image file\n  const c=Object.assign({l:0,t:0,r:0,b:0},n.crop);\n  const box=el('span',{class:'crop'});\n  box.style.width=W+'px'; box.style.aspectRatio=W+' / '+H;\n  img.style.width=(100/(1-c.l-c.r))+'%';\n  img.style.left=(-100*c.l/(1-c.l-c.r))+'%';\n  img.style.top=(-100*c.t/(1-c.t-c.b))+'%';\n  box.append(img);\n  return box;\n}\nfunction optContent(v){\n  if(typeof v==='string') return el('span',{text:v});\n  const s=el('span',{class:'optimg'});\n  for(const n of v.nodes){\n    if(n.k==='img') s.append(makeImg(n,1.4)); else s.append(n.v);\n  }\n  return s;\n}\nfunction expBox(id){ return el('div',{class:'exp hidden',id:'exp-'+id}); }\n\nfunction buildMC(id, q, pts, navLabel, cardId){\n  items.push({id,kind:'mc',pts,ans:q.ans,navLabel,cardId,exp:q.exp,gexp:q.gexp});\n  st[id]={pick:null,revealed:false};\n  const imgVals=Object.values(q.opts).filter(v=>typeof v!=='string');\n  const wide=imgVals.some(v=>v.nodes.some(n=>n.k==='img'&&n.w*1.4>360));\n  const wrap=el('div',{class:'opts'+(imgVals.length?(wide?' imgopts wide':' imgopts'):'')});\n  LET.forEach(L=>{\n    if(!(L in q.opts)) return;\n    const b=el('button',{class:'opt','data-q':id,'data-l':L,type:'button'},\n      el('span',{class:'l',text:'('+L+')'}), optContent(q.opts[L]), el('span',{class:'mark'}));\n    b.addEventListener('click',()=>pick(id,L));\n    wrap.append(b);\n  });\n  return [wrap, expBox(id)];\n}\nfunction buildOpen(id, q, pts, navLabel, cardId){\n  items.push({id,kind:'open',pts,ans:q.ans,navLabel,cardId,fields:q.fields});\n  st[id]={revealed:false,self:null};\n  const box=el('div',{class:'open'});\n  q.fields.forEach((f,i)=>{\n    const inp=el('input',{type:'text','data-q':id,'data-i':i,placeholder:'輸入答案'});\n    if(!f) inp.classList.add('wide');\n    inp.addEventListener('input',()=>{ updateStats(); });\n    box.append(f? el('label',{},f+'：',inp) : inp);\n  });\n  const show=el('button',{class:'btn',type:'button',id:'show-'+id,text:'看參考答案'});\n  show.addEventListener('click',()=>{ st[id].revealed=true; refreshItem(id); updateStats(); });\n  box.append(show);\n  return [box, expBox(id)];\n}\n\nfunction build(){\n  const main=document.getElementById('main');\n  const nav=document.getElementById('nav');\n  const secs = CFG.sections || [{title:'單題',note:CFG.singleNote,start:0,end:DATA.single.length}];\n  DATA.single.forEach((q,i)=>{\n    const sec=secs.find(s=>s.start===i);\n    if(sec){\n      main.append(el('h2',{},sec.title,el('small',{text:sec.note||''})));\n      nav.append(el('div',{class:'sep',text:sec.title}));\n    }\n    const id='s'+(i+1), cardId='card-'+id;\n    const card=el('section',{class:'q',id:cardId,'data-ids':id});\n    const body=el('div',{class:'body'},renderStem(q.stem),...buildMC(id,q,CFG.singlePts,String(i+1),cardId));\n    card.append(el('div',{class:'qhead'},el('div',{class:'no',text:(i+1)+'.'}),body));\n    main.append(card);\n    nav.append(el('a',{href:'#'+cardId,id:'nav-'+id,text:String(i+1)}));\n  });\n  if(DATA.group.length){\n    main.append(el('h2',{},'題組',el('small',{text:CFG.groupNote})));\n    nav.append(el('div',{class:'sep',text:'題組'}));\n  }\n  DATA.group.forEach((g,gi)=>{\n    const cardId='card-g'+(gi+1);\n    const card=el('section',{class:'q',id:cardId});\n    const ids=[];\n    const body=el('div',{class:'body'});\n    if(g.stem.length) body.append(el('div',{class:'gstem'},renderStem(g.stem)));\n    g.subs.forEach(s=>{\n      const id='g'+(gi+1)+'-'+s.n; ids.push(id);\n      const label=(gi+1)+'-'+s.n;\n      const parts= s.open ? buildOpen(id,s,CFG.groupPts,label,cardId) : buildMC(id,s,CFG.groupPts,label,cardId);\n      const sub=el('div',{class:'sub',id:'sub-'+id},el('div',{class:'no',text:'('+FW[s.n-1]+')'}),\n        el('div',{class:'body'},renderStem(s.stem),...parts));\n      body.append(sub);\n      nav.append(el('a',{href:'#sub-'+id,id:'nav-'+id,text:label}));\n    });\n    card.dataset.ids=ids.join(',');\n    card.append(el('div',{class:'qhead'},el('div',{class:'no',text:'組'+(gi+1)}),body));\n    main.append(card);\n  });\n  const res=el('div',{class:'result hidden',id:'result'});\n  main.append(res);\n  main.append(el('p',{class:'empty hidden',id:'empty',text:'目前沒有錯題。'}));\n  document.getElementById('total').textContent=items.length;\n}\n\nfunction pick(id,L){\n  const s=st[id];\n  if(s.revealed) return;\n  s.pick=L;\n  if(mode==='practice') s.revealed=true;\n  refreshItem(id); updateStats();\n}\nfunction itemStatus(it){\n  const s=st[it.id];\n  if(it.kind==='mc'){\n    if(!s.pick) return s.revealed?'bad':'none';\n    if(!s.revealed) return 'done';\n    return s.pick===it.ans?'ok':'bad';\n  } else {\n    if(s.self==='ok') return 'ok';\n    if(s.self==='bad') return 'bad';\n    return hasOpenInput(it)?'done':'none';\n  }\n}\nfunction hasOpenInput(it){\n  return [...document.querySelectorAll(`input[data-q=\"${it.id}\"]`)].some(i=>i.value.trim());\n}\nfunction refreshItem(id){\n  const it=items.find(x=>x.id===id), s=st[id];\n  const exp=document.getElementById('exp-'+id);\n  if(it.kind==='mc'){\n    document.querySelectorAll(`.opt[data-q=\"${id}\"]`).forEach(b=>{\n      const L=b.dataset.l; b.className='opt'; b.querySelector('.mark').textContent='';\n      b.disabled=s.revealed;\n      if(s.revealed){\n        if(L===it.ans){ b.classList.add('right'); b.querySelector('.mark').textContent='✓'; }\n        else if(L===s.pick){ b.classList.add('wrong'); b.querySelector('.mark').textContent='✗'; }\n      } else if(L===s.pick) b.classList.add('sel');\n      b.setAttribute('aria-pressed', L===s.pick ? 'true':'false');\n    });\n    if(s.revealed){\n      exp.innerHTML='';\n      const ok=s.pick===it.ans;\n      const v=el('span',{class:'verdict '+(ok?'ok':'no'),text: s.pick ? (ok?'答對了！':'答錯了。') : '未作答。'});\n      exp.append(v, '正確答案：('+it.ans+')');\n      const e=it.exp||it.gexp;\n      if(e) exp.append('\\n解析：'+e);\n      exp.classList.toggle('bad',!ok);\n      exp.classList.remove('hidden');\n    } else exp.classList.add('hidden');\n  } else {\n    const show=document.getElementById('show-'+id);\n    const inputs=document.querySelectorAll(`input[data-q=\"${id}\"]`);\n    inputs.forEach(i=>i.readOnly=s.revealed);\n    show.classList.toggle('hidden',s.revealed || (mode==='exam'&&!submitted));\n    if(s.revealed){\n      exp.innerHTML='';\n      const ansText=it.fields[0]? it.fields.map((f,i)=>f+'：'+it.ans[i]).join('　') : it.ans[0];\n      exp.append(el('span',{class:'verdict ok',text:'參考答案：'}),ansText);\n      const sm=el('div',{class:'selfmark'},'自己對照後評分：');\n      const b1=el('button',{class:'btn',type:'button',text:'我答對了'}), b2=el('button',{class:'btn',type:'button',text:'我答錯了'});\n      b1.setAttribute('aria-pressed',s.self==='ok'?'true':'false'); b2.setAttribute('aria-pressed',s.self==='bad'?'true':'false');\n      b1.onclick=()=>{s.self='ok';refreshItem(id);updateStats();};\n      b2.onclick=()=>{s.self='bad';refreshItem(id);updateStats();};\n      sm.append(b1,b2); exp.append(sm);\n      exp.classList.toggle('bad',s.self==='bad');\n      exp.classList.remove('hidden');\n    } else exp.classList.add('hidden');\n  }\n  const n=document.getElementById('nav-'+id);\n  n.className=''; const stt=itemStatus(it); if(stt!=='none') n.classList.add(stt);\n}\nfunction updateStats(){\n  let answered=0, score=0;\n  for(const it of items){\n    const s=st[it.id];\n    if(it.kind==='mc'){ if(s.pick) answered++; if(s.revealed && s.pick===it.ans) score+=it.pts; }\n    else { if(hasOpenInput(it)||s.self) answered++; if(s.self==='ok') score+=it.pts; }\n    const n=document.getElementById('nav-'+it.id);\n    n.className=''; const stt=itemStatus(it); if(stt!=='none') n.classList.add(stt);\n  }\n  document.getElementById('answered').textContent=answered;\n  document.getElementById('score').textContent=+score.toFixed(1);\n  const nOk=items.filter(it=>itemStatus(it)==='ok').length;\n  const nBad=items.filter(it=>itemStatus(it)==='bad').length;\n  const rateTxt=(nOk+nBad)? (Math.round(nOk/(nOk+nBad)*1000)/10)+'%' : '–';\n  document.getElementById('nOk').textContent=nOk;\n  document.getElementById('nBad').textContent=nBad;\n  document.getElementById('rate').textContent=rateTxt;\n  const allRevealed=items.every(it=>st[it.id].revealed);\n  const res=document.getElementById('result');\n  if(allRevealed){\n    const wrong=items.filter(it=>itemStatus(it)==='bad').length;\n    const pending=items.filter(it=>it.kind==='open'&&!st[it.id].self).length;\n    const had=!res.classList.contains('hidden');\n    res.innerHTML='';\n    const seal=el('div',{class:'seal'+(had?'':' stamp')},el('b',{text:String(+score.toFixed(1))}),el('span',{text:'滿分 '+CFG.full}));\n    const txt=el('div',{},el('p',{text:`共 ${items.length} 題：答對 ${nOk} 題，答錯或未作答 ${wrong} 題，答對率 ${rateTxt}。`}),\n      el('p',{text: pending?`還有 ${pending} 題問答題尚未自評，評分後才會計入得分。`:'按「只看錯題」可以集中複習答錯的題目。'}));\n    res.append(seal,txt); res.classList.remove('hidden');\n  } else res.classList.add('hidden');\n  applyFilter();\n}\nfunction applyFilter(){\n  let any=false;\n  document.querySelectorAll('section.q').forEach(card=>{\n    const ids=card.dataset.ids.split(',');\n    let show=false;\n    ids.forEach(id=>{\n      const it=items.find(x=>x.id===id);\n      const keep = retryIds ? retryIds.has(id) : itemStatus(it)==='bad';\n      const filtering = retryIds || wrongOnly;\n      const sub=document.getElementById('sub-'+id);\n      if(sub) sub.classList.toggle('hidden', !!filtering && !keep);\n      if(keep) show=true;\n    });\n    const filtering = retryIds || wrongOnly;\n    card.classList.toggle('hidden', !!filtering && !show);\n    if(show) any=true;\n  });\n  const filtering = !!(retryIds || wrongOnly);\n  document.querySelectorAll('h2').forEach(h=>h.classList.toggle('hidden',filtering));\n  document.getElementById('empty').classList.toggle('hidden',!(filtering&&!any));\n  const nBad=items.filter(it=>itemStatus(it)==='bad').length;\n  document.getElementById('retry').disabled = nBad===0;\n  const bar=document.getElementById('retrybar');\n  bar.classList.toggle('hidden',!retryIds);\n  if(retryIds){\n    const ids=[...retryIds].map(id=>items.find(x=>x.id===id));\n    const done=ids.filter(it=>['ok','bad'].includes(itemStatus(it)));\n    const ok=done.filter(it=>itemStatus(it)==='ok').length;\n    document.getElementById('retryText').textContent =\n      `第 ${retryRound} 次重練：共 ${ids.length} 題，已完成 ${done.length} 題，這次答對 ${ok} 題` +\n      (done.length===ids.length ? (ok===ids.length ? '，全部答對了！' : `，還有 ${ids.length-ok} 題答錯，可以再按「重練錯題」。`) : '。');\n  }\n}\nfunction resetAll(){\n  for(const it of items){\n    st[it.id]= it.kind==='mc'?{pick:null,revealed:false}:{revealed:false,self:null};\n    document.querySelectorAll(`input[data-q=\"${it.id}\"]`).forEach(i=>i.value='');\n    refreshItem(it.id);\n  }\n  submitted=false; wrongOnly=false; retryIds=null; retryRound=0;\n  document.getElementById('wrongOnly').setAttribute('aria-pressed','false');\n  document.getElementById('result').classList.add('hidden');\n  document.getElementById('submit').classList.toggle('hidden',mode!=='exam');\n  updateStats(); window.scrollTo({top:0});\n}\nfunction setMode(m){\n  const anything=items.some(it=>{const s=st[it.id];return s.pick||s.revealed||hasOpenInput(it);});\n  if(m===mode) return;\n  if(anything && !confirm('切換模式會清除目前的作答紀錄，確定要切換嗎？')) return;\n  mode=m;\n  document.getElementById('modePractice').setAttribute('aria-pressed',m==='practice');\n  document.getElementById('modeExam').setAttribute('aria-pressed',m==='exam');\n  resetAll();\n}\ndocument.getElementById('modePractice').onclick=()=>setMode('practice');\ndocument.getElementById('modeExam').onclick=()=>setMode('exam');\ndocument.getElementById('reset').onclick=()=>{ if(confirm('確定要清除所有作答，重新開始嗎？')) resetAll(); };\ndocument.getElementById('submit').onclick=()=>{\n  const left=items.filter(it=>itemStatus(it)==='none').length;\n  if(left && !confirm(`還有 ${left} 題沒作答，確定要交卷嗎？`)) return;\n  submitted=true;\n  for(const it of items){ st[it.id].revealed=true; refreshItem(it.id); }\n  document.getElementById('submit').classList.add('hidden');\n  updateStats();\n  document.getElementById('result').scrollIntoView({behavior:'smooth'});\n};\ndocument.getElementById('wrongOnly').onclick=e=>{\n  wrongOnly=!wrongOnly; e.currentTarget.setAttribute('aria-pressed',wrongOnly); retryIds=null;\n  applyFilter(); window.scrollTo({top:0});\n};\nfunction startRetry(){\n  const bad=items.filter(it=>itemStatus(it)==='bad');\n  if(!bad.length) return;\n  retryIds=new Set(bad.map(it=>it.id)); retryRound++;\n  for(const it of bad){\n    st[it.id]= it.kind==='mc'?{pick:null,revealed:false}:{revealed:false,self:null};\n    document.querySelectorAll(`input[data-q=\"${it.id}\"]`).forEach(i=>i.value='');\n  }\n  wrongOnly=false; document.getElementById('wrongOnly').setAttribute('aria-pressed','false');\n  if(mode==='exam'){ submitted=false; document.getElementById('submit').classList.remove('hidden'); }\n  items.forEach(it=>refreshItem(it.id));\n  updateStats(); window.scrollTo({top:0});\n}\ndocument.getElementById('retry').onclick=startRetry;\ndocument.getElementById('retryEnd').onclick=()=>{ retryIds=null; applyFilter(); window.scrollTo({top:0}); };\nconst lb=document.getElementById('lightbox');\ndocument.addEventListener('click',e=>{\n  if(e.target.matches('.fig img')){ lb.querySelector('img').src=e.target.src; lb.classList.remove('hidden'); }\n  else if(e.target.closest('#lightbox')) lb.classList.add('hidden');\n});\ndocument.addEventListener('keydown',e=>{\n  if(e.key==='Escape') lb.classList.add('hidden');\n  if(e.key==='Enter' && e.target.matches('.fig img')){ lb.querySelector('img').src=e.target.src; lb.classList.remove('hidden'); }\n});\nbuild(); items.forEach(it=>refreshItem(it.id)); updateStats();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";</script>
<script>QZ["u4"]="\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-Hant\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>英文 Unit 4 What Do You Want to Be in the Future?・互動練習\u003c/title>\n\u003cstyle>\n:root{\n  --bg:#EEF1EC; --paper:#FFFFFF; --ink:#1E2A3A; --muted:#5E6875; --line:#D5DAD2;\n  --indigo:#2B4C7E; --indigo-soft:#E4EAF4;\n  --jade:#21704F; --jade-soft:#E2F1E8;\n  --cinnabar:#B5382C; --cinnabar-soft:#F8E4E1;\n  --chip:#F4F6F2; --shadow:0 1px 0 rgba(30,42,58,.06);\n  --kai:\"BiauKai\",\"DFKai-SB\",\"標楷體\",\"TW-Kai\",\"Kaiti TC\",\"STKaiti\",\"Noto Serif TC\",serif;\n  --sans:\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",system-ui,sans-serif;\n  color-scheme:light;\n}\n@media (prefers-color-scheme: dark){\n  :root{\n    --bg:#13181F; --paper:#1B222C; --ink:#E6EAF0; --muted:#9AA4B2; --line:#2E3845;\n    --indigo:#8FB0E6; --indigo-soft:#22304A;\n    --jade:#6FD1A2; --jade-soft:#173A2C;\n    --cinnabar:#F08A7E; --cinnabar-soft:#3E2020;\n    --chip:#232B36; --shadow:none;\n    color-scheme:dark;\n  }\n  .fig img{background:#fff}\n}\n*{box-sizing:border-box}\nhtml{scroll-padding-top:150px}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;\n  padding-bottom:env(safe-area-inset-bottom,0px)}\nheader{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);\n  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}\n.bar{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}\nh1{font-family:var(--kai);font-size:1.35rem;margin:0;font-weight:700;letter-spacing:.04em}\n.stats{display:flex;gap:14px;font-size:.92rem;color:var(--muted);margin-left:auto}\n.stats b{color:var(--ink);font-size:1.05rem;font-variant-numeric:tabular-nums}\n.stats{flex-wrap:wrap;row-gap:2px}\n.stats .ok b{color:var(--jade)} .stats .bad b{color:var(--cinnabar)}\n.to lor:var(--muted);font-weight:400}\n.q{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow)}\n.qhead{display:flex;gap:12px}\n.no{flex:none;font-family:var(--kai);font-weight:700;font-size:1.05rem;min-width:2.2em;color:var(--muted)}\n.body{flex:1;min-width:0}\n.stem{font-family:var(--kai);font-size:1.12rem;line-height:1.85}\n.stem p{margin:0 0 .5em;white-space:pre-wrap}\n.fig{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}\n.fig img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;cursor:zoom-in}\n.crop{position:relative;display:inline-block;max-width:100%;overflow:hidden;border:1px solid var(--line);border-radius:4px;background:#fff}\n.crop img{position:absolute;max-width:none;border:0;border-radius:0}\n.fig .crop img{cursor:zoom-in}\n.imgopts{grid-template-columns:repeat(2,minmax(0,1fr))}\n.imgopts.wide{grid-template-columns:1fr}\n@media (max-width:560px){.imgopts{grid-template-columns:1fr}}\n.optimg img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#fff;display:block}\n.blank{display:inline-block;width:3.2em;border-bottom:1.5px solid currentColor;margin:0 .25em;vertical-align:baseline;height:1em}\n.caption{text-align:center;color:var(--muted);font-size:.95rem;margin-top:-4px}\ntable.t{border-collapse:collapse;margin:10px auto;font-family:var(--kai);font-size:1.02rem}\n.tblwrap{overflow-x:auto}\ntable.t td{border:1px solid var(--muted);padding:5px 12px;white-space:pre-wrap;vertical-align:middle}\n.opts{display:grid;gap:6px;margin-top:10px}\n.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);\n  border-radius:8px;padding:8px 12px;font-family:var(--kai);font-size:1.05rem;line-height:1.6;cursor:pointer}\n.opt:hover:not(:disabled){border-color:var(--indigo);background:var(--indigo-soft)}\n.opt .l{flex:none;font-weight:700;color:var(--muted)}\n.opt .mark{margin-left:auto;flex:none;font-family:var(--sans);font-weight:700}\n.opt.sel{border-color:var(--indigo);background:var(--indigo-soft)}\n.opt.sel .l{color:var(--indigo)}\n.opt.right{border-color:var(--jade);background:var(--jade-soft)}\n.opt.right .l,.opt.right .mark{color:var(--jade)}\n.opt.wrong{border-color:var(--cinnabar);background:var(--cinnabar-soft)}\n.opt.wrong .l,.opt.wrong .mark{color:var(--cinnabar)}\n.opt:disabled{cursor:default}\n.exp{margin-top:10px;border-left:3px solid var(--jade);background:var(--chip);padding:8px 12px;border-radius:0 6px 6px 0;font-size:.98rem;white-space:pre-wrap}\n.exp.bad{border-left-color:var(--cinnabar)}\n.exp .verdict{font-weight:700;margin-right:6px}\n.exp .verdict.ok{color:var(--jade)} .exp .verdict.no{color:var(--cinnabar)}\n.sub{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;display:flex;gap:10px}\n.sub .no{font-size:1rem}\n.gstem{background:var(--chip);border-radius:8px;padding:12px 14px}\n.open{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}\n.open label{display:flex;align-items:center;gap:6px;font-family:var(--kai);font-size:1.05rem}\n.open input{font:inherit;font-size:1rem;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);min-width:6em}\n.open input.wide{min-width:min(26em,100%);flex:1}\n.selfmark{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}\n.hidden{display:none!important}\n.result{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}\n.seal{width:112px;height:112px;flex:none;border:4px solid var(--cinnabar);border-radius:10px;color:var(--cinnabar);display:flex;flex-direction:column;align-items:center;justify-content:center;\n  font-family:var(--kai);transform:rotate(-6deg)}\n.seal b{font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}\n.seal span{font-size:.85rem;margin-top:4px}\n@media (prefers-reduced-motion:no-preference){.seal.stamp{animation:stamp .35s ease-out}}\n@keyframes stamp{from{transform:rotate(-6deg) scale(1.6);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}\n.result p{margin:0}\n.btn:disabled{opacity:.45;cursor:not-allowed}\n.retrybar{max-width:900px;margin:14px auto 0;padding:10px 14px;border:1px solid var(--cinnabar);background:var(--cinnabar-soft);\n  border-radius:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;color:var(--ink)}\n@media (max-width:920px){.retrybar{margin:14px 16px 0}}\n.lightbox{position:fixed;inset:0;background:rgba(10,14,20,.86);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;cursor:zoom-out}\n.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:4px}\n.empty{color:var(--muted);text-align:center;padding:30px 0}\n@media (max-width:560px){\n  html{scroll-padding-top:230px}\n  .stats{margin-left:0;width:100%}\n  .q{padding:14px 12px}\n  .qhead{gap:6px}\n  .stem{font-size:1.05rem}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003cdiv class=\"bar\">\n    \u003ch1>英文 Unit 4 What Do You Want to Be in the Future?・互動練習\u003c/h1>\n    \u003cdiv class=\"stats\">\n      \u003cspan>已作答 \u003cb id=\"answered\">0\u003c/b> / \u003cb id=\"total\">0\u003c/b>\u003c/span>\n      \u003cspan>得分 \u003cb id=\"score\">0\u003c/b> / \u003cspan id=\"full\">\u003c/span>\u003c/span>\n      \u003cspan class=\"ok\">答對 \u003cb id=\"nOk\">0\u003c/b>\u003c/span>\n      \u003cspan class=\"bad\">答錯 \u003cb id=\"nBad\">0\u003c/b>\u003c/span>\n      \u003cspan>答對率 \u003cb id=\"rate\">–\u003c/b>\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"tools\">\n    \u003cdiv class=\"seg\" role=\"group\" aria-label=\"作答模式\">\n      \u003cbutton id=\"modePractice\" aria-pressed=\"true\">練習：選了就對答案\u003c/button>\n      \u003cbutton i y tests（考試）at school tomorrow（明天）.  Mom: My poor girl.  Don’t worry about the tests.  Just go to bed now.\"}]}], \"opts\": {\"Ａ\": \"It’s not bad to study so late.\", \"Ｂ\": \"Are you playing with something special?\", \"Ｃ\": \"Isn’t it bad for your health to go to bed so late?\", \"Ｄ\": \"Getting up early is important for students.\"}, \"ans\": \"Ｃ\", \"exp\": \"媽媽認為「太晚就寢不是對健康不好嗎？」，她要　Emi　不要擔心明天的考試，就去睡覺了吧。\"}, {\"stem\": [{\"k\": \"p\", \"c\": [{\"k\": \"t\", \"v\": \"This is my first time to sing in front of so many people.  　　　\"}]}], \"opts\": {\"Ａ\": \"May I give it a try?\", \"Ｂ\": \"How come I keep getting butterflies in my stomach?\", \"Ｃ\": \"It’s my last time to give it up.\", \"Ｄ\": \"Was I doing a good job when I was singing on stage?\"}, \"ans\": \"Ｂ\", \"exp\": \"這是我第一次在這麼多人面前唱歌。「我怎麼一直感到緊張呢？」。\"}, {\"stem\": [{\"k\": \"p\", \"c\": [{\"k\": \"t\", \"v\": \"Zoey: Don’t you remember 　　　?  When do you plan to give it back to me?  Pete: What?!  You lent so much money to me?  How could it be?\"}]}], \"opts\": {\"Ａ\": \"to borrow my money\", \"Ｂ\": \"to lend me some money\", \"Ｃ\": \"borrowing some money from me\", \"Ｄ\": \"lending so much money to me\"}, \"ans\": \"Ｃ\", \"exp\": \"remember＋V-ing...：記得做過　V...　的動作（做過了）；remember＋to V...：記得要去做　V...　的動作（還沒做）。由語意是「Pete　向　Zoey　借過錢」，故選(Ｃ)。\"}, {\"stem\": [{\"k\": \"p\", \"c\": [{\"k\": \"t\", \"v\": \"A: Being a YouTuber isn’t easy for us.  We need to have a special gift to do that.   B: Like what?  A: 　　　\"}]}], \"opts\": {\"Ａ\": \"Give me a special toy, please.\", \"Ｂ\": \"I can bring it to you tonight.\", \"Ｃ\": \"I want to buy some gifts for you.\", \"Ｄ\": \"You need to be good at singing, acting or telling stories.\"}, \"ans\": \"Ｄ\", \"exp\": \"回答當Youtuber需要的能力，像是唱歌、表演或說故事，僅選項Ｄ比較符合。\\n語譯：\\nＡ：當Youtuber對我們來說不容易，我們需要做些特別的事。\\nＢ：像什麼？\\nＡ：你需要擅長唱歌、說故事。\"}, {\"stem\": [{\"k\": \"p\", \"c\": [{\"k\": \"t\", \"v\": \"What are you doing?  B: I’m reading abut a special job.  A: What is the special job?  B: A man can make good money from this job by sleeping in a hotel（飯店）and then reporting his feelings.  A: Wow.  That’s interesting.  Many people would（將會）kill for that job.  B: You’re right.  　　　\"}]}], \"opts\": {\"Ａ\": \"It’s important to team up with other people.\", \"Ｂ\": \"I can finish the report tonight.\", \"Ｃ\": \"It’s very exciting to sleep in a hotel.\", \"Ｄ\": \"It’s not easy to fight one hundred people to get it.\"}, \"ans\": \"Ｄ\", \"exp\": \"根據文章可知，這種工作輕鬆有可賺錢，因此許多人會為了此份工作搶破頭，答案選（Ｄ）與一百人競爭那份工作不是件簡單的事。\\n（Ａ）跟別人合作很重要；（Ｂ）我可以今晚完成報告；（Ｃ）在飯店睡覺很放鬆。\\n語譯：\\nA:你在做什麼？\\nB:我正在閱讀關於一種特別的工作。\\nA:是什麼特別的工作？\\nB: 這份工作藉由在飯店睡覺並回報感受，就可以賺不少的錢。\\nA:哇！真有趣，很多人會為了這種工作搶破頭。\\nB:你說的沒錯，要與一百個人競爭那份工作不是件簡單的事。\"}], \"group\": [], \"sections\": [[0, 174], [174, 232]]};\nconst IMGS = {};\nconst CFG = {\"full\": 232, \"singlePts\": 1, \"groupPts\": 1, \"blanks\": true, \"latinFont\": true, \"sections\": [{\"title\": \"文法選擇\", \"note\": \"共 174 題，每題 1 分\", \"start\": 0, \"end\": 174}, {\"title\": \"對話與完成句子\", \"note\": \"共 58 題，每題 1 分\", \"start\": 174, \"end\": 232}]};\ndocument.getElementById('full').textContent=CFG.full;\nif(CFG.latinFont) document.documentElement.style.setProperty('--kai','\"Georgia\",\"Times New Roman\",\"BiauKai\",\"DFKai-SB\",\"標楷體\",\"TW-Kai\",\"Kaiti TC\",\"Noto Serif TC\",serif');\nconst FW = '１２３４５６７８９';\nconst LET = ['Ａ','Ｂ','Ｃ','Ｄ'];\nlet mode = 'practice';\nlet submitted = false;\nlet wrongOnly = false;\nlet retryIds = null; // Set of ids being re-practised\nlet retryRound = 0;\nconst st = {};   // id -> {pick, revealed, open:{vals,self}}\nconst items = []; // {id, kind:'mc'|'open', pts, ans, navLabel, cardId}\n\nfunction el(tag, attrs={}, ...kids){\n  const e=document.createElement(tag);\n  for(const[k,v] of Object.entries(attrs)){\n    if(k==='class') e.className=v; else if(k==='text') e.textContent=v; else e.setAttribute(k,v);\n  }\n  for(const k of kids){ if(k!=null) e.append(k); }\n  return e;\n}\nfunction renderStem(blocks){\n  const box=el('div',{class:'stem'});\n  for(const b of blocks){\n    if(b.k==='tbl'){\n      const t=el('table',{class:'t'});\n      for(const r of b.rows){\n        const tr=el('tr');\n        for(const c of r){\n          const td=el('td',{text:c.v});\n          if(c.cs>1) td.colSpan=c.cs; if(c.rs>1) td.rowSpan=c.rs;\n          tr.append(td);\n        }\n        t.append(tr);\n      }\n      box.append(el('div',{class:'tblwrap'},t));\n      continue;\n    }\n    const hasImg=b.c.some(n=>n.k==='img');\n    if(hasImg){\n      const fig=el('div',{class:'fig'});\n      for(const n of b.c){\n        if(n.k!=='img') continue;\n        fig.append(makeImg(n,1.6));\n      }\n      box.append(fig);\n    } else {\n      const txt=b.c.map(n=>n.v).join('');\n      if(/^▲?\\s*圖\\s*[\\(（]?[一二三四五六七八九十]+[\\)）]?$/.test(txt.trim())) box.append(el('div',{class:'caption',text:txt.trim()}));\n      else box.append(CFG.blanks ? blankP(txt) : el('p',{text:txt}));\n    }\n  }\n  return box;\n}\nfunction blankP(txt){\n  const p=el('p');\n  txt.split(/(\\u3000{3,})/).forEach((seg,i)=>{\n    if(i%2) p.append(el('span',{class:'blank','aria-label':'空格'}));\n    else if(seg) p.append(seg);\n  });\n  return p;\n}\nfunction makeImg(n,scale){\n  const W=Math.round(n.w*scale), H=Math.round(n.h*scale);\n  const img=el('img',{src:IMGS[n.src],alt:'附圖',tabindex:'0'});\n  if(!n.crop){\n    img.width=W; img.height=H; img.style.width=W+'px';\n    return img;\n  }\n  // reproduce Word's crop without altering the original image file\n  const c=Object.assign({l:0,t:0,r:0,b:0},n.crop);\n  const box=el('span',{class:'crop'});\n  box.style.width=W+'px'; box.style.aspectRatio=W+' / '+H;\n  img.style.width=(100/(1-c.l-c.r))+'%';\n  img.style.left=(-100*c.l/(1-c.l-c.r))+'%';\n  img.style.top=(-100*c.t/(1-c.t-c.b))+'%';\n  box.append(img);\n  return box;\n}\nfunction optContent(v){\n  if(typeof v==='string') return el('span',{text:v});\n  const s=el('span',{class:'optimg'});\n  for(const n of v.nodes){\n    if(n.k==='img') s.append(makeImg(n,1.4)); else s.append(n.v);\n  }\n  return s;\n}\nfunction expBox(id){ return el('div',{class:'exp hidden',id:'exp-'+id}); }\n\nfunction buildMC(id, q, pts, navLabel, cardId){\n  items.push({id,kind:'mc',pts,ans:q.ans,navLabel,cardId,exp:q.exp,gexp:q.gexp});\n  st[id]={pick:null,revealed:false};\n  const imgVals=Object.values(q.opts).filter(v=>typeof v!=='string');\n  const wide=imgVals.some(v=>v.nodes.some(n=>n.k==='img'&&n.w*1.4>360));\n  const wrap=el('div',{class:'opts'+(imgVals.length?(wide?' imgopts wide':' imgopts'):'')});\n  LET.forEach(L=>{\n    if(!(L in q.opts)) return;\n    const b=el('button',{class:'opt','data-q':id,'data-l':L,type:'button'},\n      el('span',{class:'l',text:'('+L+')'}), optContent(q.opts[L]), el('span',{class:'mark'}));\n    b.addEventListener('click',()=>pick(id,L));\n    wrap.append(b);\n  });\n  return [wrap, expBox(id)];\n}\nfunction buildOpen(id, q, pts, navLabel, cardId){\n  items.push({id,kind:'open',pts,ans:q.ans,navLabel,cardId,fields:q.fields});\n  st[id]={revealed:false,self:null};\n  const box=el('div',{class:'open'});\n  q.fields.forEach((f,i)=>{\n    const inp=el('input',{type:'text','data-q':id,'data-i':i,placeholder:'輸入答案'});\n    if(!f) inp.classList.add('wide');\n    inp.addEventListener('input',()=>{ updateStats(); });\n    box.append(f? el('label',{},f+'：',inp) : inp);\n  });\n  const show=el('button',{class:'btn',type:'button',id:'show-'+id,text:'看參考答案'});\n  show.addEventListener('click',()=>{ st[id].revealed=true; refreshItem(id); updateStats(); });\n  box.append(show);\n  return [box, expBox(id)];\n}\n\nfunction build(){\n  const main=document.getElementById('main');\n  const nav=document.getElementById('nav');\n  const secs = CFG.sections || [{title:'單題',note:CFG.singleNote,start:0,end:DATA.single.length}];\n  DATA.single.forEach((q,i)=>{\n    const sec=secs.find(s=>s.start===i);\n    if(sec){\n      main.append(el('h2',{},sec.title,el('small',{text:sec.note||''})));\n      nav.append(el('div',{class:'sep',text:sec.title}));\n    }\n    const id='s'+(i+1), cardId='card-'+id;\n    const card=el('section',{class:'q',id:cardId,'data-ids':id});\n    const body=el('div',{class:'body'},renderStem(q.stem),...buildMC(id,q,CFG.singlePts,String(i+1),cardId));\n    card.append(el('div',{class:'qhead'},el('div',{class:'no',text:(i+1)+'.'}),body));\n    main.append(card);\n    nav.append(el('a',{href:'#'+cardId,id:'nav-'+id,text:String(i+1)}));\n  });\n  if(DATA.group.length){\n    main.append(el('h2',{},'題組',el('small',{text:CFG.groupNote})));\n    nav.append(el('div',{class:'sep',text:'題組'}));\n  }\n  DATA.group.forEach((g,gi)=>{\n    const cardId='card-g'+(gi+1);\n    const card=el('section',{class:'q',id:cardId});\n    const ids=[];\n    const body=el('div',{class:'body'});\n    if(g.stem.length) body.append(el('div',{class:'gstem'},renderStem(g.stem)));\n    g.subs.forEach(s=>{\n      const id='g'+(gi+1)+'-'+s.n; ids.push(id);\n      const label=(gi+1)+'-'+s.n;\n      const parts= s.open ? buildOpen(id,s,CFG.groupPts,label,cardId) : buildMC(id,s,CFG.groupPts,label,cardId);\n      const sub=el('div',{class:'sub',id:'sub-'+id},el('div',{class:'no',text:'('+FW[s.n-1]+')'}),\n        el('div',{class:'body'},renderStem(s.stem),...parts));\n      body.append(sub);\n      nav.append(el('a',{href:'#sub-'+id,id:'nav-'+id,text:label}));\n    });\n    card.dataset.ids=ids.join(',');\n    card.append(el('div',{class:'qhead'},el('div',{class:'no',text:'組'+(gi+1)}),body));\n    main.append(card);\n  });\n  const res=el('div',{class:'result hidden',id:'result'});\n  main.append(res);\n  main.append(el('p',{class:'empty hidden',id:'empty',text:'目前沒有錯題。'}));\n  document.getElementById('total').textContent=items.length;\n}\n\nfunction pick(id,L){\n  const s=st[id];\n  if(s.revealed) return;\n  s.pick=L;\n  if(mode==='practice') s.revealed=true;\n  refreshItem(id); updateStats();\n}\nfunction itemStatus(it){\n  const s=st[it.id];\n  if(it.kind==='mc'){\n    if(!s.pick) return s.revealed?'bad':'none';\n    if(!s.revealed) return 'done';\n    return s.pick===it.ans?'ok':'bad';\n  } else {\n    if(s.self==='ok') return 'ok';\n    if(s.self==='bad') return 'bad';\n    return hasOpenInput(it)?'done':'none';\n  }\n}\nfunction hasOpenInput(it){\n  return [...document.querySelectorAll(`input[data-q=\"${it.id}\"]`)].some(i=>i.value.trim());\n}\nfunction refreshItem(id){\n  const it=items.find(x=>x.id===id), s=st[id];\n  const exp=document.getElementById('exp-'+id);\n  if(it.kind==='mc'){\n    document.querySelectorAll(`.opt[data-q=\"${id}\"]`).forEach(b=>{\n      const L=b.dataset.l; b.className='opt'; b.querySelector('.mark').textContent='';\n      b.disabled=s.revealed;\n      if(s.revealed){\n        if(L===it.ans){ b.classList.add('right'); b.querySelector('.mark').textContent='✓'; }\n        else if(L===s.pick){ b.classList.add('wrong'); b.querySelector('.mark').textContent='✗'; }\n      } else if(L===s.pick) b.classList.add('sel');\n      b.setAttribute('aria-pressed', L===s.pick ? 'true':'false');\n    });\n    if(s.revealed){\n      exp.innerHTML='';\n      const ok=s.pick===it.ans;\n      const v=el('span',{class:'verdict '+(ok?'ok':'no'),text: s.pick ? (ok?'答對了！':'答錯了。') : '未作答。'});\n      exp.append(v, '正確答案：('+it.ans+')');\n      const e=it.exp||it.gexp;\n      if(e) exp.append('\\n解析：'+e);\n      exp.classList.toggle('bad',!ok);\n      exp.classList.remove('hidden');\n    } else exp.classList.add('hidden');\n  } else {\n    const show=document.getElementById('show-'+id);\n    const inputs=document.querySelectorAll(`input[data-q=\"${id}\"]`);\n    inputs.forEach(i=>i.readOnly=s.revealed);\n    show.classList.toggle('hidden',s.revealed || (mode==='exam'&&!submitted));\n    if(s.revealed){\n      exp.innerHTML='';\n      const ansText=it.fields[0]? it.fields.map((f,i)=>f+'：'+it.ans[i]).join('　') : it.ans[0];\n      exp.append(el('span',{class:'verdict ok',text:'參考答案：'}),ansText);\n      const sm=el('div',{class:'selfmark'},'自己對照後評分：');\n      const b1=el('button',{class:'btn',type:'button',text:'我答對了'}), b2=el('button',{class:'btn',type:'button',text:'我答錯了'});\n      b1.setAttribute('aria-pressed',s.self==='ok'?'true':'false'); b2.setAttribute('aria-pressed',s.self==='bad'?'true':'false');\n      b1.onclick=()=>{s.self='ok';refreshItem(id);updateStats();};\n      b2.onclick=()=>{s.self='bad';refreshItem(id);updateStats();};\n      sm.append(b1,b2); exp.append(sm);\n      exp.classList.toggle('bad',s.self==='bad');\n      exp.classList.remove('hidden');\n    } else exp.classList.add('hidden');\n  }\n  const n=document.getElementById('nav-'+id);\n  n.className=''; const stt=itemStatus(it); if(stt!=='none') n.classList.add(stt);\n}\nfunction updateStats(){\n  let answered=0, score=0;\n  for(const it of items){\n    const s=st[it.id];\n    if(it.kind==='mc'){ if(s.pick) answered++; if(s.revealed && s.pick===it.ans) score+=it.pts; }\n    else { if(hasOpenInput(it)||s.self) answered++; if(s.self==='ok') score+=it.pts; }\n    const n=document.getElementById('nav-'+it.id);\n    n.className=''; const stt=itemStatus(it); if(stt!=='none') n.classList.add(stt);\n  }\n  document.getElementById('answered').textContent=answered;\n  document.getElementById('score').textContent=+score.toFixed(1);\n  const nOk=items.filter(it=>itemStatus(it)==='ok').length;\n  const nBad=items.filter(it=>itemStatus(it)==='bad').length;\n  const rateTxt=(nOk+nBad)? (Math.round(nOk/(nOk+nBad)*1000)/10)+'%' : '–';\n  document.getElementById('nOk').textContent=nOk;\n  document.getElementById('nBad').textContent=nBad;\n  document.getElementById('rate').textContent=rateTxt;\n  const allRevealed=items.every(it=>st[it.id].revealed);\n  const res=document.getElementById('result');\n  if(allRevealed){\n    const wrong=items.filter(it=>itemStatus(it)==='bad').length;\n    const pending=items.filter(it=>it.kind==='open'&&!st[it.id].self).length;\n    const had=!res.classList.contains('hidden');\n    res.innerHTML='';\n    const seal=el('div',{class:'seal'+(had?'':' stamp')},el('b',{text:String(+score.toFixed(1))}),el('span',{text:'滿分 '+CFG.full}));\n    const txt=el('div',{},el('p',{text:`共 ${items.length} 題：答對 ${nOk} 題，答錯或未作答 ${wrong} 題，答對率 ${rateTxt}。`}),\n      el('p',{text: pending?`還有 ${pending} 題問答題尚未自評，評分後才會計入得分。`:'按「只看錯題」可以集中複習答錯的題目。'}));\n    res.append(seal,txt); res.classList.remove('hidden');\n  } else res.classList.add('hidden');\n  applyFilter();\n}\nfunction applyFilter(){\n  let any=false;\n  document.querySelectorAll('section.q').forEach(card=>{\n    const ids=card.dataset.ids.split(',');\n    let show=false;\n    ids.forEach(id=>{\n      const it=items.find(x=>x.id===id);\n      const keep = retryIds ? retryIds.has(id) : itemStatus(it)==='bad';\n      const filtering = retryIds || wrongOnly;\n      const sub=document.getElementById('sub-'+id);\n      if(sub) sub.classList.toggle('hidden', !!filtering && !keep);\n      if(keep) show=true;\n    });\n    const filtering = retryIds || wrongOnly;\n    card.classList.toggle('hidden', !!filtering && !show);\n    if(show) any=true;\n  });\n  const filtering = !!(retryIds || wrongOnly);\n  document.querySelectorAll('h2').forEach(h=>h.classList.toggle('hidden',filtering));\n  document.getElementById('empty').classList.toggle('hidden',!(filtering&&!any));\n  const nBad=items.filter(it=>itemStatus(it)==='bad').length;\n  document.getElementById('retry').disabled = nBad===0;\n  const bar=document.getElementById('retrybar');\n  bar.classList.toggle('hidden',!retryIds);\n  if(retryIds){\n    const ids=[...retryIds].map(id=>items.find(x=>x.id===id));\n    const done=ids.filter(it=>['ok','bad'].includes(itemStatus(it)));\n    const ok=done.filter(it=>itemStatus(it)==='ok').length;\n    document.getElementById('retryText').textContent =\n      `第 ${retryRound} 次重練：共 ${ids.length} 題，已完成 ${done.length} 題，這次答對 ${ok} 題` +\n      (done.length===ids.length ? (ok===ids.length ? '，全部答對了！' : `，還有 ${ids.length-ok} 題答錯，可以再按「重練錯題」。`) : '。');\n  }\n}\nfunction resetAll(){\n  for(const it of items){\n    st[it.id]= it.kind==='mc'?{pick:null,revealed:false}:{revealed:false,self:null};\n    document.querySelectorAll(`input[data-q=\"${it.id}\"]`).forEach(i=>i.value='');\n    refreshItem(it.id);\n  }\n  submitted=false; wrongOnly=false; retryIds=null; retryRound=0;\n  document.getElementById('wrongOnly').setAttribute('aria-pressed','false');\n  document.getElementById('result').classList.add('hidden');\n  document.getElementById('submit').classList.toggle('hidden',mode!=='exam');\n  updateStats(); window.scrollTo({top:0});\n}\nfunction setMode(m){\n  const anything=items.some(it=>{const s=st[it.id];return s.pick||s.revealed||hasOpenInput(it);});\n  if(m===mode) return;\n  if(anything && !confirm('切換模式會清除目前的作答紀錄，確定要切換嗎？')) return;\n  mode=m;\n  document.getElementById('modePractice').setAttribute('aria-pressed',m==='practice');\n  document.getElementById('modeExam').setAttribute('aria-pressed',m==='exam');\n  resetAll();\n}\ndocument.getElementById('modePractice').onclick=()=>setMode('practice');\ndocument.getElementById('modeExam').onclick=()=>setMode('exam');\ndocument.getElementById('reset').onclick=()=>{ if(confirm('確定要清除所有作答，重新開始嗎？')) resetAll(); };\ndocument.getElementById('submit').onclick=()=>{\n  const left=items.filter(it=>itemStatus(it)==='none').length;\n  if(left && !confirm(`還有 ${left} 題沒作答，確定要交卷嗎？`)) return;\n  submitted=true;\n  for(const it of items){ st[it.id].revealed=true; refreshItem(it.id); }\n  document.getElementById('submit').classList.add('hidden');\n  updateStats();\n  document.getElementById('result').scrollIntoView({behavior:'smooth'});\n};\ndocument.getElementById('wrongOnly').onclick=e=>{\n  wrongOnly=!wrongOnly; e.currentTarget.setAttribute('aria-pressed',wrongOnly); retryIds=null;\n  applyFilter(); window.scrollTo({top:0});\n};\nfunction startRetry(){\n  const bad=items.filter(it=>itemStatus(it)==='bad');\n  if(!bad.length) return;\n  retryIds=new Set(bad.map(it=>it.id)); retryRound++;\n  for(const it of bad){\n    st[it.id]= it.kind==='mc'?{pick:null,revealed:false}:{revealed:false,self:null};\n    document.querySelectorAll(`input[data-q=\"${it.id}\"]`).forEach(i=>i.value='');\n  }\n  wrongOnly=false; document.getElementById('wrongOnly').setAttribute('aria-pressed','false');\n  if(mode==='exam'){ submitted=false; document.getElementById('submit').classList.remove('hidden'); }\n  items.forEach(it=>refreshItem(it.id));\n  updateStats(); window.scrollTo({top:0});\n}\ndocument.getElementById('retry').onclick=startRetry;\ndocument.getElementById('retryEnd').onclick=()=>{ retryIds=null; applyFilter(); window.scrollTo({top:0}); };\nconst lb=document.getElementById('lightbox');\ndocument.addEventListener('click',e=>{\n  if(e.target.matches('.fig img')){ lb.querySelector('img').src=e.target.src; lb.classList.remove('hidden'); }\n  else if(e.target.closest('#lightbox')) lb.classList.add('hidden');\n});\ndocument.addEventListener('keydown',e=>{\n  if(e.key==='Escape') lb.classList.add('hidden');\n  if(e.key==='Enter' && e.target.matches('.fig img')){ lb.querySelector('img').src=e.target.src; lb.classList.remove('hidden'); }\n});\nbuild(); items.forEach(it=>refreshItem(it.id)); updateStats();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";</script>
<script>QZ["lte"]="\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-Hant\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Let’s Talk in English 十月號 互動測驗\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+TC:wght@400;500;700;900&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --canvas:#F3F4F8; --surface:#FFFFFF; --ink:#18203F; --muted:#5A6283;\n  --ring:#1F2C66; --rope:#C8312B; --gold:#D9A520;\n  --line:#D7DAE6; --ok:#1E7F4F; --ok-bg:#E3F4EA; --bad:#B42318; --bad-bg:#FCE9E7;\n  --blank:#FFF3CC;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n  color-scheme:light;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --canvas:#10142A; --surface:#1A2040; --ink:#EEF0FA; --muted:#A3AACB;\n    --ring:#8FA2FF; --rope:#FF7A6E; --gold:#F2C34E;\n    --line:#2E3663; --ok:#6FD39C; --ok-bg:#16382A; --bad:#FF8F84; --bad-bg:#43201E;\n    --blank:#4A3E12; color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --canvas:#10142A; --surface:#1A2040; --ink:#EEF0FA; --muted:#A3AACB;\n  --ring:#8FA2FF; --rope:#FF7A6E; --gold:#F2C34E;\n  --line:#2E3663; --ok:#6FD39C; --ok-bg:#16382A; --bad:#FF8F84; --bad-bg:#43201E;\n  --blank:#4A3E12; color-scheme:dark;\n}\n*,*::before,*::after{box-sizing:border-box}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--canvas);color:var(--ink);\n  font-family:\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",system-ui,sans-serif;\n  font-size:17px;line-height:1.6}\n.wrap{max-width:720px;margin:0 auto;padding:14px 18px 48px}\n.hidden{display:none!important}\n\n/* unit icons */\n.unitbar{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}\n.uchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:76px;\n  border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px 6px;\n  font:inherit;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;line-height:1.2}\n.uchip .ic{font-size:24px;line-height:1}\n.uchip:hover{border-color:var(--ring)}\n.uchip[aria-current=\"true\"]{border-color:var(--rope);color:var(--ink);background:var(--canvas)}\n.uchip:focus-visible{outline:3px solid var(--ring);outline-offset:2px}\n\nheader{padding:10px 0 4px}\nh1{font-family:\"Archivo Black\",\"Noto Sans TC\",Impact,sans-serif;font-weight:400;\n  font-size:clamp(26px,6vw,40px);line-height:1.08;margin:0;color:var(--ring);letter-spacing:.3px}\n.sub{color:var(--muted);margin:6px 0 0;font-size:15px}\n\n.tabs{display:flex;gap:4px;margin:16px 0 0;border-bottom:2px solid var(--line)}\n.tab{font:inherit;font-weight:700;background:none;border:0;padding:10px 14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}\n.tab[aria-selected=\"true\"]{color:var(--ring);border-bottom-color:var(--rope)}\n.tab:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:6px}\n.badge{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:var(--rope);color:#fff;font-size:12px;line-height:20px;text-align:center;vertical-align:1px}\n\n/* home */\n.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}\n.ucard{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:2px solid var(--line);\n  border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}\n.ucard:hover{border-color:var(--ring)}\n.ucard:focus-visible{outline:3px solid var(--ring);outline-offset:2px}\n.ucard .ic{font-size:34px;line-height:1}\n.ucard b{font-size:17px;line-height:1.3}\n.ucard span{font-size:13px;color:var(--muted)}\n.homehint{color:var(--muted);margin:18px 0 0}\n\n/* rounds */\n.ropes{margin:20px 0 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n.round{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--muted);font:inherit}\n.round .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:6px}\n.round .bar i{display:block;height:100%;width:0;background:var(--rope);transition:width .3s}\n.round b{display:block;font-size:13px;font-weight:700}\n.round span{font-size:12px}\n.round[aria-current=\"true\"]{color:var(--ink)}\n.round:focus-visible{outline:2px solid var(--ring);outline-offset:4px;border-radius:4px}\n\n.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px}\n.qmeta{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:14px;margin-bottom:10px}\n.qnum{font-family:\"Archivo Black\",Impact,sans-serif;font-size:22px;color:var(--rope)}\n.word{display:inline-block;font-weight:900;color:var(--ring);font-size:20px;margin-bottom:4px}\n.prompt{font-size:19px;font-weight:500;margin:0 0 18px}\n.passage{background:var(--canvas);border-left:4px solid var(--gold);border-radius:8px;\n  padding:14px 16px;margin:0 0 18px;font-size:16px;line-height:1.85}\n.passage .gap{display:inline-block;min-width:3.2em;text-align:center;border-bottom:2px solid var(--muted);\n  padding:0 4px;font-weight:700;color:var(--muted);line-height:1.3}\n.passage .gap.now{background:var(--blank);border-color:var(--gold);color:var(--ink)}\n.passage .gap.filled{color:var(--ok);border-color:var(--ok)}\n.opts{display:grid;gap:10px}\n.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);\n  background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}\n.opt:hover:not(:disabled){border-color:var(--ring)}\n.opt:focus-visible{outline:3px solid var(--ring);outline-offset:2px}\n.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;\n  font-weight:900;font-size:14px;background:var(--canvas);color:var(--ring)}\n.opt:disabled{cursor:default}\n.opt.right{border-color:var(--ok);background:var(--ok-bg)}\n.opt.right .k{background:var(--ok);color:var(--surface)}\n.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}\n.opt.wrong .k{background:var(--bad);color:var(--surface)}\n.fb{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:15px;display:none}\n.fb.show{display:block}\n.fb.ok{background:var(--ok-bg)} .fb.no{background:var(--bad-bg)}\n.fb strong{display:block;margin-bottom:2px}\n.fb.ok strong{color:var(--ok)} .fb.no strong{color:var(--bad)}\n.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}\n.btn{font:inherit;font-weight:700;border-radius:10px;padding:11px 18px;cursor:pointer;border:2px solid var(--ring)}\n.btn.primary{background:var(--ring);color:var(--surface)}\n.btn.ghost{background:transparent;color:var(--ring)}\n.btn.small{padding:6px 12px;font-size:14px}\n.btn:disabled{opacity:.35;cursor:default}\n.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n\n/* result */\n.belt{text-align:center;padding:30px 16px;border-radius:18px;background:var(--ring);color:#fff;position:relative;overflow:hidden;margin-top:20px}\n.belt::before,.belt::after{content:\"\";position:absolute;top:50%;width:46%;height:56px;margin-top:-28px;background:rgba(255,255,255,.08)}\n.belt::before{left:-6%}.belt::after{right:-6%}\n.plate{position:relative;z-index:1;display:inline-block;background:linear-gradient(160deg,#F6D46A,#D9A520 55%,#A87A0E);\n  color:#3A2A00;border-radius:50%/40%;padding:26px 44px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.5)}\n.plate .big{font-family:\"Archivo Black\",Impact,sans-serif;font-size:56px;line-height:1}\n.plate .small{font-size:14px;font-weight:700}\n.verdict{position:relative;z-index:1;margin:16px 0 0;font-size:18px;font-weight:700}\n.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}\n.breakdown div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}\n.breakdown b{display:block;font-size:22px;color:var(--ring)}\n.breakdown span{font-size:13px;color:var(--muted)}\n.review h2{font-size:18px;margin:22px 0 10px}\n.review h3{font-size:15px;margin:14px 0 8px;color:var(--muted)}\n.review ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}\n.review li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px}\n.review li .q{font-weight:700}\n.review li .a{color:var(--muted)}\n.review li .a em{font-style:normal;color:var(--ok);font-weight:700}\n.review li .a s{color:var(--bad)}\n.allright{color:var(--ok);font-weight:700}\n.end-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}\n\n/* wrong book */\n#wrongbook{margin-top:20px}\n#wrongbook > .end-actions{margin:10px 0 4px}\n.wb-unit{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--line)}\n.wb-unit h2{margin:0;font-size:18px}\n.wb-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}\n.linkbtn{font:inherit;font-size:13px;background:none;border:0;color:var(--rope);cursor:pointer;padding:4px 0;text-decoration:underline}\n.empty{color:var(--muted);margin:8px 0 16px}\n@media (max-width:480px){.card{padding:18px 14px}.plate{padding:22px 32px}.plate .big{font-size:46px}}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cnav class=\"unitbar hidden\" id=\"unitbar\" aria-label=\"選擇單元\">\u003c/nav>\n\n  \u003cheader>\n    \u003ch1 id=\"title\">\u003c/h1>\n    \u003cp class=\"sub\" id=\"subtitle\">\u003c/p>\n  \u003c/header>\n\n  \u003cdiv class=\"tabs\" role=\"tablist\">\n    \u003cbutton class=\"tab\" id=\"tabTest\" role=\"tab\" aria-selected=\"true\">測驗\u003c/button>\n    \u003cbutton class=\"tab\" id=\"tabWrong\" role=\"tab\" aria-selected=\"false\">錯題本\u003cspan class=\"badge\" id=\"wrongCount\">0\u003c/span>\u003c/button>\n  \u003c/div>\n\n  \u003csection id=\"home\" class=\"hidden\">\n    \u003cp class=\"homehint\">點上方的小圖示，或下面任一個單元開始作答。\u003c/p>\n    \u003cdiv class=\"units\" id=\"unitCards\">\u003c/div>\n  \u003c/section>\n\n  \u003cnav class=\"ropes\" id=\"ropes\" aria-label=\"測驗回合\">\u003c/nav>\n\n  \u003cmain id=\"quiz\">\n    \u003csection class=\"card\" aria-live=\"polite\">\n      \u003cdiv class=\"qmeta\">\u003cspan class=\"qnum\" id=\"qnum\">\u003c/span>\u003cspan id=\"qsec\">\u003c/span>\u003c/div>\n      \u003cdiv id=\"passage\" class=\"passage hidden\">\u003c/div>\n      \u003cdiv id=\"wordtag\" class=\"word hidden\">\u003c/div>\n      \u003cp class=\"prompt\" id=\"prompt\">\u003c/p>\n      \u003cdiv class=\"opts\" id=\"opts\">\u003c/div>\n      \u003cdiv class=\"fb\" id=\"fb\">\u003c/div>\n    \u003c/section>\n    \u003cdiv class=\"nav\">\n      \u003cbutton class=\"btn ghost\" id=\"prev\">上一題\u003c/button>\n      \u003cbutton class=\"btn primary\" id=\"next\" disabled>下一題\u003c/button>\n    \u003c/div>\n  \u003c/main>\n\n  \u003csection id=\"result\" class=\"hidden\" aria-live=\"polite\">\n    \u003cdiv class=\"belt\">\n      \u003cdiv class=\"plate\">\u003cdiv class=\"big\" id=\"score\">0\u003c/div>\u003cdiv class=\"small\" id=\"scoreOf\">\u003c/div>\u003c/div>\n      \u003cp class=\"verdict\" id=\"verdict\">\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"breakdown\" id=\"breakdown\">\u003c/div>\n    \u003cdiv class=\"review\" id=\"review\">\u003c/div>\n    \u003cdiv class=\"end-actions\">\n      \u003cbutton class=\"btn primary\" id=\"retry\">重新作答\u003c/button>\n      \u003cbutton class=\"btn ghost\" id=\"retryWrong\">只練答錯的題目\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"wrongbook\" class=\"hidden\" aria-live=\"polite\">\n    \u003cp class=\"sub\" id=\"wbSummary\">\u003c/p>\n    \u003cdiv class=\"end-actions\" id=\"wbActions\">\n      \u003cbutton class=\"btn ghost\" id=\"wbClear\">清空錯題本\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"review\" id=\"wbList\">\u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cscript>\nconst UNITS = [{\"id\":\"dj\",\"icon\":\"🏆\",\"short\":\"Dwayne Johnson\",\"title\":\"Meet Dwayne Johnson\",\"sub\":\"Profile・10/1–10/2\",\"passage\":\"Dwayne Johnson was {6} in California in 1972. Wrestling was a big part of his life {7} his father and grandfather were both wrestlers. In college, he was a great football player, but he hurt his back and couldn’t play at the {8} level. Things didn’t {9} in football, so he turned to wrestling. He became very popular, and fans called him “The Rock.” Later, he started acting, and he has now {10} in more than 50 movies. He is also a man with a big {11} — he works with charities that help people in need. He gets up early every day and exercises to {12} fit.\",\"q\":[{\"s\":0,\"p\":\"What was Dwayne Johnson right before he became a movie star?\",\"o\":[\"A teacher\",\"A wrestler\",\"A cook\",\"A football coach\"],\"a\":1,\"e\":\"Conversation B 提到：成為電影明星之前，他是摔角選手；更早之前則是美式足球員。\"},{\"s\":0,\"p\":\"Why couldn’t Dwayne Johnson play professional football?\",\"o\":[\"He didn’t like football.\",\"His father wanted him to be a wrestler.\",\"He moved to a new school every year.\",\"He hurt his back.\"],\"a\":3,\"e\":\"課文說他背部受傷，因此很難在最高水準（top level）比賽。\"},{\"s\":0,\"p\":\"Why did Dwayne Johnson move a lot when he was growing up?\",\"o\":[\"Because of his father’s wrestling jobs.\",\"Because he wanted to make movies.\",\"Because he played football in college.\",\"Because his family worked for charities.\"],\"a\":0,\"e\":\"因為父親的摔角工作，他小時候常搬家，幾乎每年都轉學。\"},{\"s\":0,\"p\":\"In Conversation A, what does Ivy think about Dwayne Johnson in Jungle Cruise?\",\"o\":[\"He is boring.\",\"He is too serious.\",\"He is very funny.\",\"He doesn’t do any stunts.\"],\"a\":2,\"e\":\"Ivy 說 “Yes. He’s very funny!”\"},{\"s\":0,\"p\":\"Which of the following is TRUE?\",\"o\":[\"Dwayne Johnson was born in Hawaii in 1982.\",\"Dwayne Johnson has been in more than 50 movies.\",\"Zach saw the new Moana movie this summer.\",\"Dwayne Johnson still plays professional football.\"],\"a\":1,\"e\":\"他演過 50 部以上的電影。(A) 他 1972 年生於加州；(C) Zach 說他沒看；(D) 他早已不打美式足球。\"},{\"s\":1,\"g\":6,\"p\":\"第 (6) 格應填入：\",\"o\":[\"birth\",\"bearing\",\"born\",\"bring\"],\"a\":2,\"e\":\"be born 表「出生」，was born in California。\"},{\"s\":1,\"g\":7,\"p\":\"第 (7) 格應填入：\",\"o\":[\"because\",\"but\",\"so\",\"although\"],\"a\":0,\"e\":\"後半句說明原因（父親和祖父都是摔角選手），用 because。\"},{\"s\":1,\"g\":8,\"p\":\"第 (8) 格應填入：\",\"o\":[\"low\",\"bottom\",\"easy\",\"top\"],\"a\":3,\"e\":\"at the top level 表「在最高水準」，呼應背傷讓他無法在職業層級比賽。\"},{\"s\":1,\"g\":9,\"p\":\"第 (9) 格應填入：\",\"o\":[\"work on\",\"work out\",\"work for\",\"work in\"],\"a\":1,\"e\":\"work out 在此表「事情進展順利、成功」，didn’t work out = 沒有成功。\"},{\"s\":1,\"g\":10,\"p\":\"第 (10) 格應填入：\",\"o\":[\"been\",\"be\",\"being\",\"was\"],\"a\":0,\"e\":\"has + 過去分詞 been 是現在完成式：has been in more than 50 movies。\"},{\"s\":1,\"g\":11,\"p\":\"第 (11) 格應填入：\",\"o\":[\"muscle\",\"smile\",\"hand\",\"heart\"],\"a\":3,\"e\":\"a big heart 指心胸寬大、慷慨慈善，和後面幫助需要的人相呼應。\"},{\"s\":1,\"g\":12,\"p\":\"第 (12) 格應填入：\",\"o\":[\"staying\",\"stays\",\"stay\",\"stayed\"],\"a\":2,\"e\":\"to + 原形動詞表目的：exercises to stay fit（運動以保持健康）。\"},{\"s\":2,\"w\":\"movie\",\"p\":\"Let’s go to the theater and watch a new ______ tonight.\",\"o\":[\"movie\",\"muscle\",\"level\",\"charity\"],\"a\":0,\"e\":\"movie [ˋmuvɪ] (n.) 電影\"},{\"s\":2,\"w\":\"scene\",\"p\":\"The first ______ of the show takes place on a beach.\",\"o\":[\"hero\",\"chase\",\"scene\",\"stunt\"],\"a\":2,\"e\":\"scene [sin] (n.) 場景\"},{\"s\":2,\"w\":\"chase\",\"p\":\"The police car followed the thief in an e
