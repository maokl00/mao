 a glass of fresh apple cider!\",\"q\":[{\"s\":0,\"p\":\"What can you do with the pumpkins you take home from a pumpkin patch?\",\"o\":[\"Decorate them\",\"Sell them at the market\",\"Feed them to farm animals\",\"Use them to make cider\"],\"a\":0,\"e\":\"短文說 choose a few to take home to decorate，把南瓜帶回家裝飾。\"},{\"s\":0,\"p\":\"What usually happened to Zach in corn mazes?\",\"o\":[\"He won a prize.\",\"He finished in the shortest time.\",\"He got lost.\",\"He never went into one.\"],\"a\":2,\"e\":\"Zach 說 But I usually got lost in them! 得獎的是他的朋友。\"},{\"s\":0,\"p\":\"How long can apples last in the refrigerator?\",\"o\":[\"Seven to ten days\",\"About one week\",\"About one year\",\"One to three months\"],\"a\":3,\"e\":\"Betty 說放冰箱可以保存一到三個月（they last one to three months）。7–10 天是新鮮蘋果酒的保存期限。\"},{\"s\":0,\"p\":\"Why is picking apples at the farm a good idea, according to Betty and Milo?\",\"o\":[\"The apples are free.\",\"The apples are cheaper and fresher than at the supermarket.\",\"The farmer gives everyone apple pies.\",\"The supermarket has no apples.\"],\"a\":1,\"e\":\"Betty 說每磅價格比超市便宜，Milo 說蘋果也新鮮得多。蘋果要付錢，所以不是免費的。\"},{\"s\":0,\"p\":\"Why does Betty tell Milo to drink the cider fairly soon?\",\"o\":[\"The cider doesn’t taste very good.\",\"The farmer wants the bottle back.\",\"Fresh cider only lasts 7–10 days.\",\"Cider is only sold in the fall.\"],\"a\":2,\"e\":\"Betty 說 Fresh cider only lasts 7–10 days，所以要盡快喝完。\"},{\"s\":1,\"p\":\"第 (6) 格應填入：\",\"o\":[\"indoors\",\"outdoor\",\"outside of\",\"outdoors\"],\"a\":3,\"e\":\"be outdoors 表「在戶外」；outdoor 是形容詞，後面要接名詞。\",\"g\":6},{\"s\":1,\"p\":\"第 (7) 格應填入：\",\"o\":[\"for\",\"to\",\"with\",\"of\"],\"a\":1,\"e\":\"fun to + 原形動詞：fun to pet（摸起來很好玩）。\",\"g\":7},{\"s\":1,\"p\":\"第 (8) 格應填入：\",\"o\":[\"lost\",\"lose\",\"losing\",\"loss\"],\"a\":0,\"e\":\"get lost 表「迷路」，without getting lost = 不迷路。\",\"g\":8},{\"s\":1,\"p\":\"第 (9) 格應填入：\",\"o\":[\"much\",\"more\",\"many\",\"lot\"],\"a\":2,\"e\":\"as many + 複數名詞 + as 表「和⋯⋯一樣多」，apples 是可數名詞。\",\"g\":9},{\"s\":1,\"p\":\"第 (10) 格應填入：\",\"o\":[\"cheaper\",\"cheap\",\"cheapest\",\"more cheap\"],\"a\":0,\"e\":\"後面有 than，用比較級 cheaper。\",\"g\":10},{\"s\":1,\"p\":\"第 (11) 格應填入：\",\"o\":[\"something\",\"nothing\",\"anything\",\"everything\"],\"a\":1,\"e\":\"There’s nothing better than... 表「沒有什麼比⋯⋯更好」。\",\"g\":11},{\"s\":2,\"p\":\"We ______ the classroom with balloons for Teacher’s Day.\",\"o\":[\"press\",\"pick\",\"decorate\",\"plan\"],\"a\":2,\"e\":\"decorate [ˋdɛkəˏret] (v.) 裝飾\",\"w\":\"decorate\"},{\"s\":2,\"p\":\"My grandparents grow rice and keep chickens on their ______.\",\"o\":[\"maze\",\"corn\",\"pumpkin\",\"farm\"],\"a\":3,\"e\":\"farm [fɑrm] (n.) 農場\",\"w\":\"farm\"},{\"s\":2,\"p\":\"The cat is very friendly. You can ______ it gently on the head.\",\"o\":[\"press\",\"pet\",\"pick\",\"plan\"],\"a\":1,\"e\":\"pet [pɛt] (v.) 撫摸；輕拍\",\"w\":\"pet\"},{\"s\":2,\"p\":\"Popcorn is made from ______.\",\"o\":[\"corn\",\"apples\",\"pumpkins\",\"milk\"],\"a\":0,\"e\":\"corn [kɔrn] (n.) 玉米\",\"w\":\"corn\"},{\"s\":2,\"p\":\"I can’t find my way home. I think I’m ______.\",\"o\":[\"lose\",\"loss\",\"fresh\",\"lost\"],\"a\":3,\"e\":\"lost [lɔst] (adj.) 迷路的，走失的\",\"w\":\"lost\"},{\"s\":2,\"p\":\"Let’s ______ some flowers from the garden for Mom.\",\"o\":[\"press\",\"pet\",\"pick\",\"plan\"],\"a\":2,\"e\":\"pick [pɪk] (v.) 採，摘\",\"w\":\"pick\"},{\"s\":2,\"p\":\"We ______ to visit Kenting this summer vacation.\",\"o\":[\"plan\",\"pick\",\"press\",\"decorate\"],\"a\":0,\"e\":\"plan [plæn] (v.) 計劃，打算\",\"w\":\"plan\"},{\"s\":2,\"p\":\"This machine ______ juice from oranges.\",\"o\":[\"picks\",\"presses\",\"pets\",\"plans\"],\"a\":1,\"e\":\"press [prɛs] (v.) 榨取（果汁）。主詞 This machine 是單數，所以用 presses。\",\"w\":\"press\"},{\"s\":2,\"p\":\"The box was empty. There was ______ in it.\",\"o\":[\"something\",\"everything\",\"anything\",\"nothing\"],\"a\":3,\"e\":\"nothing [ˋnʌθɪŋ] (pron.) 沒有東西；沒有事情\",\"w\":\"nothing\"},{\"s\":2,\"p\":\"The test was ______ easy, so most students did well.\",\"o\":[\"fair\",\"fairly\",\"fairy\",\"fully\"],\"a\":1,\"e\":\"fairly [ˋfɛrlɪ] (adv.) 相當地，修飾形容詞 easy。\",\"w\":\"fairly\"},{\"s\":2,\"p\":\"We grow tomatoes in a small ______ of land behind our house.\",\"o\":[\"maze\",\"pound\",\"patch\",\"price\"],\"a\":2,\"e\":\"patch [pætʃ] (n.) 小片（土地）\",\"w\":\"patch\"},{\"s\":2,\"p\":\"The kids walked into the ______ and tried to find the way out.\",\"o\":[\"maze\",\"pound\",\"price\",\"pie\"],\"a\":0,\"e\":\"maze [mez] (n.) 迷宮\",\"w\":\"maze\"},{\"s\":2,\"p\":\"These apples cost 60 dollars ______ kilogram.\",\"o\":[\"of\",\"at\",\"with\",\"per\"],\"a\":3,\"e\":\"per [pɝ] (prep.) 每，每一\",\"w\":\"per\"}]}];\nconst MULTI = UNITS.length > 1;\nconst SECTIONS = [\n  {name:\"文意理解\", short:\"Round 1\"},\n  {name:\"克漏字\", short:\"Round 2\"},\n  {name:\"字彙\", short:\"Round 3\"}\n];\nconst L = [\"A\",\"B\",\"C\",\"D\"];\nconst $ = id => document.getElementById(id);\nconst WKEY = \"lte-quiz-wrong\";\n\nlet unit = null, order = [], answers = {}, pos = 0;\nlet testState = MULTI ? \"home\" : \"quiz\";\nlet tab = \"test\";\n\n/* ---------- storage ---------- */\nlet wrongLog = {};\ntry{ wrongLog = JSON.parse(localStorage.getItem(WKEY) || \"{}\") || {}; }catch(e){ wrongLog = {}; }\ntry{ // bring over wrong answers saved by the earlier single-unit page\n  const old = JSON.parse(localStorage.getItem(\"dj-quiz-wrong\") || \"null\");\n  if(old){\n    Object.keys(old).forEach(i=>{ const k = \"dj:\"+i; if(!wrongLog[k]) wrongLog[k] = old[i]; });\n    localStorage.removeItem(\"dj-quiz-wrong\");\n    localStorage.setItem(WKEY, JSON.stringify(wrongLog));\n  }\n}catch(e){}\nfunction saveWrong(){\n  try{ localStorage.setItem(WKEY, JSON.stringify(wrongLog)); }catch(e){}\n  updateBadge();\n}\nfunction myWrongKeys(){\n  const ids = UNITS.map(u=>u.id);\n  return Object.keys(wrongLog).filter(k=>ids.includes(k.split(\":\")[0]));\n}\nfunction updateBadge(){ $(\"wrongCount\").textContent = myWrongKeys().length; }\nfunction getBest(u){ try{ return +(localStorage.getItem(\"lte-best-\"+u.id) || 0); }catch(e){ return 0; } }\nfunction setBest(u,v){ try{ if(v > getBest(u)) localStorage.setItem(\"lte-best-\"+u.id, v); }catch(e){} }\n\n/* ---------- header + unit bar ---------- */\nfunction setHeader(){\n  if(unit && testState !== \"home\"){\n    $(\"title\").textContent = unit.title;\n    $(\"subtitle\").textContent = `Let’s Talk in English ${unit.sub}・共 ${unit.q.length} 題，答完每題立即看解析`;\n  }else{\n    $(\"title\").textContent = \"Let’s Talk in English\";\n    $(\"subtitle\").textContent = `十月號互動測驗・共 ${UNITS.length} 個單元`;\n  }\n  document.querySelectorAll(\".uchip\").forEach(b=>{\n    const on = b.dataset.u === \"home\" ? (testState===\"home\" && tab===\"test\") : (unit && unit.id===b.dataset.u && testState!==\"home\" && tab===\"test\");\n    b.setAttribute(\"aria-current\", on ? \"true\" : \"false\");\n  });\n}\nfunction buildUnitBar(){\n  if(!MULTI) return;\n  const bar = $(\"unitbar\"); bar.classList.remove(\"hidden\");\n  const items = [{id:\"home\", icon:\"🏠\", short:\"全部單元\"}].concat(UNITS);\n  bar.innerHTML = items.map(u=>`\u003cbutton class=\"uchip\" data-u=\"${u.id}\">\u003cspan class=\"ic\" aria-hidden=\"true\">${u.icon}\u003c/span>${u.short}\u003c/button>`).join(\"\");\n  bar.querySelectorAll(\".uchip\").forEach(b=>b.onclick = ()=>{\n    if(b.dataset.u === \"home\"){ testState = \"home\"; setTab(\"test\"); }\n    else startUnit(b.dataset.u);\n  });\n}\nfunction buildHome(){\n  $(\"unitCards\").innerHTML = UNITS.map(u=>{\n    const best = getBest(u);\n    return `\u003cbutton class=\"ucard\" data-u=\"${u.id}\">\u003cspan class=\"ic\" aria-hidden=\"true\">${u.icon}\u003c/span>\u003cb>${u.title}\u003c/b>\u003cspan>${u.sub}・${u.q.length} 題${best ? `・最佳 ${best} 題` : \"\"}\u003c/span>\u003c/button>`;\n  }).join(\"\");\n  $(\"unitCards\").querySelectorAll(\".ucard\").forEach(b=>b.onclick = ()=>startUnit(b.dataset.u));\n}\n\n/* ---------- views ---------- */\nfunction setTab(t){\n  tab = t;\n  $(\"tabTest\").setAttribute(\"aria-selected\", t===\"test\");\n  $(\"tabWrong\").setAttribute(\"aria-selected\", t===\"wrong\");\n  const inTest = t===\"test\";\n  $(\"wrongbook\").classList.toggle(\"hidden\", inTest);\n  $(\"home\").classList.toggle(\"hidden\", !(inTest && testState===\"home\"));\n  $(\"quiz\").classList.toggle(\"hidden\", !(inTest && testState===\"quiz\"));\n  $(\"ropes\").classList.toggle(\"hidden\", !(inTest && testState===\"quiz\"));\n  $(\"result\").classList.toggle(\"hidden\", !(inTest && testState===\"result\"));\n  if(inTest && testState===\"home\") buildHome();\n  if(!inTest) renderWrongbook();\n  setHeader();\n  window.scrollTo({top:0});\n}\n\n/* ---------- quiz ---------- */\nfunction buildRopes(){\n  const r = $(\"ropes\"); r.innerHTML = \"\";\n  SECTIONS.forEach((s,si)=>{\n    const ids = order.filter(i=>unit.q[i].s===si);\n    if(!ids.length) return;\n    const b = document.createElement(\"button\");\n    b.className = \"round\"; b.dataset.s = si;\n    b.innerHTML = `\u003cdiv class=\"bar\">\u003ci>\u003c/i>\u003c/div>\u003cb>${s.short}・${s.name}\u003c/b>\u003cspan>\u003c/span>`;\n    b.onclick = ()=>{ pos = order.indexOf(ids[0]); render(); };\n    r.appendChild(b);\n  });\n}\nfunction updateRopes(){\n  const cur = unit.q[order[pos]].s;\n  document.querySelectorAll(\".round\").forEach(b=>{\n    const si = +b.dataset.s;\n    const ids = order.filter(i=>unit.q[i].s===si);\n    const done = ids.filter(i=>i in answers).length;\n    b.querySelector(\"i\").style.width = (done/ids.length*100) + \"%\";\n    b.querySelector(\"span\").textContent = `${done} / ${ids.length}`;\n    b.setAttribute(\"aria-current\", si===cur ? \"true\" : \"false\");\n  });\n}\nfunction renderPassage(q){\n  const box = $(\"passage\");\n  if(q.s!==1){ box.classList.add(\"hidden\"); return; }\n  box.classList.remove(\"hidden\");\n  box.innerHTML = unit.passage.replace(/\\{(\\d+)\\}/g,(m,n)=>{\n    n = +n;\n    const qi = unit.q.findIndex(x=>x.g===n);\n    let cls = \"gap\", txt = \"(\"+n+\")\";\n    if(n===q.g) cls += \" now\";\n    else if(qi in answers && answers[qi]===unit.q[qi].a){ cls += \" filled\"; txt = unit.q[qi].o[unit.q[qi].a]; }\n    return `\u003cspan class=\"${cls}\">${txt}\u003c/span>`;\n  });\n}\nfunction render(){\n  const qi = order[pos], q = unit.q[qi];\n  $(\"qnum\").textContent = qi+1;\n  $(\"qsec\").textContent = SECTIONS[q.s].name + `・第 ${pos+1} / ${order.length} 題`;\n  renderPassage(q);\n  const wt = $(\"wordtag\");\n  if(q.w){ wt.textContent = q.w; wt.classList.remove(\"hidden\"); } else wt.classList.add(\"hidden\");\n  $(\"prompt\").textContent = q.p;\n  const box = $(\"opts\"); box.innerHTML = \"\";\n  q.o.forEach((t,oi)=>{\n    const b = document.createElement(\"button\");\n    b.className = \"opt\";\n    b.innerHTML = `\u003cspan class=\"k\">${L[oi]}\u003c/span>\u003cspan>${t}\u003c/span>`;\n    b.onclick = ()=>choose(qi,oi);\n    box.appendChild(b);\n  });\n  if(qi in answers) showFeedback(qi);\n  else { $(\"fb\").className = \"fb\"; $(\"fb\").innerHTML = \"\"; }\n  $(\"prev\").disabled = pos===0;\n  $(\"next\").disabled = !(qi in answers);\n  $(\"next\").textContent = pos===order.length-1 ? \"看成績\" : \"下一題\";\n  updateRopes();\n}\nfunction choose(qi,oi){\n  if(qi in answers) return;\n  answers[qi] = oi;\n  if(oi!==unit.q[qi].a){\n    const k = unit.id+\":\"+qi, prev = wrongLog[k];\n    wrongLog[k] = {pick:oi, times:(prev?prev.times:0)+1};\n    saveWrong();\n  }\n  showFeedback(qi);\n  $(\"next\").disabled = false;\n  updateRopes();\n  if(unit.q[qi].s===1) renderPassage(unit.q[qi]);\n  $(\"next\").focus({preventScroll:true});\n}\nfunction showFeedback(qi){\n  const q = unit.q[qi], pick = answers[qi], ok = pick===q.a;\n  document.querySelectorAll(\".opt\").forEach((b,oi)=>{\n    b.disabled = true;\n    if(oi===q.a) b.classList.add(\"right\");\n    else if(oi===pick) b.classList.add(\"wrong\");\n  });\n  const fb = $(\"fb\");\n  fb.className = \"fb show \" + (ok ? \"ok\" : \"no\");\n  fb.innerHTML = `\u003cstrong>${ok ? \"答對了！\" : \"答錯了，正確答案是 (\"+L[q.a]+\")\"}\u003c/strong>${q.e}`;\n}\nfunction stem(u,i){\n  const q = u.q[i];\n  if(q.s===1) return `第 (${q.g}) 格：${clozeSentence(u,q.g)}`;\n  return q.w ? q.w + \"：\" + q.p : q.p;\n}\nfunction finish(){\n  testState = \"result\";\n  const right = order.filter(i=>answers[i]===unit.q[i].a);\n  $(\"score\").textContent = right.length;\n  $(\"scoreOf\").textContent = `/ ${order.length} 題答對`;\n  const pct = right.length/order.length;\n  $(\"verdict\").textContent = pct===1 ? \"全對！你就是冠軍。\" : pct>=.8 ? \"很強！再看一下錯的題目就完美了。\" : pct>=.6 ? \"不錯，把錯的題目再練一次吧。\" : \"先回去讀一遍課文，再挑戰一次！\";\n  $(\"breakdown\").innerHTML = SECTIONS.map((s,si)=>{\n    const ids = order.filter(i=>unit.q[i].s===si);\n    if(!ids.length) return \"\";\n    const r = ids.filter(i=>answers[i]===unit.q[i].a).length;\n    return `\u003cdiv>\u003cb>${r} / ${ids.length}\u003c/b>\u003cspan>${s.name}\u003c/span>\u003c/div>`;\n  }).join(\"\");\n  const wrong = order.filter(i=>answers[i]!==unit.q[i].a);\n  $(\"review\").innerHTML = wrong.length\n    ? `\u003ch2>這次答錯的題目\u003c/h2>\u003cul>${wrong.map(i=>{ const q = unit.q[i];\n        return `\u003cli>\u003cdiv class=\"q\">${i+1}. ${stem(unit,i)}\u003c/div>\n        \u003cdiv class=\"a\">你選 \u003cs>(${L[answers[i]]}) ${q.o[answers[i]]}\u003c/s>，正確是 \u003cem>(${L[q.a]}) ${q.o[q.a]}\u003c/em>\u003c/div>\n        \u003cdiv>${q.e}\u003c/div>\u003c/li>`; }).join(\"\")}\u003c/ul>`\n    : `\u003cp class=\"allright\">沒有答錯的題目！\u003c/p>`;\n  $(\"retryWrong\").classList.toggle(\"hidden\", !wrong.length);\n  if(order.length===unit.q.length) setBest(unit, right.length);\n  setTab(\"test\");\n}\nfunction startUnit(id, ids){\n  unit = UNITS.find(u=>u.id===id);\n  order = ids || unit.q.map((_,i)=>i);\n  answers = {}; pos = 0; testState = \"quiz\";\n  buildRopes(); render(); setTab(\"test\");\n}\n\n/* ---------- wrong book ---------- */\nfunction clozeSentence(u,n){\n  const ss = u.passage.match(/[^.!?]+[.!?]”?/g) || [];\n  const s = ss.find(x=>x.includes(\"{\"+n+\"}\")) || \"\";\n  return s.trim().replace(/\\{(\\d+)\\}/g,(m,k)=>{\n    k = +k;\n    if(k===n) return \"____\";\n    const q = u.q.find(x=>x.g===k);\n    return q ? q.o[q.a] : m;\n  });\n}\nfunction renderWrongbook(){\n  const keys = myWrongKeys();\n  $(\"wbActions\").classList.toggle(\"hidden\", !keys.length);\n  $(\"wbClear\").textContent = \"清空錯題本\"; $(\"wbClear\").dataset.armed = \"\";\n  $(\"wbSummary\").textContent = keys.length\n    ? `共 ${keys.length} 題錯題，依單元和題號排列。答錯過的題目會一直留在這裡，直到你移除或清空。`\n    : \"\";\n  if(!keys.length){\n    $(\"wbList\").innerHTML = `\u003cp class=\"empty\">目前沒有錯題。做完測驗後，答錯的題目會自動收進這裡。\u003c/p>\u003cbutton class=\"btn primary\" id=\"wbGo\">去做測驗\u003c/button>`;\n    $(\"wbGo\").onclick = ()=>setTab(\"test\");\n    return;\n  }\n  $(\"wbList\").innerHTML = UNITS.map(u=>{\n    const ids = keys.filter(k=>k.split(\":\")[0]===u.id).map(k=>+k.split(\":\")[1]).sort((a,b)=>a-b);\n    if(!ids.length) return \"\";\n    const head = `\u003cdiv class=\"wb-unit\">\u003ch2>${MULTI ? u.icon+\" \" : \"\"}${u.title}（${ids.length} 題）\u003c/h2>\u003cbutton class=\"btn primary small\" data-practice=\"${u.id}\">練習這些錯題\u003c/button>\u003c/div>`;\n    return head + SECTIONS.map((s,si)=>{\n      const g = ids.filter(i=>u.q[i].s===si);\n      if(!g.length) return \"\";\n      return `\u003ch3>${s.name}\u003c/h3>\u003cul>${g.map(i=>{\n        const q = u.q[i], w = wrongLog[u.id+\":\"+i];\n        return `\u003cli>\u003cdiv class=\"q\">${i+1}. ${stem(u,i)}\u003c/div>\n          \u003cdiv class=\"a\">上次選 \u003cs>(${L[w.pick]}) ${q.o[w.pick]}\u003c/s>，正確是 \u003cem>(${L[q.a]}) ${q.o[q.a]}\u003c/em>\u003c/div>\n          \u003cdiv>${q.e}\u003c/div>\n          \u003cdiv class=\"wb-meta\">\u003cspan>答錯 ${w.times} 次\u003c/span>\u003cbutton class=\"linkbtn\" data-rm=\"${u.id}:${i}\">移除這題\u003c/button>\u003c/div>\u003c/li>`;\n      }).join(\"\")}\u003c/ul>`;\n    }).join(\"\");\n  }).join(\"\");\n  $(\"wbList\").querySelectorAll(\"[data-rm]\").forEach(b=>b.onclick = ()=>{\n    delete wrongLog[b.dataset.rm]; saveWrong(); renderWrongbook();\n  });\n  $(\"wbList\").querySelectorAll(\"[data-practice]\").forEach(b=>b.onclick = ()=>{\n    const id = b.dataset.practice;\n    const ids = myWrongKeys().filter(k=>k.split(\":\")[0]===id).map(k=>+k.split(\":\")[1]).sort((a,c)=>a-c);\n    startUnit(id, ids);\n  });\n}\n$(\"wbClear\").onclick = ()=>{\n  const b = $(\"wbClear\");\n  if(!b.dataset.armed){ b.dataset.armed = \"1\"; b.textContent = \"再按一次確認清空\"; return; }\n  myWrongKeys().forEach(k=>delete wrongLog[k]);\n  saveWrong(); renderWrongbook();\n};\n\n/* ---------- controls ---------- */\n$(\"tabTest\").onclick = ()=>setTab(\"test\");\n$(\"tabWrong\").onclick = ()=>setTab(\"wrong\");\n$(\"prev\").onclick = ()=>{ if(pos>0){ pos--; render(); } };\n$(\"next\").onclick = ()=>{ if(pos\u003corder.length-1){ pos++; render(); } else finish(); };\n$(\"retry\").onclick = ()=>startUnit(unit.id);\n$(\"retryWrong\").onclick = ()=>startUnit(unit.id, order.filter(i=>answers[i]!==unit.q[i].a));\ndocument.addEventListener(\"keydown\", e=>{\n  if(tab!==\"test\" || testState!==\"quiz\") return;\n  const idx = L.indexOf(e.key.toUpperCase());\n  if(idx>=0 && !(order[pos] in answers)) choose(order[pos], idx);\n});\n\nbuildUnitBar();\nupdateBadge();\nif(MULTI){ setTab(\"test\"); } else { startUnit(UNITS[0].id); }\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";</script>
<script>
const QUIZ = [
  {id:"u3",  sub:"book", unit:"Unit 3", short:"U3", name:"Mom Was Doing the Dishes at Half Past Twelve", n:168, meta:"共 168 題・滿分 168 分"},
  {id:"u4",  sub:"book", unit:"Unit 4", short:"U4", name:"What Do You Want to Be in the Future?", n:232, meta:"共 232 題・滿分 232 分"},
  {id:"lte", sub:"lte",  unit:"十月號", short:"十月號", name:"Dwayne Johnson・Massachusetts・拍照技巧・Fun in the Fall", n:100, meta:"4 個單元・共 100 題"}
];
const SUB = {book:{name:"英文課本", ic:"課"}, lte:{name:"Let’s Talk in English", ic:"LT", tab:"LTE"}};
const $ = id => document.getElementById(id);

function progress(q){
  if(!q.key) return "";
  try{
    const s = JSON.parse(localStorage.getItem(q.key)||"null");
    const done = s && s.ans ? Object.keys(s.ans).length : 0;
    return done ? `<span class="prog">已作答 ${done} / ${q.n}</span>` : "";
  }catch(e){ return ""; }
}
function buildBar(){
  let h = `<button class="tabi home" data-go="home"><span class="ic">⌂</span><span class="lb">首頁</span></button><span class="sep"></span>`;
  let last = "";
  QUIZ.forEach(q=>{
    if(last && last!==q.sub) h += `<span class="sep"></span>`;
    last = q.sub;
    h += `<button class="tabi ${q.sub}" data-go="${q.id}" title="${q.name}"><span class="ic">${SUB[q.sub].ic}</span><span class="lb">${q.short||q.unit}</span></button>`;
  });
  $("bar").innerHTML = h;
  $("bar").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function buildHome(){
  $("list").innerHTML = Object.keys(SUB).map(k=>`
    <section class="${k}">
      <h2><span class="dot"></span>${SUB[k].name}</h2>
      <div class="grid">${QUIZ.filter(q=>q.sub===k).map(q=>`
        <button class="card ${k}" data-go="${q.id}">
          <span class="unit">${q.unit}</span>
          <span class="name">${q.name}</span>
          <span class="meta">${q.meta}</span>
          ${progress(q)}
          <span class="go">開始測驗 →</span>
        </button>`).join("")}</div>
    </section>`).join("");
  $("list").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}
let current = null;
function show(id){
  if(!QZ[id]) id = "home";
  document.querySelectorAll(".tabi").forEach(b=>{ if(b.dataset.go===id) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const tab = document.querySelector(`.tabi[data-go="${id}"]`);
  if(tab) tab.scrollIntoView({block:"nearest", inline:"nearest"});
  if(id==="home"){
    $("frame").classList.add("hide"); $("homeView").classList.remove("hide");
    buildHome(); current = "home"; document.title = "英文互動測驗"; return;
  }
  if(current===id) return;
  current = id;
  $("homeView").classList.add("hide"); $("loading").classList.remove("hide");
  const f = $("frame");
  f.classList.remove("hide");
  f.onload = ()=>{ $("loading").classList.add("hide"); };
  f.srcdoc = QZ[id];
  const q = QUIZ.find(x=>x.id===id); document.title = (q.unit+" "+q.name) + "｜英文互動測驗";
}
function go(id){
  if(location.hash.slice(1)===id || (id==="home" && !location.hash)) show(id);
  else location.hash = id==="home" ? "" : id;
}
window.addEventListener("hashchange", ()=>show(location.hash.slice(1)||"home"));
buildBar();
show(location.hash.slice(1)||"home");
</script>
</body>
</html>
