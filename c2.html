ec h2{font-size:20px;font-weight:900;margin:0}\n.sec span{font-size:13px;color:var(--muted)}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:0 0 14px;scroll-margin-top:var(--topH,160px)}\n.item{display:grid;grid-template-columns:44px 1fr;gap:0 8px}\n.item>.no{font-weight:900;font-size:18px;color:var(--muted)}\n.mat p{margin:0 0 10px}\n.mat .src{font-weight:600}\n.mat figure{margin:12px 0;text-align:center}\n.mat figure img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}\n.mat figcaption{font-size:13px;color:var(--muted)}\n.mat .tag{display:none}\n.ghead{font-weight:900;font-size:18px;margin:0 0 6px}\n.sub{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;scroll-margin-top:var(--topH,160px)}\n.prompt{margin:0 0 10px}\n.opts{display:grid;gap:8px}\n.opt{display:flex;gap:6px;text-align:left;width:100%;font:inherit;line-height:1.6;color:var(--ink);background:var(--surface);\n  border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}\n.opt .k{flex:none;color:var(--muted)}\n.opt:hover:not(:disabled){border-color:var(--navy)}\n.opt:disabled{cursor:default}\n.opt.pick{background:var(--pick);border-color:var(--navy)}\n.opt.right{background:var(--ok-bg);border-color:var(--ok)}\n.opt.right .k{color:var(--ok);font-weight:700}\n.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}\n.opt.wrong .k{color:var(--bad);font-weight:700}\n.fb{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:15px;line-height:1.75}\n.fb.ok{background:var(--ok-bg)} .fb.no{background:var(--bad-bg)}\n.fb strong{margin-right:6px} .fb.ok strong{color:var(--ok)} .fb.no strong{color:var(--bad)}\n.hide{display:none!important}\n.prompt p{margin:0 0 8px} .prompt img,.mat img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;display:block;margin:8px auto}\n.mat p:has(> img:only-child){text-align:center}\nu.wavy{text-decoration:underline wavy;text-underline-offset:3px;text-decoration-thickness:1px}\nu.dbl{text-decoration:underline double;text-underline-offset:3px}\n.opt .ot img{max-height:200px;max-width:100%;height:auto;display:block;background:#fff}\n.imgopts{grid-template-columns:repeat(2,minmax(0,1fr))}\n.imgopts .opt{flex-direction:column;align-items:flex-start}\n.opt.miss{border-color:var(--ok);border-style:dashed}\n.opt.miss .k{color:var(--ok);font-weight:700}\n.multibar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}\n.multibar .hint{font-size:13px;color:var(--muted)}\n.tbl{border-collapse:collapse;margin:8px 0 12px;font-size:15px;width:100%}\n.tbl th,.tbl td{border:1px solid var(--ink);padding:4px 10px;text-align:center}\n.tbl th{font-weight:600;background:var(--chip)}\ntextarea.ans{width:100%;font-size:16px;line-height:1.6;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}\ntextarea.ans:focus{outline:2px solid var(--navy);border-color:var(--navy)}\n.openbar{display:flex;align-items:center;gap:10px;margin-top:8px}\n.openbar .hint{font-size:13px;color:var(--muted)}\n.ref{margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--pick);font-size:15px;line-height:1.75}\n.selfrow{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n.self[aria-pressed=\"true\"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}\n.endbar{text-align:center;margin:24px 0}\n.endbar .tbtn{font-size:17px;padding:12px 26px}\n.empty{text-align:center;color:var(--muted);padding:30px 0}\n.result{background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:18px 22px;margin:0 0 14px;text-align:center}\n.result b{font-size:28px}\n@media (max-width:560px){\n  .card{padding:16px 14px}.item{grid-template-columns:32px 1fr}\n  .top{padding-left:12px;padding-right:12px}.seg button,.tbtn{padding:7px 10px;font-size:14px}\n  .stats{font-size:13px}.stats b{font-size:16px}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"top ui\" id=\"top\">\n \u003cdiv class=\"top-in\">\n  \u003cdiv class=\"row1\">\n    \u003ch1 id=\"ttl\">\u003c/h1>\n    \u003cdiv class=\"stats\">\n      \u003cspan>已作答 \u003cb id=\"stDone\">0\u003c/b> / \u003cspan id=\"stTotal\">\u003c/span>\u003c/span>\n      \u003cspan>得分 \u003cb id=\"stScore\">0\u003c/b> / \u003cspan id=\"stMax\">\u003c/span>\u003c/span>\n      \u003cspan class=\"g\">答對 \u003cb id=\"stOk\">0\u003c/b>\u003c/span>\n      \u003cspan class=\"r\">答錯 \u003cb id=\"stNo\">0\u003c/b>\u003c/span>\n      \u003cspan>答對率 \u003cb id=\"stRate\">–\u003c/b>\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"row2\">\n    \u003cdiv class=\"seg\" role=\"group\" aria-label=\"作答模式\">\n      \u003cbutton id=\"mPractice\" aria-pressed=\"true\">練習：選了就對答案\u003c/button>\n      \u003cbutton id=\"mTest\" aria-pressed=\"false\">測驗：交卷再對答案\u003c/button>\n    \u003c/div>\n    \u003cbutton class=\"tbtn\" id=\"onlyWrong\" aria-pressed=\"false\">只看錯題\u003c/button>\n    \u003cbutton class=\"tbtn\" id=\"redoWrong\" disabled>重練錯題\u003c/button>\n    \u003cbutton class=\"tbtn hide\" id=\"showAll\" aria-pressed=\"true\">重練中・顯示全部\u003c/button>\n    \u003cbutton class=\"tbtn\" id=\"reset\">重新作答\u003c/button>\n    \u003cbutton class=\"tbtn submit hide\" id=\"submitTop\">交卷\u003c/button>\n  \u003c/div>\n  \u003cdetails class=\"map\" id=\"map\" open>\n    \u003csummary>題號一覽（點題號可跳轉）\u003c/summary>\n    \u003cdiv class=\"grid-wrap\" id=\"gridwrap\">\u003c/div>\n  \u003c/details>\n \u003c/div>\n\u003c/div>\n\n\u003cmain id=\"paper\">\n  \u003cdiv class=\"result ui hide\" id=\"result\">\u003c/div>\n  \u003cdiv id=\"secs\">\u003c/div>\n  \u003cp class=\"empty ui hide\" id=\"empty\">目前沒有錯題 👍\u003c/p>\n  \u003cdiv class=\"endbar ui hide\" id=\"endbar\">\u003cbutton class=\"tbtn submit\" id=\"submitEnd\">交卷\u003c/button>\u003c/div>\n\u003c/main>\n\n\u003cscript>\nconst TITLE = \"國文語文常識（二）語法（下）句子　試卷・互動練習\";\nconst SECS = [{\"name\": \"單一選擇題\", \"note\": \"每題 3 分，共 90 分\", \"group\": false}];\nconst G = {};\nconst Q = [{\"s\": 0, \"n\": \"1\", \"p\": \"\u003cp>下列電影中的名句，何者與電影《沙丘》：「夢是來自意識深處的訊息」，這段文字的句型相同？\u003c/p>\", \"o\": [\"《孤味》：「每個家都有解不開的結。」\", \"《奇蹟男孩》：「我們的人生都值得接受掌聲鼓勵。」\", \"《花木蘭》：「在逆境中綻放的花朵，最難得也最美麗。」\", \"《東邪西毒》：「最了解你的人不是你的朋友，而是你的敵人。」\"], \"a\": 3, \"e\": \"(Ａ)有無句。(Ｂ)敘述句。(Ｃ)表態句。(Ｄ)與題幹皆為判斷句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"2\", \"p\": \"\u003cp>下列選項，何者與「誰都認為這是本好書」的意思相同？〔90.第二次基測〕\u003c/p>\", \"o\": [\"有誰認為這是本好書呢\", \"沒人不認為這是本好書\", \"這本書被誰認為是好書\", \"誰會認為這是本好書啊\"], \"a\": 1, \"e\": \"(Ｂ)大家都認為這是本好書。\", \"pt\": 3}, {\"s\": 0, \"n\": \"3\", \"p\": \"\u003cp>下列何者「不屬於」句子？\u003c/p>\", \"o\": [\"花謝\", \"讀書\", \"園地\", \"登山\"], \"a\": 2, \"e\": \"(Ｃ)園地：單一名詞，無述語，不構成句子。\", \"pt\": 3}, {\"s\": 0, \"n\": \"4\", \"p\": \"\u003cp>下列「　」中的字詞，何者是該句的主語？\u003c/p>\", \"o\": [\"情人眼裡出「\u003cu>西施\u003c/u>」\", \"「迢迢」牽牛星\", \"「明月」松間照\", \"野火「燒」不盡\"], \"a\": 2, \"e\": \"主語：(Ａ)情人眼裡（的所見）(Ｂ)牽牛星(Ｄ)野火。\", \"pt\": 3}, {\"s\": 0, \"n\": \"5\", \"p\": \"\u003cp>下列關於句子的判別，何者「有誤」？\u003c/p>\", \"o\": [\"海洋是我的稿紙：判斷句\", \"我為人人：判斷句\", \"屋頂上的雨水滴落下來：敘事句\", \"暮氣沉沉：表態句\"], \"a\": 1, \"e\": \"(Ｂ)敘事句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"6\", \"p\": \"\u003cp>「色彩繽紛」在句子的種類中是屬於何種句型？\u003c/p>\", \"o\": [\"敘事句\", \"有無句\", \"表態句\", \"判斷句\"], \"a\": 2, \"e\": \"(Ｃ)表示一種主觀的評價或狀態的表達，屬於表態句，其結構為：主語「色彩」＋表語「繽紛」。\", \"pt\": 3}, {\"s\": 0, \"n\": \"7\", \"p\": \"\u003cp>「對於\u003cu>韓國\u003c/u>偶像團體，青少年莫不為之瘋狂。」下列何者是這句話的主語？\u003c/p>\", \"o\": [\"\u003cu>韓國\u003c/u>\", \"偶像\", \"團體\", \"青少年\"], \"a\": 3, \"e\": \"題幹文句是在說明青少年這個群體的行為和態度。其中，「青少年」是整句話的主體，是主語；「莫不為之瘋狂」說明青少年的反應，是述語；句首的「對於\u003cu>韓國\u003c/u>偶像團體」是補充說明，並不是句子的主語，故選(Ｄ)。\", \"pt\": 3}, {\"s\": 0, \"n\": \"8\", \"p\": \"\u003cp>判斷句的基本句型是「主語＋繫詞＋斷語」，但有些文言句子的繫詞會被省略，下列何者是省略繫詞的判斷句？\u003c/p>\", \"o\": [\"忽有龐然大物\", \"簞瓢屢空\", \"牡丹，花之富貴者也\", \"慈烏失其母\"], \"a\": 2, \"e\": \"(Ａ)有無句。(Ｂ)表態句。(Ｄ)敘事句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"9\", \"p\": \"\u003cp>下列何者是敘事句？\u003c/p>\", \"o\": [\"五月黃梅天，到處黏答答的\", \"讀書是一件有益的事\", \"世事往往有出人意表者\", \"\u003cu>陳傑憲\u003c/u>在昨晚的比賽中擊出滿貫全壘打\"], \"a\": 3, \"e\": \"(Ａ)表態句。(Ｂ)判斷句。(Ｃ)有無句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"10\", \"p\": \"\u003cp>「\u003cu>全家\u003c/u>就是你家」這句廣告語的句法結構，與下列何者相同？\u003c/p>\", \"o\": [\"勝敗乃兵家常事\", \"水塘裡生機盎然\", \"故人具雞黍\", \"天下沒有白吃的午餐\"], \"a\": 0, \"e\": \"題幹與(Ａ)判斷句(Ｂ)表態句(Ｃ)敘事句(Ｄ)有無句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"11\", \"p\": \"\u003cp>「它抓得住我」是「主語＋述語＋賓語」的敘事句，下列廣告語的句型，何者也是敘事句？\u003c/p>\", \"o\": [\"你的滿意，我們的驕傲\", \"你我暢飲杯中往事\", \"整個城市都是我的咖啡館\", \"成長只有一次\"], \"a\": 1, \"e\": \"(Ａ)(Ｃ)判斷句(Ｄ)有無句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"12\", \"p\": \"\u003cp>句子是利用兩個或兩個以上的詞加以排列、組合，而能表達完整意思的語言單位。下列何者屬於「句子」？\u003c/p>\", \"o\": [\"井底之蛙\", \"梁上君子\", \"月下老人\", \"字斟句酌\"], \"a\": 3, \"e\": \"(Ｄ)敘事句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"13\", \"p\": \"\u003cp>下列　2017　年\u003cu>奧斯卡金像獎\u003c/u>的得獎電影，何者的片名為「句子」？\u003c/p>\", \"o\": [\"\u003cu class=\\\"wavy\\\">樂來越愛你\u003c/u>\", \"\u003cu class=\\\"wavy\\\">怪獸與牠們的產地\u003c/u>\", \"\u003cu class=\\\"wavy\\\">月光下的藍色男孩\u003c/u>\", \"\u003cu class=\\\"wavy\\\">海邊的曼徹斯特\u003c/u>\"], \"a\": 0, \"e\": \"(Ｂ)(Ｃ)(Ｄ)片名中皆無述語，無法構成句子。\", \"pt\": 3}, {\"s\": 0, \"n\": \"14\", \"p\": \"\u003cp>下列是四齣戲的劇名，何者屬於完整的句子？\u003c/p>\", \"o\": [\"\u003cu class=\\\"wavy\\\">真情滿天下\u003c/u>\", \"\u003cu class=\\\"wavy\\\">妻子的誘惑\u003c/u>\", \"\u003cu class=\\\"wavy\\\">天下父母心\u003c/u>\", \"\u003cu class=\\\"wavy\\\">惡作劇之吻\u003c/u>\"], \"a\": 0, \"e\": \"(Ａ)「真情」是主語，「滿」是述語，「天下」是賓語，為敘事句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"15\", \"p\": \"\u003cp>下列各句子「　」中的部分，何者\u003cu class=\\\"dbl\\\">不是\u003c/u>該句的主語？\u003c/p>\", \"o\": [\"「電光」只在遙遠的天邊橫掃\", \"「夏夜」的景色美極了\", \"「朋友」買了一件衣料\", \"校園中「古樹」成蔭\"], \"a\": 1, \"e\": \"(Ｂ)主語是「夏夜的景色」。\", \"pt\": 3}, {\"s\": 0, \"n\": \"16\", \"p\": \"\u003cp>關於「老人的生活十分平安寧靜」一句的說明，下列何者\u003cu class=\\\"dbl\\\">錯誤\u003c/u>？\u003c/p>\", \"o\": [\"「老人的生活」是主語\", \"「十分」是副詞\", \"「平安寧靜」是表語\", \"本句為敘事句\"], \"a\": 3, \"e\": \"(Ｄ)表態句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"17\", \"p\": \"\u003cp>下列文句「　」中詞語的名稱，何者正確？\u003c/p>\", \"o\": [\"\u003cu>麥可．喬丹\u003c/u>的球技「精湛」——斷語\", \"母親「綻開」笑靨——表語\", \"他的愛把我的心「甜滿」了——賓語\", \"菊，「花之隱逸者也」——斷語\"], \"a\": 3, \"e\": \"(Ａ)表語(Ｂ)(Ｃ)述語。\", \"pt\": 3}, {\"s\": 0, \"n\": \"18\", \"p\": \"\u003cp>「山無稜，冬雷震震，天地合，才敢與君絕。」請判斷上文\u003cu class=\\\"dbl\\\">未包含\u003c/u>哪一種句型？\u003c/p>\", \"o\": [\"判斷句\", \"敘事句\", \"表態句\", \"有無句\"], \"a\": 0, \"e\": \"「山無稜」是有無句，「冬雷震震」是表態句，「天地合」是敘事句，「才敢與君絕」是敘事句。題幹譯：山沒有稜角，冬天雷聲震耳不絕，天地合而為一，才敢與你分別。\", \"pt\": 3}, {\"s\": 0, \"n\": \"19\", \"p\": \"\u003cp>下列何者句型與「蒼天無眼」皆屬於「有無句」？\u003c/p>\", \"o\": [\"無中生有\", \"家有喜事\", \"互通有無\", \"有容乃大\"], \"a\": 1, \"e\": \"(Ａ)(Ｃ)敘事句(Ｄ)判斷句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"20\", \"p\": \"\u003cp>「\u003cu>鍾毓\u003c/u>、\u003cu>鍾會\u003c/u>少有令譽」句中的「有」是述語，所以是「有無句」。下列何者也是此種句型？\u003c/p>\", \"o\": [\"有情人終成眷屬\", \"有時當思無時苦\", \"百無一用是書生\", \"強中自有強中手\"], \"a\": 3, \"e\": \"(Ａ)(Ｂ)敘事句(Ｃ)判斷句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"21\", \"p\": \"\u003cp>「弈\u003cu>秋\u003c/u>，通國之善弈者也。」是一判斷句，而這一判斷句的斷語為何？\u003c/p>\", \"o\": [\"弈\u003cu>秋\u003c/u>\", \"「乃」字，省略了\", \"通國之善弈者\", \"也\"], \"a\": 2, \"e\": \"(Ｃ)主語「弈\u003cu>秋\u003c/u>」＋斷語「通國之善弈者」（省略繫詞「乃」）。\", \"pt\": 3}, {\"s\": 0, \"n\": \"22\", \"p\": \"\u003cp>斷定主語所代表的人、事、物是什麼、具有什麼屬性、屬於什麼範圍的句子叫「判斷句」。下列文句，何者\u003cu class=\\\"dbl\\\">不是\u003c/u>「判斷句」？\u003c/p>\", \"o\": [\"冰凍三尺，非一日之寒\", \"自知乃是知識的基石\", \"他實在太自我\", \"我的媽媽是家裡的守護神\"], \"a\": 2, \"e\": \"(Ｃ)表態句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"23\", \"p\": \"\u003cp>「治療失敗最好的方法就是再試一下。」是「主語＋繫詞＋斷語」的句型，下列何者亦同？\u003c/p>\", \"o\": [\"這事是非曲折得弄清楚\", \"請別老是站在那兒不動\", \"他是否缺席要確定一下\", \"識時務者為俊傑\"], \"a\": 3, \"e\": \"題幹與(Ｄ)判斷句(Ａ)(Ｂ)(Ｃ)敘事句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"24\", \"p\": \"\u003cp>「他的視盼和藹中帶有嚴肅」是「主語＋表語」的句型，下列何者與此相同？〔93.第一次基測〕\u003c/p>\", \"o\": [\"這座新開幕的購物中心人潮洶湧\", \"植物能帶給人們愉悅穩定好心情\", \"\u003cu>臺灣\u003c/u>是擁有許多美麗森林的海島\", \"成功的男人背後必有個堅強女性\"], \"a\": 0, \"e\": \"(Ａ)人潮（主語）＋洶湧（表語）→表態句(Ｂ)敘事句(Ｃ)判斷句(Ｄ)有無句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"25\", \"p\": \"\u003cp>下列哪一句屬於表態句？\u003c/p>\", \"o\": [\"牠是一隻母牛\", \"她好美\", \"他睡在地板上\", \"這間房子有三扇門\"], \"a\": 1, \"e\": \"(Ａ)判斷句(Ｃ)敘事句(Ｄ)有無句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"26\", \"p\": \"\u003cp>依句子的種類區分，何者屬於表態句？\u003c/p>\", \"o\": [\"簞瓢屢空\", \"母親綻開笑靨\", \"宅邊有五柳樹\", \"路是一把長長的牧笛\"], \"a\": 0, \"e\": \"(Ｂ)敘事句(Ｃ)有無句(Ｄ)判斷句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"27\", \"p\": \"\u003cp>下列各選項，何者前後兩句文意相同？〔90.第二次基測〕\u003c/p>\", \"o\": [\"人人為我／我為人人\", \"美玉出\u003cu>藍田\u003c/u>／\u003cu>藍田\u003c/u>出美玉\", \"你是我的最愛／你最愛的是我\", \"\u003cu>張\u003c/u>將軍屢戰屢敗／\u003cu>張\u003c/u>將軍屢敗屢戰\"], \"a\": 1, \"e\": \"(Ａ)上句「取之於人」，下句「出之於己」(Ｃ)上句「我最愛你」，下句「你最愛我」(Ｄ)上句「每戰必敗」，下句「遇敗不餒」。\", \"pt\": 3}, {\"s\": 0, \"n\": \"28\", \"p\": \"\u003cp>\u003cu>張惠妹\u003c/u>的歌曲膾炙人口，極受歡迎。下列哪一句歌詞的句型「不同」於其他三者？\u003c/p>\", \"o\": [\"我們都忘了，這條路走了多久\", \"你是我的姐妹，你是我的寶貝\", \"愛是不夜城\", \"水藍色眼淚是心碎流的血、是天真的幻滅\"], \"a\": 0, \"e\": \"(Ａ)敘事句(Ｂ)(Ｃ)(Ｄ)判斷句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"29\", \"p\": \"\u003cp>下列何者句型「不同」於其他三者？\u003c/p>\", \"o\": [\"一個驕傲的人，結果總是在驕傲裡毀滅了自己\", \"懷疑與好奇為科學之母\", \"道理埋伏照應在字裡行間\", \"用古人而不為古人所惑\"], \"a\": 1, \"e\": \"(Ａ)(Ｃ)(Ｄ)敘事句(Ｂ)判斷句。\", \"pt\": 3}, {\"s\": 0, \"n\": \"30\", \"p\": \"\u003cp>平常說話用語，在主語、述語、賓語之間，有一定的順序，我們稱之為正常語序。下列何者改變了正常語序，形成倒裝句型？〔96.第二次基測〕\u003c/p>\", \"o\": [\"青春一去不復來，事業一縱永無成\", \"兩字聽人呼不肖，一生誤我是聰明\", \"知足使窮人變富，不知足富人變窮\", \"開口能談天下事，讀書要讀古人心\"], \"a\": 1, \"e\": \"(Ｂ)可還原為「聽人呼不肖兩字，聰明誤我一生」，意謂自己太依恃聰明，所以行事欠缺考慮。\", \"pt\": 3}];\n\n\nconst L = [\"A\",\"B\",\"C\",\"D\"];\nconst KEY = \"chig2-paper\";\nconst TOTAL = Q.reduce((s,q)=>s+q.pt,0);\nconst fmt = x => Math.round(x*10)/10;\nconst isMulti = q => Array.isArray(q.a);\nconst sameSet = (x,y) => Array.isArray(x) && x.length===y.length && x.every((v,k)=>v===y[k]);\nconst correct = i => Q[i].open ? state.ans[i]===\"ok\" : isMulti(Q[i]) ? sameSet(state.ans[i],Q[i].a) : state.ans[i]===Q[i].a;\nconst keyText = q => isMulti(q) ? q.a.map(k=>\"（\"+L[k]+\"）\").join(\"\") : \"（\"+L[q.a]+\"）\";\nconst $ = id => document.getElementById(id);\nconst esc = s => s.replace(/[&\u003c>\"]/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst tag = q => q.tg || (!SECS[q.s].group ? q.n : q.n.replace(/\\((\\d)\\)/,\"-$1\"));\n\nlet state = {mode:\"practice\", ans:{}, submitted:false, onlyWrong:false, focus:null};\ntry{ const s = JSON.parse(localStorage.getItem(KEY)||\"null\"); if(s && s.ans) state = Object.assign(state,s); }catch(e){}\nconst save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };\n\nconst graded = ()=> state.mode===\"practice\" || state.submitted;\nconst isWrong = i => graded() && (i in state.ans) && !correct(i);\n\nfunction bodyHTML(i){\n  const q = Q[i];\n  if(!q.open){\n    const imgs = q.o.every(t=>t.includes(\"\u003cimg\"));\n    const multi = isMulti(q) ? `\u003cdiv class=\"multibar ui\">\u003cspan class=\"hint\">可複選，選好後按「送出答案」\u003c/span>\u003cbutton class=\"tbtn send\" data-send=\"${i}\">送出答案\u003c/button>\u003c/div>` : \"\";\n    return `\u003cdiv class=\"opts${imgs?\" imgopts\":\"\"}\">${optsHTML(i)}\u003c/div>${multi}`;\n  }\n  return `${q.pre||\"\"}\u003ctextarea class=\"ans ui\" data-q=\"${i}\" rows=\"3\" placeholder=\"先寫下你的答案…\">\u003c/textarea>\n    \u003cdiv class=\"openbar ui\">\u003cbutton class=\"tbtn reveal\" data-rv=\"${i}\">看參考答案\u003c/button>\u003cspan class=\"hint\" id=\"hint${i}\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"ref ui hide\" id=\"ref${i}\">\u003cdiv>\u003cstrong>參考答案：\u003c/strong>${esc(q.r)}\u003c/div>\n      \u003cdiv class=\"selfrow\">對照後自評：\u003cbutton class=\"tbtn self\" data-self=\"${i}\" data-v=\"ok\">我答對了\u003c/button>\u003cbutton class=\"tbtn self\" data-self=\"${i}\" data-v=\"no\">我答錯了\u003c/button>\u003c/div>\u003c/div>`;\n}\nfunction optsHTML(i){\n  return Q[i].o.map((t,oi)=>`\u003cbutton class=\"opt\" data-q=\"${i}\" data-o=\"${oi}\">\u003cspan class=\"k\">（${L[oi]}）\u003c/span>\u003cspan class=\"ot\">${t}\u003c/span>\u003c/button>`).join(\"\");\n}\nfunction build(){\n  $(\"secs\").innerHTML = SECS.map((s,k)=>`\u003cdiv class=\"sec\">\u003ch2>${s.name}\u003c/h2>\u003cspan class=\"ui\">${s.note}\u003c/span>\u003c/div>\u003cdiv id=\"sec${k}\">\u003c/div>`).join(\"\");\n  $(\"gridwrap\").innerHTML = SECS.map((s,k)=>`\u003ch3>${s.name}\u003c/h3>\u003cdiv class=\"grid\" id=\"grid${k}\">\u003c/div>`).join(\"\");\n  SECS.forEach((sec,k)=>{\n  if(!sec.group){\n  $(\"sec\"+k).innerHTML = Q.map((q,i)=>q.s!==k?\"\":`\n    \u003csection class=\"card item\" id=\"q${i}\" data-items=\"${i}\">\n      \u003cdiv class=\"no\">${q.n}.\u003c/div>\n      \u003cdiv>${q.g?`\u003cdiv class=\"mat\">${G[q.g].html}\u003c/div>`:\"\"}\n        \u003cdiv class=\"prompt\">${q.p}\u003c/div>${bodyHTML(i)}\u003cdiv class=\"fb hide\" id=\"fb${i}\">\u003c/div>\u003c/div>\n    \u003c/section>`).join(\"\");\n  return; }\n  const order = [];\n  Q.forEach((q,i)=>{ if(q.s===k && !order.includes(q.g)) order.push(q.g); });\n  $(\"sec\"+k).innerHTML = order.map(g=>{\n    const ids = Q.map((q,i)=>q.g===g?i:-1).filter(i=>i>=0);\n    return `\u003csection class=\"card\" id=\"grp-${g}\" data-items=\"${ids.join(\",\")}\">\n      \u003cp class=\"ghead\">${G[g].label.replace(\"題組 \",\"\").replace(/^(\\d+)/,\"$1.\")}\u003c/p>\n      \u003cdiv class=\"mat\">${G[g].html}\u003c/div>\n      ${ids.map(i=>{const m=Q[i].m||Q[i].n.match(/\\((\\d)\\)/)[1];\n        return `\u003cdiv class=\"sub\" id=\"q${i}\">\u003cdiv class=\"prompt\">${/^\u003cp>/.test(Q[i].p) ? Q[i].p.replace(/^\u003cp>/,\"\u003cp>（\"+m+\"）\") : \"\u003cp>（\"+m+\"）\u003c/p>\"+Q[i].p}\u003c/div>${bodyHTML(i)}\u003cdiv class=\"fb hide\" id=\"fb${i}\">\u003c/div>\u003c/div>`}).join(\"\")}\n    \u003c/section>`;\n  }).join(\"\");\n  });\n  SECS.forEach((s,k)=>{\n    $(\"grid\"+k).innerHTML = Q.map((q,i)=>q.s===k?`\u003cbutton class=\"num\" data-go=\"${i}\">${tag(q)}\u003c/button>`:\"\").join(\"\");\n  });\n  $(\"stTotal\").textContent = Q.length;\n  document.querySelectorAll(\".opt\").forEach(b=>b.onclick=()=>pick(+b.dataset.q,+b.dataset.o));\n  document.querySelectorAll(\".send\").forEach(b=>b.onclick=()=>sendMulti(+b.dataset.send));\n  document.querySelectorAll(\".num\").forEach(b=>b.onclick=()=>jump(+b.dataset.go));\n  document.querySelectorAll(\".ans\").forEach(ta=>{ ta.value = (state.txt||{})[ta.dataset.q]||\"\"; ta.oninput=()=>{ state.txt=state.txt||{}; state.txt[ta.dataset.q]=ta.value; save(); }; });\n  document.querySelectorAll(\".reveal\").forEach(b=>b.onclick=()=>{ if(!graded()) return; state.rev=state.rev||{}; state.rev[b.dataset.rv]=1; save(); paintQ(+b.dataset.rv); });\n  document.querySelectorAll(\".self\").forEach(b=>b.onclick=()=>selfGrade(+b.dataset.self, b.dataset.v));\n  $(\"ttl\").textContent = TITLE; $(\"stMax\").textContent = fmt(TOTAL);\n\n}\n\nfunction selfGrade(i,v){\n  if(!graded() || (i in state.ans)) return;\n  state.ans[i]=v; save(); paintQ(i); paintStats(); paintResult();\n}\nfunction sendMulti(i){\n  const s = (state.sel||{})[i] || [];\n  if(!s.length || (i in state.ans) || !graded()) return;\n  state.ans[i] = s.slice().sort(); save(); paintQ(i); paintStats();\n  nextAfter(i);\n}\nfunction pick(i,o){\n  if(state.mode===\"practice\" && (i in state.ans)) return;\n  if(state.mode===\"test\" && state.submitted) return;\n  if(isMulti(Q[i])){\n    state.sel = state.sel||{}; const s = new Set(state.sel[i]||[]);\n    s.has(o) ? s.delete(o) : s.add(o);\n    state.sel[i] = [...s].sort();\n    if(state.mode===\"test\"){ if(state.sel[i].length) state.ans[i]=state.sel[i]; else delete state.ans[i]; }\n    save(); paintQ(i); paintStats(); return;\n  }\n  state.ans[i]=o; save();\n  paintQ(i); paintStats();\n  if(state.mode===\"practice\") nextAfter(i);\n}\n// practice: slide to the next unanswered question after showing feedback\nfunction nextAfter(i){\n  const nxt = Q.findIndex((q,j)=>j>i && !(j in state.ans) && visible(j));\n  if(nxt\u003c0) return;\n  if(!correct(i)) return;   // wrong: stay so the explanation can be read\n  setTimeout(()=>jump(nxt,true), 650);\n}\nfunction jump(i,soft){\n  if(!visible(i)){ state.onlyWrong=false; state.focus=null; save(); paintAll(); }\n  let el = $(\"q\"+i);\n  const card = el.closest(\"[data-items]\");\n  if(el.classList.contains(\"sub\") && card.dataset.items.split(\",\")[0]==String(i)) el = card;  // first sub: show the material too\n  if(!soft && window.innerWidth\u003c800) $(\"map\").open = false;\n  setTopH();\n  el.scrollIntoView({behavior: soft?\"smooth\":\"auto\", block: soft && el===$(\"q\"+i) ? \"center\":\"start\"});\n}\nfunction paintQ(i){\n  const q = Q[i], a = state.ans[i], has = i in state.ans, g = graded();\n  if(q.open){\n    const rev = (state.rev||{})[i] || has;\n    $(\"ref\"+i).classList.toggle(\"hide\", !(g && rev));\n    const rb = document.querySelector(`.reveal[data-rv=\"${i}\"]`);\n    rb.classList.toggle(\"hide\", g && rev); rb.disabled = !g;\n    $(\"hint\"+i).textContent = g ? \"\" : \"交卷後可看參考答案並自評\";\n    document.querySelectorAll(`.self[data-self=\"${i}\"]`).forEach(b=>{ b.disabled = has; b.setAttribute(\"aria-pressed\", a===b.dataset.v); });\n    const ta = document.querySelector(`.ans[data-q=\"${i}\"]`); ta.value = (state.txt||{})[i]||\"\";\n    const fb = $(\"fb\"+i);\n    if(has && g){ fb.className = \"fb ui \"+(a===\"ok\"?\"ok\":\"no\"); fb.innerHTML = `\u003cstrong>${a===\"ok\"?\"自評：答對\":\"自評：答錯\"}\u003c/strong>${q.e}`; }\n    else fb.className = \"fb hide\";\n    const n = document.querySelector(`.num[data-go=\"${i}\"]`);\n    n.className = \"num\" + (has && g ? (a===\"ok\"?\" ok\":\" no\") : ((state.txt||{})[i] ? \" done\" : \"\"));\n    return;\n  }\n  if(isMulti(q)){\n    const sel = new Set((has ? a : (state.sel||{})[i]) || []);\n    document.querySelectorAll(`.opt[data-q=\"${i}\"]`).forEach(b=>{\n      const oi = +b.dataset.o; b.className = \"opt\";\n      if(has && g){ if(q.a.includes(oi)) b.classList.add(sel.has(oi)?\"right\":\"miss\"); else if(sel.has(oi)) b.classList.add(\"wrong\"); }\n      else if(sel.has(oi)) b.classList.add(\"pick\");\n      b.disabled = (g && has) || (state.mode===\"test\" && state.submitted);\n    });\n    const sb = document.querySelector(`.send[data-send=\"${i}\"]`);\n    sb.classList.toggle(\"hide\", state.mode===\"test\" || has); sb.disabled = !sel.size;\n    const fb = $(\"fb\"+i);\n    if(has && g){ const ok = correct(i); fb.className = \"fb ui \"+(ok?\"ok\":\"no\");\n      fb.innerHTML = `\u003cstrong>${ok?\"答對了！\":\"答錯了，正確答案是\"+keyText(q)}\u003c/strong>${q.e}`; }\n    else fb.className = \"fb hide\";\n    const n = document.querySelector(`.num[data-go=\"${i}\"]`);\n    n.className = \"num\" + (has ? (g ? (correct(i)?\" ok\":\" no\") : \" done\") : \"\");\n    return;\n  }\n  document.querySelectorAll(`.opt[data-q=\"${i}\"]`).forEach(b=>{\n    const oi = +b.dataset.o;\n    b.className = \"opt\";\n    if(has && g){\n      if(oi===q.a) b.classList.add(\"right\");\n      else if(oi===a) b.classList.add(\"wrong\");\n    } else if(has && oi===a) b.classList.add(\"pick\");\n    b.disabled = (g && has) || (state.mode===\"test\" && state.submitted);\n  });\n  const fb = $(\"fb\"+i);\n  if(has && g){\n    const ok = a===q.a;\n    fb.className = \"fb ui \" + (ok?\"ok\":\"no\");\n    fb.innerHTML = `\u003cstrong>${ok?\"答對了！\":\"答錯了，正確答案是（\"+L[q.a]+\"）\"}\u003c/strong>${q.e}`;\n  } else fb.className = \"fb hide\";\n  const n = document.querySelector(`.num[data-go=\"${i}\"]`);\n  n.className = \"num\" + (has ? (g ? (a===q.a?\" ok\":\" no\") : \" done\") : \"\");\n}\nfunction paintStats(){\n  const ids = Object.keys(state.ans).map(Number).filter(i=>Q[i]);\n  const g = graded();\n  const okIds = ids.filter(correct), ok = okIds.length, no = ids.length-ok;\n  $(\"stDone\").textContent = ids.length;\n  $(\"stScore\").textContent = g ? fmt(okIds.reduce((s,i)=>s+Q[i].pt,0)) : \"–\";\n  $(\"stOk\").textContent = g ? ok : \"–\";\n  $(\"stNo\").textContent = g ? no : \"–\";\n  $(\"stRate\").textContent = g && ids.length ? Math.round(ok/ids.length*100)+\"%\" : \"–\";\n  $(\"redoWrong\").disabled = !(g && no);\n  $(\"onlyWrong\").disabled = !g;\n}\nconst visible = i => (!state.focus || state.focus.includes(i)) && (!state.onlyWrong || isWrong(i));\nfunction paintFilter(){\n  $(\"onlyWrong\").setAttribute(\"aria-pressed\", state.onlyWrong);\n  let any = false;\n  document.querySelectorAll(\"[data-items]\").forEach(card=>{\n    const ids = card.dataset.items.split(\",\").map(Number);\n    const show = ids.some(visible);\n    card.classList.toggle(\"hide\", !show);\n    if(show) any = true;\n    if(ids.length>1) ids.forEach(i=>$(\"q\"+i).classList.toggle(\"hide\", !visible(i)));\n  });\n  document.querySelectorAll(\".sec\").forEach(s=>s.classList.toggle(\"hide\", state.onlyWrong || !!state.focus));\n  $(\"showAll\").classList.toggle(\"hide\", !state.focus);\n  $(\"empty\").classList.toggle(\"hide\", any);\n}\nfunction paintAll(){\n  $(\"mPractice\").setAttribute(\"aria-pressed\", state.mode===\"practice\");\n  $(\"mTest\").setAttribute(\"aria-pressed\", state.mode===\"test\");\n  const testOpen = state.mode===\"test\" && !state.submitted;\n  $(\"submitTop\").classList.toggle(\"hide\", !testOpen);\n  $(\"endbar\").classList.toggle(\"hide\", !testOpen);\n  Q.forEach((_,i)=>paintQ(i));\n  paintStats(); paintFilter();\n  paintResult();\n  setTopH();\n}\nfunction paintResult(){\n  const r = $(\"result\");\n  if(state.mode===\"test\" && state.submitted){\n    const okIds = Object.keys(state.ans).map(Number).filter(i=>Q[i] && correct(i));\n    const pts = fmt(okIds.reduce((s,i)=>s+Q[i].pt,0));\n    const pend = Q.filter((q,i)=>q.open && !(i in state.ans)).length;\n    r.innerHTML = `交卷成績　\u003cb>${pts}\u003c/b> / ${fmt(TOTAL)} 分（答對 ${okIds.length} / ${Q.length} 題）${pend?`\u003cdiv style=\"font-size:14px;margin-top:4px\">還有 ${pend} 格非選擇題待自評，自評後分數會更新\u003c/div>`:\"\"}`;\n    r.classList.remove(\"hide\");\n  } else r.classList.add(\"hide\");\n}\nfunction setTopH(){ document.documentElement.style.setProperty(\"--topH\", ($(\"top\").offsetHeight+12)+\"px\"); }\n\n$(\"mPractice\").onclick = ()=>{ if(state.mode===\"practice\") return; state.mode=\"practice\"; state.submitted=false; save(); paintAll(); };\n$(\"mTest\").onclick = ()=>{ if(state.mode===\"test\") return;\n  state.mode=\"test\"; state.submitted=false; state.ans={}; state.rev={}; state.sel={}; state.onlyWrong=false; state.focus=null; save(); paintAll(); window.scrollTo({top:0}); };\nfunction submit(){\n  const left = Q.length - Object.keys(state.ans).length;\n  const b = $(\"submitTop\"), e = $(\"submitEnd\");\n  if(left>0 && !b.dataset.armed){\n    b.dataset.armed = e.dataset.armed = \"1\";\n    b.textContent = e.textContent = `還有 ${left} 題沒作答，再按一次交卷`;\n    setTimeout(()=>{ b.dataset.armed=e.dataset.armed=\"\"; b.textContent=e.textContent=\"交卷\"; }, 4000);\n    return;\n  }\n  b.dataset.armed=e.dataset.armed=\"\"; b.textContent=e.textContent=\"交卷\";\n  state.submitted = true; save(); paintAll(); window.scrollTo({top:0});\n}\n$(\"submitTop\").onclick = submit; $(\"submitEnd\").onclick = submit;\n$(\"showAll\").onclick = ()=>{ state.focus=null; save(); paintAll(); window.scrollTo({top:0}); };\n$(\"onlyWrong\").onclick = ()=>{ state.onlyWrong = !state.onlyWrong; state.focus=null; save(); paintAll(); window.scrollTo({top:0}); };\n$(\"redoWrong\").onclick = ()=>{\n  const wrong = Q.map((_,i)=>i).filter(isWrong);\n  wrong.forEach(i=>{ delete state.ans[i]; if(state.rev) delete state.rev[i]; if(state.sel) delete state.sel[i]; });\n  if(state.mode===\"test\") state.submitted=false;\n  state.onlyWrong = false; state.focus = wrong; save(); paintAll();\n  if(wrong.length) jump(wrong[0]);\n};\n$(\"reset\").onclick = ()=>{\n  const b = $(\"reset\");\n  if(!b.dataset.armed){ b.dataset.armed=\"1\"; b.textContent=\"再按一次確認\"; setTimeout(()=>{b.dataset.armed=\"\";b.textContent=\"重新作答\";},3000); return; }\n  b.dataset.armed=\"\"; b.textContent=\"重新作答\";\n  state.ans={}; state.txt={}; state.rev={}; state.sel={}; state.submitted=false; state.onlyWrong=false; state.focus=null; save(); paintAll(); window.scrollTo({top:0});\n};\nwindow.addEventListener(\"resize\", setTopH);\n$(\"map\").addEventListener(\"toggle\", setTopH);\n\nif(window.innerWidth\u003c800) $(\"map\").open = false;\nbuild(); paintAll();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";</script>
<script>
const QUIZ = [
  {id:"c4",  sub:"book", unit:"第四課",   short:"第四課", name:"第四課 試卷",                n:49, meta:"改錯 13・單選 21・題組 15，共 49 題・滿分 49 分", key:"chi4-paper"},
  {id:"c5",  sub:"book", unit:"第五課",   short:"第五課", name:"生命中的碎珠",               n:25, meta:"單選 25 題・滿分 100 分", key:"chi5-paper"},
  {id:"c6",  sub:"book", unit:"第六課",   short:"第六課", name:"鳥",                         n:25, meta:"單選 25 題・滿分 100 分", key:"chi6-paper"},
  {id:"cg2", sub:"lte",  unit:"語文常識", short:"語文常識", name:"（二）語法（下）句子",     n:30, meta:"單選 30 題・滿分 90 分",  key:"chig2-paper"}
];
const SUB = {book:{name:"課文", ic:"國"}, lte:{name:"語文常識", ic:"語"}};
const $ = id => document.getElementById(id);

function progress(q){
  if(!q.key) return "";
  try{
    const s = JSON.parse(localStorage.getItem(q.key)||"null");
    const done = s && s.ans ? Object.keys(s.ans).length : 0;
    return done ? `<span class="prog">已作答 ${done} / ${q.n}</span>` : "";
  }catch(e){ return ""; }
}
function buildBar(){
  let h = `<button class="tabi home" data-go="home"><span class="ic">⌂</span><span class="lb">首頁</span></button><span class="sep"></span>`;
  let last = "";
  QUIZ.forEach(q=>{
    if(last && last!==q.sub) h += `<span class="sep"></span>`;
    last = q.sub;
    h += `<button class="tabi ${q.sub}" data-go="${q.id}" title="${q.name}"><span class="ic">${SUB[q.sub].ic}</span><span class="lb">${q.short||q.unit}</span></button>`;
  });
  $("bar").innerHTML = h;
  $("bar").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function buildHome(){
  $("list").innerHTML = Object.keys(SUB).map(k=>`
    <section class="${k}">
      <h2><span class="dot"></span>${SUB[k].name}</h2>
      <div class="grid">${QUIZ.filter(q=>q.sub===k).map(q=>`
        <button class="card ${k}" data-go="${q.id}">
          <span class="unit">${q.unit}</span>
          <span class="name">${q.name}</span>
          <span class="meta">${q.meta}</span>
          ${progress(q)}
          <span class="go">開始測驗 →</span>
        </button>`).join("")}</div>
    </section>`).join("");
  $("list").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}
// links like <a href="#q12"> inside an embedded quiz would otherwise reload this page in the frame:
// scroll to the target inside the quiz instead
function fixAnchors(f){
  let doc; try{ doc = f.contentDocument; }catch(e){ return; }
  if(!doc || doc.__anchorFix) return;
  doc.__anchorFix = true;
  doc.addEventListener("click", e=>{
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    if(!a) return;
    e.preventDefault();
    const id = decodeURIComponent(a.getAttribute("href").slice(1));
    if(!id){ f.contentWindow.scrollTo({top:0, behavior:"smooth"}); return; }
    const el = doc.getElementById(id) || doc.getElementsByName(id)[0];
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }, true);
}
let current = null;
function show(id){
  if(!QZ[id]) id = "home";
  document.querySelectorAll(".tabi").forEach(b=>{ if(b.dataset.go===id) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const tab = document.querySelector(`.tabi[data-go="${id}"]`);
  if(tab) tab.scrollIntoView({block:"nearest", inline:"nearest"});
  if(id==="home"){
    $("frame").classList.add("hide"); $("homeView").classList.remove("hide");
    buildHome(); current = "home"; document.title = "國文互動測驗"; return;
  }
  if(current===id) return;
  current = id;
  $("homeView").classList.add("hide"); $("loading").classList.remove("hide");
  const f = $("frame");
  f.classList.remove("hide");
  f.onload = ()=>{ $("loading").classList.add("hide"); fixAnchors(f); };
  f.srcdoc = QZ[id];
  const q = QUIZ.find(x=>x.id===id); document.title = (q.unit+" "+q.name) + "｜國文互動測驗";
}
function go(id){
  if(location.hash.slice(1)===id || (id==="home" && !location.hash)) show(id);
  else location.hash = id==="home" ? "" : id;
}
window.addEventListener("hashchange", ()=>show(location.hash.slice(1)||"home"));
buildBar();
show(location.hash.slice(1)||"home");
</script>
</body>
