*{box-sizing:border-box}

#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--canvas)}

header{border-bottom:2px solid var(--ink);padding-bottom:14px}

.lead{color:var(--muted);margin:6px 0 0}
section{margin-top:26px}

section h2 .dot{width:12px;height:12px;border-radius:3px;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);

.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.card:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.unit{font-family:"Noto Serif TC",serif;font-weight:900;font-size:28px;line-height:1.1;color:var(--c)}
.name{font-weight:700;font-size:16px}
.meta{font-size:13px;color:var(--muted)}
.prog{font-size:12.5px;font-weight:700;color:var(--c);background:var(--cb);border-radius:6px;padding:2px 8px;align-self:flex-start}
.go{margin-top:auto;padding-top:8px;font-size:14px;font-weight:700;color:var(--c)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px;pointer-events:none}
.hide{display:none!important}
footer{margin-top:40px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>

</div>

t-size:16px}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"top ui\" id=\"top\">\n \u003cdiv class=\"top-in\">\n  \u003cdiv class=\"row1\">\n    \u003ch1 id=\"ttl\">\u003c/h1>\n    \u003cdiv class=\"stats\">\n      \u003cspan>已作答 \u003cb id=\"stDone\">0\u003c/b> / \u003cspan id=\"stTotal\">\u003c/span>\u003c/span>\n      \u003cspan>得分 \u003cb id=\"stScore\">0\u003c/b> / \u003cspan id=\"stMax\">\u003c/span>\u003c/span>\n      \u003cspan class=\"g\">答對 \u003cb id=\"stOk\">0\u003c/b>\u003c/span>\n      \u003cspan class=\"r\">答錯 \u003cb id=\"stNo\">0\u003c/b>\u003c/span>\n      \u003cspan>答對率 \u003cb id=\"stRate\">–\u003c/b>\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"row2\">\n    \u003cdiv class=\"seg\" role=\"group\" aria-label=\"作答模式\">\n      \u003cbutton id=\"mPractice\" aria-pressed=\"true\">練習：選了就對答案\u003c/button>\n      \u003cbutton id=\"mTest\" aria-pressed=\"false\">測驗：交卷再對答案\u003c/button>\n    \u003c/div>\n    \u003cbutton class=\"tbtn\" id=\"onlyWrong\" aria-pressed=\"false\">只看錯題\u003c/button>\n    \u003cbutton class=\"tbtn\" id=\"redoWrong\" disabled>重練錯題\u003c/button>\n    \u003cbutton class=\"tbtn hide\" id=\"showAll\" aria-pressed=\"true\">重練中・顯示全部\u003c/button>\n    \u003cbutton class=\"tbtn\" id=\"reset\">重新作答\u003c/button>\n    \u003cbutton class=\"tbtn submit hide\" id=\"submitTop\">交卷\u003c/button>\n  \u003c/div>\n  \u003cdetails class=\"map\" id=\"map\" open>\n    \u003csummary>題號一覽（點題號可跳轉）\u003c/summary>\n    \u003cdiv class=\"grid-wrap\" id=\"gridwrap\">\u003c/div>\n  \u003c/details>\n \u003c/div>\n\u003c/div>\n\n\u003cmain id=\"paper\">\n  \u003cdiv class=\"result ui hide\" id=\"result\">\u003c/div>\n  \u003cdiv id=\"secs\">\u003c/div>\n  \u003cp class=\"empty ui hide\" id=\"empty\">目前沒有錯題 👍\u003c/p>\n  \u003cdiv class=\"endbar ui hide\" id=\"endbar\">\u003cbutton class=\"tbtn submit\" id=\"submitEnd\">交卷\u003c/button>\u003c/div>\n\u003c/main>\n\n\u003cscript>\nconst TITLE = \"國文第四課　試卷・互動練習\";\nconst SECS = [{\"name\": \"改錯題\", \"note\": \"每題 1 分，共 13 分，寫完後對照答案自評\", \"group\": false}, {\"name\": \"單一選擇題\", \"note\": \"每題 1 分，共 21 分\", \"group\": false}, {\"name\": \"題組\", \"note\": \"每格 1 分，共 15 分\", \"group\": true}];\nconst G = {\"t1\": {\"label\": \"題組 1\", \"html\": \"\u003cp>買花　\u003cu>白居易\u003c/u>\u003c/p>\\n\u003cp>帝城春欲暮，喧喧①車馬度。\u003c/p>\\n\u003cp>共道牡丹時，相隨買花去。\u003c/p>\\n\u003cp>貴賤無常價，酬直看花數。\u003c/p>\\n\u003cp>灼灼②百朵紅，戔戔③五束素④。\u003c/p>\\n\u003cp>上張幄幕庇，旁織笆籬護。\u003c/p>\\n\u003cp>水灑復泥封，移來色如故。\u003c/p>\\n\u003cp>家家習為俗，人人迷不悟。\u003c/p>\\n\u003cp>有一田舍翁，偶來買花處。\u003c/p>\\n\u003cp>低頭獨長嘆，此嘆無人喻。\u003c/p>\\n\u003cp>一叢深色花，十戶中人賦。\u003c/p>\\n\u003cp>注：\u003c/p>\\n\u003cp>①喧喧：喧鬧的樣子。\u003c/p>\\n\u003cp>②灼灼：明亮的樣子，此處指花朵豔麗的樣子。\u003c/p>\\n\u003cp>③戔戔：積聚的樣子，形容眾多。戔，音ㄐㄧㄢ。\u003c/p>\\n\u003cp>④五束素：即二十五匹絹帛。\u003c/p>\"}, \"t2\": {\"label\": \"題組 2\", \"html\": \"\u003cp>\u003cu>永\u003c/u>之氓咸善游。一日，水暴甚。有五、六氓乘小船絕\u003cu>湘水\u003c/u>。中濟，船破，皆游。\u003cbr />\\n　　有一氓盡力而不能尋常。其侶曰：「汝善游最也，今何後為？」曰：「吾腰千錢，重，是以後。」曰：「何不去之！」不應，搖其首。\u003cbr />\\n　　有頃，益怠。已濟者立岸上，呼且號，曰：「汝愚之甚、蔽之甚！身且死，何以貨為？」又搖其首，遂溺死。\u003cbr />\\n　　吾哀之，且若是，得不有大貨之溺大氓者乎？\u003c/p>\\n\u003cp>（節錄自\u003cu>柳宗元\u003c/u>　\u003cu class=\\\"wavy\\\">柳河東集\u003c/u>）\u003c/p>\\n\u003cp>註：①\u003cu>永\u003c/u>：地名，\u003cu>永州\u003c/u>。\u003cbr />\\n　　②氓：百姓。\u003cbr />\\n　　③水暴甚：水暴漲得厲害。\u003cbr />\\n　　④「絕」\u003cu>湘水\u003c/u>：橫渡。\u003c/p>\\n\u003cp>　　⑤不能「尋常」：度量單位，古代八尺為尋，倍尋為常。比喻狹小的地方。\u003c/p>\\n\u003cp>　　⑥且若是：還像這樣。\u003c/p>\"}, \"t3\": {\"label\": \"題組 3\", \"html\": \"\u003cp>有疑\u003cu>陶淵明\u003c/u>詩篇篇有酒，吾觀其意不在酒，亦寄酒為跡者也。其文章不群，辭采精拔，跌宕昭彰，獨超眾類，抑揚爽朗，莫之與京①。橫素波而傍流，干青雲而直上。語時事則指而可想，論懷抱則曠而且真。加以貞志不休，安道苦節，不以躬耕為恥，不以無財為病。自非大賢篤志，孰能如此乎？余愛嗜其文，不能釋手，尚想其德，恨不同時。\u003c/p>\\n\u003cp>——改寫自\u003cu>蕭統\u003c/u>〈陶淵明集序〉\u003c/p>\\n\u003cp>【107　年會考】\u003c/p>\\n\u003cp>註：①莫之與「京」：齊等。\u003c/p>\"}, \"t4\": {\"label\": \"題組 4\", \"html\": \"\u003cp>荷塘夕照　方瑜\u003cbr />\\n　　看荷花，宜晨、宜夜。朝暉月色映照下，玉立亭亭，青蓋田田，倍添麗色。不過，黃昏夕陽中，卻也別有風情。\u003cbr />\\n　　近來，炎天溽暑，始終徘徊不去。很想念那片「清風徐來，綠雲自動」的荷池。趁著晚晴時分，全家到了植物園。一路上盡念著\u003cu>姜白石\u003c/u>的句子：「古城野水，喬木參天」、「水佩風裳無數」、「冷香飛上詩句」、「高柳垂蔭，老魚吹浪，留我花間住」，似乎涼意頓生，溽暑已消。\u003cbr />\\n　　可是，真正面對滿塘翠葉紅花，卻很想嘆氣！首先，荷葉太擠，擠得每片葉子都不易伸展，很難有「田田」之感；其次，花不是已謝，就是未開，加以剛下過一場雨，一點荷香也聞不到，自悔尋芳到已遲，「冷香嫣然」只有憑想像得之。再放眼一望，池塘中間居然一大塊空白，片葉俱無，真像人頭上患了癬癩之疾，成了不毛之地！據說是水汙染的後遺症，真是大煞風景。看荷的心情，到此已索然無味，正預備敗興而返—偏偏一歲半的小女兒面對平生初見的「奇景」，正感動得目眩神迷，不停地說「花花開啦！」「蜻蜓來啦！」兩條小腿，繞池急奔，興奮得恨不能縱浪池水中，伴花葉蜻蜓共舞！怕她跌倒，我們也只有繞池一周。這才發覺到池邊樹下，遊人如織，觀賞荷塘夕照的人並不少！面向一池翠碧，有人靜坐，有人閒聊，有人讀書，有人漫步，俱都怡然自得。驟而方晴，夕陽燦燦如金，荷風陣陣，拂面生涼，老樹濃蔭，細草柔碧。再細看池中未開的花苞宛如木筆，亭亭擎立，嫣紅如染，荷葉上圓珠的皪，晶瑩如玉。此情此景，確也可樂。忽覺心中陰霾頓消，也想和著大女兒唱起歌來：「夕陽斜，晚風飄，大家齊唱\u003cu class=\\\"wavy\\\">採蓮謠\u003c/u>……。」\u003cbr />\\n　　原來喜樂悲愁，全在一念之間。一年好景，一歲繁花，本無須遠求，只要能以無沾不染之心，鉅細靡遺的眼，真正去領略，就是福氣。\u003c/p>\"}, \"t5\": {\"label\": \"題組 5\", \"html\": \"\u003cp>有疑\u003cu>陶淵明\u003c/u>詩篇篇有酒，吾觀其意不在酒，亦寄酒為跡者也。其文章不群，辭采精拔，跌宕昭彰，獨超眾類，抑揚爽朗，莫之與京。橫素波而傍流，干青雲而直上。語時事則指而可想，論懷抱則曠而且真。加以貞志不休，安道苦節，不以躬耕為恥，不以無財為病。自非大賢篤志，孰能如此乎？余愛嗜其文，不能釋手，尚想其德，恨不同時。\u003cbr />\\n註：①莫之與「京」：齊等。\u003c/p>\\n\u003cp>（改寫自\u003cu>蕭統\u003c/u>　\u003cu class=\\\"wavy\\\">陶淵明集序\u003c/u>）\u003c/p>\\n\u003cp>〔107.會考〕\u003c/p>\"}, \"t6\": {\"label\": \"題組 6\", \"html\": \"\u003cp>愛蓮，\u003cu>中國\u003c/u>古人已樹立了很好的風操，\u003cu>周敦頤\u003c/u>賞荷悟出了通達的哲理；\u003cu>曹植\u003c/u>愛蓮則為荷花立傳作賦，情切意真。農曆六月二十四日為荷花生日，余往\u003cu>紫竹院公園\u003c/u>賞荷，卻別有所感。\u003c/p>\\n\u003cp>　　從東門進園，北行數百步，一橋相隔的荷地映入眼簾。「接天蓮葉無窮碧，映日荷花別樣紅」的壯麗景色，平展而出，一縷縷荷香隨之撲鼻而來，愈走近池岸，清香愈加沁人心脾。定睛看那密密層層的荷葉，恰似一個個碧綠的「承露盤」。每張荷葉上都承托著大大小小的、滾動著的晶瑩水珠。荷葉叢中，盛開著紅若塗朱、潔如素玉的荷花，楚楚動人，極富魅力。\u003c/p>\\n\u003cp>　　過蓮橋，行至\u003cu>荷花渡\u003c/u>南岸，突然，一陣疾風大作，只見滿池荷葉，忽而由東向西搖擺，忽而又由西向東搖擺，一柄柄蓮莖上的碧葉被捲成滾滾綠浪。它們互不撞擊，互不擠軋，更不彼此躲藏，層次分明，順乎自然，疾風愈烈，也只是循聲而動，絕無亂擺亂間的。群生蓮之如是勁健，貴在於單株素質之勻稱，無高低參差之不齊故也。\u003c/p>\\n\u003cp>　　疾風一過，蓮池復歸平靜，滿池如珠如玉的荷花亭亭玉立，更美更清新。蓮池群生之荷，竟無一疏落，無一折莖，無一不顯得雄勁。視之，嘖嘖稱讚：群生荷其抗禦疾風之力，非單株所能有者，若離群而立，倖存者幾許呢？\u003cu>頤\u003c/u>公未見及此，故伊「獨愛蓮之出淤泥而不染，濯清漣而不妖」之世俗高潔，而忽略群體賴以生存之潛力，故余以所見所感，特寫此文以抒胸臆。\u003c/p>\\n\u003cp>（\u003cu>周沙塵\u003c/u>〈愛蓮新說〉）\u003c/p>\"}};\nconst Q = [{\"s\": 0, \"n\": \"1\", \"open\": true, \"p\": \"\u003cp>池畔的芙渠亭亭而立，氣質速雅，仿若出晨仙子，令人心生敬意，不敢懈玩。\u003c/p>\", \"r\": \"錯字訂正：渠→蕖、速→素、晨→塵、懈→褻\", \"e\": \"對照每個錯字是否都找到、也寫對了。\", \"pre\": \"\u003cp class=\\\"ui\\\" style=\\\"font-size:14px;color:var(--muted);margin:0 0 6px\\\">句中共有 4 個錯字，請找出並寫出正確的字。\u003c/p>\", \"pt\": 1}, {\"s\": 0, \"n\": \"2\", \"open\": true, \"p\": \"\u003cp>公司高層決定櫂升她為副理的事情早已陳矣落定，如今你再提出任何崎見都已太遲，比起發出謂嘆不如接受現實。\u003c/p>\", \"r\": \"錯字訂正：櫂→擢、陳→塵、矣→埃、崎→歧、謂→喟\", \"e\": \"對照每個錯字是否都找到、也寫對了。\", \"pre\": \"\u003cp class=\\\"ui\\\" style=\\\"font-size:14px;color:var(--muted);margin:0 0 6px\\\">句中共有 5 個錯字，請找出並寫出正確的字。\u003c/p>\", \"pt\": 1}, {\"s\": 0, \"n\": \"3\", \"open\": true, \"p\": \"\u003cp>\u003cu>臺灣\u003c/u>的四季\u003cu>經\u003c/u>　\u003cu>渭\u003c/u>分明，一到夏季那排道路兩旁的樹便支蕃葉茂形成綠色遂道，吸引不少遊客前來新賞、遊憩。\u003c/p>\", \"r\": \"錯字訂正：經→涇、支→枝、蕃→繁、遂→隧、新→欣\", \"e\": \"對照每個錯字是否都找到、也寫對了。\", \"pre\": \"\u003cp class=\\\"ui\\\" style=\\\"font-size:14px;color:var(--muted);margin:0 0 6px\\\">句中共有 5 個錯字，請找出並寫出正確的字。\u003c/p>\", \"pt\": 1}, {\"s\": 0, \"n\": \"4\", \"open\": true, \"p\": \"\u003cp>\u003cu>楊貴妃\u003c/u>如「初水芙蓉」的驕柔清麗虜獲了皇上的心。\u003c/p>\", \"r\": \"錯字訂正：初→出、驕→嬌\", \"e\": \"對照每個錯字是否都找到、也寫對了。\", \"pre\": \"\u003cp class=\\\"ui\\\" style=\\\"font-size:14px;color:var(--muted);margin:0 0 6px\\\">句中共有 2 個錯字，請找出並寫出正確的字。\u003c/p>\", \"pt\": 1}, {\"s\": 0, \"n\": \"5\", \"open\": true, \"p\": \"\u003cp>\u003cu>周敦頤\u003c/u>住家前的草生長茂勝，卻從不休剪。\u003c/p>\", \"r\": \"錯字訂正：勝→盛、休→修\", \"e\": \"對照每個錯字是否都找到、也寫對了。\", \"pre\": \"\u003cp class=\\\"ui\\\" style=\\\"font-size:14px;color:var(--muted);margin:0 0 6px\\\">句中共有 2 個錯字，請找出並寫出正確的字。\u003c/p>\", \"pt\": 1}, {\"s\": 0, \"n\": \"6\", \"open\": true, \"p\": \"\u003cp>\u003cu class=\\\"wavy\\\">愛蓮說\u003c/u>是一篇籍物言志紓懷的上剩之作。\u003c/p>\", \"r\": \"錯字訂正：籍→藉、紓→抒、剩→乘\", \"e\": \"對照每個錯字是否都找到、也寫對了。\", \"pre\": \"\u003cp class=\\\"ui\\\" style=\\\"font-size:14px;color:var(--muted);margin:0 0 6px\\\">句中共有 3 個錯字，請找出並寫出正確的字。\u003c/p>\", \"pt\": 1}, {\"s\": 0, \"n\": \"7\", \"open\": true, \"p\": \"\u003cp>各種花彙的精神在作者寄遇情感予以頗析之後，全都富予了生命。\u003c/p>\", \"r\": \"錯字訂正：彙→卉、遇→寓、頗→剖、富→賦\", \"e\": \"對照每個錯字是否都找到、也寫對了。\", \"pre\": \"\u003cp class=\\\"ui\\\" style=\\\"font-size:14px;color:var(--muted);margin:0 0 6px\\\">句中共有 4 個錯字，請找出並寫出正確的字。\u003c/p>\", \"pt\": 1}, {\"s\": 0, \"n\": \"8\", \"open\": true, \"p\": \"\u003cp>\u003cu>陽明山\u003c/u>花季一到，草木慢發，萬物生生不習的氣像，由然而生。\u003c/p>\", \"r\": \"錯字訂正：慢→蔓、習→息、像→象、由→油\", \"e\": \"對照每個錯字是否都找到、也寫對了。\", \"pre\": \"\u003cp class=\\\"ui\\\" style=\\\"font-size:14px;color:var(--muted);margin:0 0 6px\\\">句中共有 4 個錯字，請找出並寫出正確的字。\u003c/p>\", \"pt\": 1}, {\"s\": 0, \"n\": \"9\", \"open\": true, \"p\": \"\u003cp>春天一到，草木新新向融，各種花奔爭相顫放。\u003c/p>\", \"r\": \"錯字訂正：新→欣、融→榮、奔→卉、顫→綻\", \"e\": \"對照每個錯字是否都找到、也寫對了。\", \"pre\": \"\u003cp class=\\\"ui\\\" style=\\\"font-size:14px;color:var(--muted);margin:0 0 6px\\\">句中共有 4 個錯字，請找出並寫出正確的字。\u003c/p>\", \"pt\": 1}, {\"s\": 0, \"n\": \"10\", \"open\": true, \"p\": \"\u003cp>佛經已蓮代表理想人格，普薩都是座在蓮花坐上。\u003c/p>\", \"r\": \"錯字訂正：已→以、普→菩、座→坐、坐→座\", \"e\": \"對照每個錯字是否都找到、也寫對了。\", \"pre\": \"\u003cp class=\\\"ui\\\" style=\\\"font-size:14px;color:var(--muted);margin:0 0 6px\\\">句中共有 4 個錯字，請找出並寫出正確的字。\u003c/p>\", \"pt\": 1}, {\"s\": 0, \"n\": \"11\", \"open\": true, \"p\": \"\u003cp>\u003cu>淡水河\u003c/u>浩渺的煙波，就橫亙在窗外。與對岸的\u003cu>觀音山\u003c/u>兩相對映，山水毓秀，盡在眼前，令人心胸大開。能座擁這片青山綠水，難怪詩人能不為型體所疫，而蹤身天地造化之間，悠游在佛經和詩學的國度裡。\u003c/p>\", \"r\": \"錯字訂正：座→坐、型→形、疫→役、蹤→縱\", \"e\": \"對照每個錯字是否都找到、也寫對了。\", \"pre\": \"\u003cp class=\\\"ui\\\" style=\\\"font-size:14px;color:var(--muted);margin:0 0 6px\\\">句中共有 4 個錯字，請找出並寫出正確的字。\u003c/p>\", \"pt\": 1}, {\"s\": 0, \"n\": \"12\", \"open\": true, \"p\": \"\u003cp>「擢清連而不夭」象徵君子不取眉於事。\u003c/p>\", \"r\": \"錯字訂正：擢→濯、連→漣、夭→妖、眉→媚、事→世\", \"e\": \"對照每個錯字是否都找到、也寫對了。\", \"pre\": \"\u003cp class=\\\"ui\\\" style=\\\"font-size:14px;color:var(--muted);margin:0 0 6px\\\">句中共有 5 個錯字，請找出並寫出正確的字。\u003c/p>\", \"pt\": 1}, {\"s\": 0, \"n\": \"13\", \"open\": true, \"p\": \"\u003cp>\u003cu>阿丹\u003c/u>三番兩次在課堂上搗蛋，每次看到老師無耐的眼神，他的雙眼就閃躍著「小人得志」的光茫，此後上課時都漫不經心，一心只想整老師，期末時成積一落千丈，可說是究由自取啊！\u003c/p>\", \"r\": \"錯字訂正：耐→奈、躍→耀、茫→芒、積→績、究→咎\", \"e\": \"對照每個錯字是否都找到、也寫對了。\", \"pre\": \"\u003cp class=\\\"ui\\\" style=\\\"font-size:14px;color:var(--muted);margin:0 0 6px\\\">句中共有 5 個錯字，請找出並寫出正確的字。\u003c/p>\", \"pt\": 1}, {\"s\": 1, \"n\": \"1\", \"p\": \"\u003cp>比喻君子「剛毅正直的態度，屹立不屈的人格」，下列何者是最適當的詞語？\u003c/p>\", \"o\": [\"出淤泥而不染\", \"中通外直、亭亭淨植\", \"可遠觀而不可褻玩焉\", \"濯清漣而不妖\"], \"a\": 1, \"e\": \"「中通外直、亭亭淨植」藉由描繪蓮花梗中空，外形挺拔的形象，以象徵君子剛毅正直的態度、屹立不屈的人格，故選(Ｂ)。\", \"pt\": 1}, {\"s\": 1, \"n\": \"2\", \"p\": \"\u003cp>下列「是」字，何者「不是」表示賓語提前的用法？\u003c/p>\", \"o\": [\"挑撥「是」非\", \"馬首「是」瞻\", \"寸陰「是」競\", \"唯利「是」圖\"], \"a\": 0, \"e\": \"(Ａ)「是非」的「是」指對、正確，是名詞。(Ｂ)(Ｃ)(Ｄ)的「是」都是把賓語提前的助詞：瞻馬首、競寸陰、圖唯利。\", \"pt\": 1}, {\"s\": 1, \"n\": \"3\", \"p\": \"\u003cp>\u003cu>莉莉\u003c/u>到廟裡求籤詩，廟祝解說如下：「做人應該通情達理，培養正直的個性，日子久了，自然海闊天空。」她求到的籤詩可能是以下哪四個字？\u003c/p>\", \"o\": [\"不蔓不枝\", \"香遠益清\", \"淤泥不染\", \"中通外直\"], \"a\": 3, \"e\": \"(Ｄ)由「通情達理，培養正直的個性」可知。\", \"pt\": 1}, {\"s\": 1, \"n\": \"4\", \"p\": \"\u003cp>下列哪一個字詞經替換後，文意不變？\u003c/p>\", \"o\": [\"別來「無恙」：無暇\", \"可愛者甚「蕃」：煩\", \"世人「盛」愛牡丹：甚\", \"香遠「益」清：易\"], \"a\": 2, \"e\": \"(Ｃ)「盛」與「甚」都是「很、非常」的意思，替換後文意不變。其他宜改為：(Ａ)無恙＝無事（無暇是沒有空）(Ｂ)蕃＝繁（不是煩）(Ｄ)益＝更（不是易）。\", \"pt\": 1}, {\"s\": 1, \"n\": \"5\", \"p\": \"\u003cp>「搔首弄姿，引人側目。」這句話與君子何種美德相「違背」？\u003c/p>\", \"o\": [\"濯清漣而不妖\", \"出淤泥而不染\", \"不可褻玩\", \"中通外直\"], \"a\": 0, \"e\": \"「搔首弄姿，引人側目」語意在形容姿態輕佻、刻意吸引目光，帶有媚俗之意，與愛蓮說中「濯清漣而不妖」所描繪的蓮花清麗而不妖媚、端莊自持的君子風範相違背，故選(Ａ)。\", \"pt\": 1}, {\"s\": 1, \"n\": \"6\", \"p\": \"\u003cp>\u003cu>周敦頤\u003c/u>用哪一句來指出君子自有高雅的風骨，而不為閹然媚世之態？\u003c/p>\", \"o\": [\"出淤泥而不染\", \"濯清漣而不妖\", \"中通外直，不蔓不枝\", \"香遠益清，亭亭淨植\"], \"a\": 1, \"e\": \"「濯清漣而不妖」形容蓮花雖生長在清水中卻不妖媚，象徵君子保持高潔風骨，不隨俗媚世，故選(Ｂ)。\", \"pt\": 1}, {\"s\": 1, \"n\": \"7\", \"p\": \"\u003cp>\u003cu class=\\\"wavy\\\">愛蓮說\u003c/u>一文中，以「蓮之愛，同予者何人」作結語，可知作者的心境如何？\u003c/p>\", \"o\": [\"自以為是\", \"悲天憫人\", \"孤單感嘆\", \"憤世嫉俗\"], \"a\": 2, \"e\": \"(Ｃ)感嘆有道德理想的君子極少。\", \"pt\": 1}, {\"s\": 1, \"n\": \"8\", \"p\": \"\u003cp>下列文句中「之」的字義，何者意思\u003cu class=\\\"dbl\\\">不同\u003c/u>？\u003c/p>\", \"o\": [\"水陸草木「之」花\", \"予獨愛蓮「之」出淤泥而不染\", \"今「之」孝者，是謂能養\", \"極其言，茲若人「之」儔乎\"], \"a\": 1, \"e\": \"(Ａ)(Ｃ)(Ｄ)的。(Ｂ)助詞，無義。\", \"pt\": 1}, {\"s\": 1, \"n\": \"9\", \"p\": \"\u003cp>\u003cu>宋代\u003c/u>理學之祖\u003cu>周敦頤\u003c/u>對於「花」之品格衡定，下列何者敘述正確？\u003c/p>\", \"o\": [\"世人愛牡丹：豔冠群芳，隨俗浮沉，故委婉地貶責\", \"蘭：香遠益清，潔身自愛，以「濯清漣而不妖」贊之\", \"蓮：具君子之德，象徵環境之艱苦仍不屈，以「清雅虛心」評之\", \"\u003cu>陶淵明\u003c/u>愛菊：眾芳蕪穢時，菊之孤傲自賞，未免太自鳴清高\"], \"a\": 0, \"e\": \"(Ｂ)「香遠益清」「濯清漣而不妖」是寫蓮，不是蘭。(Ｃ)「虛心」是竹的特質，不是蓮。(Ｄ)作者並沒有批評陶淵明自鳴清高。\", \"pt\": 1}, {\"s\": 1, \"n\": \"10\", \"p\": \"\u003cp>\u003cu class=\\\"wavy\\\">愛蓮說\u003c/u>一文中，用蓮的特質描寫君子的特性，下列何者解讀\u003cu class=\\\"dbl\\\">錯誤\u003c/u>？\u003c/p>\", \"o\": [\"出淤泥而不染—指君子不同流合汙\", \"濯清漣而不妖—指君子不妖言惑眾\", \"中通外直，不蔓不枝—指君子不趨炎附勢\", \"亭亭淨植，可遠觀而不可褻玩焉—指君子使人不敢輕慢玩弄\"], \"a\": 1, \"e\": \"(Ｂ)指君子不逢迎諂媚。\", \"pt\": 1}, {\"s\": 1, \"n\": \"11\", \"p\": \"\u003cp>\u003cu>周敦頤\u003c/u>寫蓮花，下列說明何者正確？\u003c/p>\", \"o\": [\"純粹客觀描寫，毫不添加任何感情\", \"藉蓮花來隱喻君子離群索居的志向\", \"藉牡丹來寄託君子直道立身的風骨\", \"藉蓮花來反諷追求富貴者眾\"], \"a\": 3, \"e\": \"(Ａ)表面上寫蓮花，實則寫君子，除了藉蓮花來象徵君子的美德外，更寄託作者的胸懷，非客觀描寫(Ｂ)隱喻君子正直莊重的品格，以及不肯媚世隨俗的高尚情操(Ｃ)蓮花。\", \"pt\": 1}, {\"s\": 1, \"n\": \"12\", \"p\": \"\u003cp>下列「　」中的字，何者將「名詞」當「動詞」使用？\u003c/p>\", \"o\": [\"中通外直，不「蔓」不枝\", \"亭亭淨「植」\", \"牡丹之「愛」\", \"「濯」清漣而不妖\"], \"a\": 0, \"e\": \"(Ａ)本是指藤蔓，在這裡指蔓延細莖。\", \"pt\": 1}, {\"s\": 1, \"n\": \"13\", \"p\": \"\u003cp>下列「　」中的字，哪一組意義相同？\u003c/p>\", \"o\": [\"予「獨」愛蓮／單打「獨」鬥\", \"出淤泥「而」不染／既醉「而」退\", \"倨傲「鮮」腆／「鮮」嫩\", \"老當「益」壯／香遠「益」清\"], \"a\": 3, \"e\": \"(Ａ)特別／單一的。(Ｂ)卻／然後。(Ｃ)少／新鮮的。倨傲鮮腆：傲慢無禮不謙虛。腆，音ㄊㄧㄢˇ。(Ｄ)更加。\", \"pt\": 1}, {\"s\": 1, \"n\": \"14\", \"p\": \"\u003cp>「\u003cu>洛陽\u003c/u>之俗，大抵好牡丹，春時城中無分貴賤皆插花，雖負擔者亦然。花開時，士庶競為遊遨，至花落乃罷。\u003cu>洛陽\u003c/u>至\u003cu>東京\u003c/u>六驛，舊不進花，自今歲遣衙校一員，乘驛馬，一日一夕至京師。所進不過姚黃魏紫三數朵。以菜葉實竹籠子，藉覆之使馬上不動搖，以蠟封蒂，乃數日不落。」根據這段文字，下列關於牡丹的敘述何者最恰當？（註：①藉：鋪墊。）〔110.會考〕\u003c/p>\", \"o\": [\"姚黃魏紫指的皆是牡丹\", \"\u003cu>洛陽\u003c/u>權貴才有資格買牡丹\", \"牡丹運送前須以蠟整株封存\", \"牡丹運送時以菜葉提供其養分\"], \"a\": 0, \"e\": \"由「舊不進花」與「所進不過姚黃魏紫三數朵」可知「姚黃魏紫」指的是本文所敘述的主角「牡丹花」，故選(Ａ)。(Ｂ)從「春時城中無分貴賤皆插花，雖負擔者亦然」一句可知\u003cu>洛陽城\u003c/u>中無論貴賤皆購買牡丹(Ｃ)從「以蠟封蒂」可知只有用蠟將「蒂頭」封住(Ｄ)從「以菜葉實竹籠子，藉覆之使馬上不動搖」可知菜葉的主要作用是鋪墊填充，保護牡丹花瓣，讓它不受碰撞。題幹出自\u003cu>歐陽脩\u003c/u>　洛陽牡丹記　風俗記第三。題幹譯：\u003cu>洛陽\u003c/u>人的習俗，大多喜歡牡丹，春天時城中不論地位高低的人都喜歡插上牡丹花，就算是扛著擔子的勞動者也是如此。牡丹盛開時，士大夫與平民爭相遊覽賞花，直到牡丹謝了才停止。從\u003cu>洛陽\u003c/u>到\u003cu>開封\u003c/u>有六個驛站，從前沒有進貢牡丹，從今年開始派遣一名衙校，騎乘驛馬，一天一夜趕送到京城。所進貢的不過只有姚黃、魏紫等著名的牡丹品種寥寥數朵。將菜葉鋪墊在竹籠子中，用來保護牡丹花瓣，讓它不受碰撞，並用蠟封存牡丹蒂頭，於是可以數日不凋謝。\", \"pt\": 1}, {\"s\": 1, \"n\": \"15\", \"p\": \"\u003cp>下列稱號與人物的配對，何者「錯誤」？\u003c/p>\", \"o\": [\"\u003cu>蘇轍\u003c/u>：\u003cu>東坡居士\u003c/u>\", \"\u003cu>周敦頤\u003c/u>：\u003cu>濂溪先生\u003c/u>\", \"\u003cu>王冕\u003c/u>：\u003cu>梅花屋主\u003c/u>\", \"\u003cu>李白\u003c/u>：\u003cu>青蓮居士\u003c/u>\"], \"a\": 0, \"e\": \"(Ａ)\u003cu>蘇軾\u003c/u>。\", \"pt\": 1}, {\"s\": 1, \"n\": \"16\", \"p\": \"\u003cp>下列文句「　」中的字，何組詞性兩兩相同？\u003c/p>\", \"o\": [\"牡丹「之」愛／唯命「是」從\", \"父母唯其疾「之」憂／可愛「者」甚蕃\", \"「噫」！菊之愛／宜乎眾「矣」\", \"亭亭淨「植」／中通外「直」\"], \"a\": 0, \"e\": \"(Ａ)表賓語提前的助詞(Ｂ)助詞／代詞(Ｃ)嘆詞／語末助詞(Ｄ)動詞／形容詞。\", \"pt\": 1}, {\"s\": 1, \"n\": \"17\", \"p\": \"\u003cp>蓮花池與思春的關係，\u003cu>李商隱\u003c/u>這首寫得非常明顯：\u003c/p>\\n\u003cp>\u003cimg style=\\\"max-width:420px\\\" src=\\\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAikAAAEICAAAAAC/4DvMAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAACYktHRAD/h4/MvwAAAAd0SU1FB+oLDwkSHUCblIYAAAAQY2FOdgAABkgAAAjaAAACDwAAA+cEX7dNAABy5UlEQVR42u29dWAUu/f//do6pS20SNELFHcp7u7u7u7u7u7uLsWhaHGX4i4tWqBQodQ1zx8z67vtFu79fu79Pfv+ZzNJJpPNnElOTo4oBGaYYQIs/tcdMOM/AjOlmGEazJRihmkwU4oZpsFMKWaYBjOlmGEazJRihmkwU4oZpsFMKWaYBit18uvZN7X+190x41+Eny8D52rMJEKFLv/rnpnxr0Oomjw05pTyx+Pe/697Zsa/CIdGRzqorzQoxTLI1vl/3Tkz/kVIFaTJxZo5WjNMg5lSzDANZkoxwzSYKcUM0/B/QClR0b9549+kjve7j08S4fGaV/4JxmsGPvz93gcYKwmLS25bsX/yb41SyqSn0q/263qrSo1/kXi5Gvvs0o4xsTdagx1YcEPy/1qMftZiu5xLf2tsWmerrSE26JC79jvt8jG2BW+rrwrYNtKkyVfH7qnfscPoIpf02z9SsP9e1dseOnKZn6FOnM5QfmaQwe6Ns8l9Ry/zQaTx/xNQeMlvjYMEo5RSwn07ABcaXVZnehUcr6SMoiX2AnCq6TV1+YkCUw1NBAXm6eddXh6ml+db+ILG1aYXfdvFw5cvmlXOHEz07zzIbeCNRBcf+ltjE/exVXb1VdTb5jl0KsQ3KUPAM1X1mbbw9qN8da1JE 陽無限好，只是近「黃昏」\"], \"a\": 1, \"e\": \"(Ａ)「材大」既指古柏，又兼指材大之人，詞義雙關(Ｂ)「蓮子」即憐子，諧音雙關(Ｃ)「不成匹」一方面指未織成一匹完整的布，另一方面指「無法匹配」，詞義雙關(Ｄ)字面上是指實際的時間，兼指作者內心遲暮的感受，詞義雙關。\", \"pt\": 1}, {\"s\": 1, \"n\": \"18\", \"p\": \"\u003cp>\u003cu>周敦頤\u003c/u>寫〈愛蓮說〉一文的主要用意為何？\u003c/p>\", \"o\": [\"諷刺當時社會腐敗\", \"抒發個人心志\", \"上諫為政者施行仁政\", \"說明物我合一的理想境界\"], \"a\": 1, \"e\": \"(Ｂ)由「蓮之愛，同予者何人」可知。\", \"pt\": 1}, {\"s\": 1, \"n\": \"19\", \"p\": \"\u003cp>下列「　」中的注音寫成國字後，何組字形兩兩相同？\u003c/p>\", \"o\": [\"「ㄧㄠ」言惑眾／逃之「ㄧㄠ ㄧㄠ」\", \"「ㄩˊ」獨愛蓮／鳳凰「ㄩˊ」飛\", \"一勞永「ㄧˋ」／豪放飄「ㄧˋ」\", \"「ㄕㄥˋ」氣凌人／引人入「ㄕㄥˋ」\"], \"a\": 2, \"e\": \"(Ａ)妖／夭(Ｂ)予／于(Ｃ)逸(Ｄ)盛／勝。\", \"pt\": 1}, {\"s\": 1, \"n\": \"20\", \"p\": \"\u003cp>「蓮之愛」的「之」字，和下列何者意思相同？\u003c/p>\", \"o\": [\"水陸草木「之」花\", \"不可褻玩「焉」\", \"主義「是」從\", \"花「之」隱逸者也\"], \"a\": 2, \"e\": \"題幹與(Ｃ)助詞，表賓語提前，無義。(Ａ)(Ｄ)助詞，的(Ｂ)句末助詞，無義。\", \"pt\": 1}, {\"s\": 1, \"n\": \"21\", \"p\": \"\u003cp>下列選項「　」中的字，何組讀音「不同」？\u003c/p>\", \"o\": [\"\u003cu>陶\u003c/u>後「鮮」有聞／「鮮」為人知\", \"「比」行千里／櫛次鱗「比」\", \"「予」謂／「予」取予求\", \"「著」書立說／棋高一「著」\"], \"a\": 3, \"e\": \"(Ａ)ㄒㄧㄢˇ(Ｂ)ㄅㄧˋ(Ｃ)ㄩˊ(Ｄ)ㄓㄨˋ／ㄓㄨㄛˊ。\", \"pt\": 1}, {\"s\": 2, \"n\": \"1(1)\", \"g\": \"t1\", \"p\": \"\u003cp>就本詩的意境與內容來看，這是一首什麼性質的詩？\u003c/p>\", \"o\": [\"邊塞懷鄉\", \"社會寫實\", \"田園山水\", \"浪漫飄逸\"], \"a\": 1, \"e\": \"(Ｂ)由「一叢深色花，十戶中人賦。」可知本詩藉買花這件事，抒發當時社會上嚴重的貧富差距。\", \"pt\": 1}, {\"s\": 2, \"n\": \"1(2)\", \"g\": \"t1\", \"p\": \"\u003cp>詩中道盡\u003cu>唐\u003c/u>人照顧牡丹不遺餘力，以下何句\u003cu class=\\\"dbl\\\">並不\u003c/u>屬之？\u003c/p>\", \"o\": [\"水灑復泥封\", \"上張幄幕庇\", \"家家習為俗\", \"旁織笆籬護\"], \"a\": 2, \"e\": \"(Ａ)表達對牡丹的細心照顧，不僅花根旁灑水又用泥土封住。(Ｂ)描述在牡丹花上都設有帳幕遮護。(Ｃ)僅表示家家戶戶習以為常這樣的景象。(Ｄ)描述牡丹花旁邊都設有籬笆圍繞保護。\", \"pt\": 1}, {\"s\": 2, \"n\": \"2(1)\", \"g\": \"t2\", \"p\": \"\u003cp>故事中的溺水者「兩搖其首」，他所表現出的行為，可用下列何者來加以形容？\u003c/p>\", \"o\": [\"對同伴的不信任\", \"溺水時的慌亂無措\", \"嗜財如命的頑固態度\", \"貪生怕死的膽小模樣\"], \"a\": 2, \"e\": \"由溺水者明知錢財拖累自己，仍搖頭不願拋棄，最終溺死，可見其嗜財如命、執迷不悟，故選(Ｃ)。\", \"pt\": 1}, {\"s\": 2, \"n\": \"2(2)\", \"g\": \"t2\", \"p\": \"\u003cp>下列哪一個成語「不適合」用來形容這名溺水者？\u003c/p>\", \"o\": [\"擇善固執\", \"本末倒置\", \"財迷心竅\", \"人為財死，鳥為食亡\"], \"a\": 0, \"e\": \"(Ａ)指選擇好的、正確的事去做，且堅持不變。\", \"pt\": 1}, {\"s\": 2, \"n\": \"2(3)\", \"g\": \"t2\", \"p\": \"\u003cp>這篇故事的主旨在啟示我們什麼道理？\u003c/p>\", \"o\": [\"世人常只顧眼前利益，而犧牲更寶貴的事物\", \"危險來臨時，只能靠自己，不能靠別人\", \"溺水者臨危不亂的精神值得敬佩\", \"不要以為會游泳就不會被水淹死\"], \"a\": 0, \"e\": \"(Ａ)全文以寓言筆法，藉由「捨不得財物導致喪命」的情節，啟示我們應有正確的價值觀與取捨的智慧，而不被物欲蒙蔽。\", \"pt\": 1}, {\"s\": 2, \"n\": \"3(1)\", \"g\": \"t3\", \"p\": \"\u003cp>根據本文，下列句意說明何者正確？\u003c/p>\", \"o\": [\"亦寄酒為跡者也——有酒之處必有\u003cu>陶淵明\u003c/u>蹤跡\", \"抑揚爽朗，莫之與京——文章起伏跌宕、清朗通達，無人能及\", \"干青雲而直上——志向遠大，在仕途上也曾飛黃騰達\", \"尚想其德，恨不同時——感嘆自己德行高潔卻生不逢時\"], \"a\": 1, \"e\": \"(Ａ)是指把自己的情意寄託在酒中(Ｃ)形容文章氣勢磅礴，直上雲霄(Ｄ)指非常仰慕他的美德，很遺憾無法和他活在同一個時代。\", \"pt\": 1}, {\"s\": 2, \"n\": \"3(2)\", \"g\": \"t3\", \"p\": \"\u003cp>根據本文，\u003cu class=\\\"dbl\\\">無法\u003c/u>得知下列何者？\u003c/p>\", \"o\": [\"\u003cu>陶淵明\u003c/u>詩多以酒為寫作題材\", \"\u003cu>陶淵明\u003c/u>詩文在當時獨樹一格\", \"作者對\u003cu>陶淵明\u003c/u>極為欣賞崇敬\", \"後世文壇深受\u003cu>陶淵明\u003c/u>的影響\"], \"a\": 3, \"e\": \"(Ａ)由「有疑\u003cu>陶淵明\u003c/u>詩篇篇有酒」可知(Ｂ)由「其文章不群……莫之與京」可知(Ｃ)由「余愛嗜其文……恨不同時」可知(Ｄ)文中闡述\u003cu>陶淵明\u003c/u>的創作特色與美德，並說明作者對其崇仰之情，而未提及後世文壇是否深受\u003cu>陶淵明\u003c/u>的影響。\", \"pt\": 1}, {\"s\": 2, \"n\": \"4(1)\", \"g\": \"t4\", \"p\": \"\u003cp>人生的悲喜全在一念之間，而這「一念之間」則寄託在何處？\u003c/p>\", \"o\": [\"萬物靜觀皆自得\", \"人情練達即文章\", \"石火光中寄此身\", \"半是雞聲半馬蹄\"], \"a\": 0, \"e\": \"末段說要「以無沾不染之心，鉅細靡遺的眼，真正去領略」，也就是靜心觀察萬物，自然能有所得，與「萬物靜觀皆自得」相同。\", \"pt\": 1}, {\"s\": 2, \"n\": \"4(2)\", \"g\": \"t4\", \"p\": \"\u003cp>(甲)敗興(乙)興起(丙)見荷(丁)領略。關於文中作者賞荷的心理過程為何？\u003c/p>\", \"o\": [\"甲乙丙丁\", \"乙丙甲丁\", \"丙乙甲丁\", \"甲丙乙丁\"], \"a\": 1, \"e\": \"作者先因想念荷池而(乙)興起賞荷念頭，到植物園(丙)見荷，看到荷葉擁擠、花謝無香而(甲)敗興，最後因小女兒的興奮而重新(丁)領略美景。\", \"pt\": 1}, {\"s\": 2, \"n\": \"4(3)\", \"g\": \"t4\", \"p\": \"\u003cp>關於本文的結構，下列哪一項分析\u003cu class=\\\"dbl\\\">不妥當\u003c/u>？\u003c/p>\", \"o\": [\"次段敘述興起念頭到植物園賞荷\", \"末段導出結論—是悲是喜全在一念之間\", \"第三段以小女兒做一轉折，心境由歡愉轉為敗興\", \"首段言賞荷宜晨、宜夜，亦宜夕陽中，以此帶入主題\"], \"a\": 2, \"e\": \"(Ｃ)第三段以小女兒做轉折，心境是由敗興轉為歡愉，一掃原本的陰霾，不是由歡愉轉為敗興。\", \"pt\": 1}, {\"s\": 2, \"n\": \"5(1)\", \"g\": \"t5\", \"p\": \"\u003cp>根據本文，下列句意說明何者正確？\u003c/p>\", \"o\": [\"亦寄酒為跡者也——有酒之處必有\u003cu>陶淵明\u003c/u>蹤跡\", \"抑揚爽朗，莫之與京——文章起伏跌宕、清朗通達，無人能及\", \"干青雲而直上——志向遠大，在仕途上也曾飛黃騰達\", \"尚想其德，恨不同時——感嘆自己德行高潔卻生不逢時\"], \"a\": 1, \"e\": \"(Ａ)把自己的情意寄託在酒中(Ｃ)文章的意境氣勢磅礡，直上雲霄(Ｄ)非常仰慕他的美德，很遺憾無法和他活在同一個時代。\", \"pt\": 1}, {\"s\": 2, \"n\": \"5(2)\", \"g\": \"t5\", \"p\": \"\u003cp>根據本文，無法得知下列何者？\u003c/p>\", \"o\": [\"\u003cu>陶淵明\u003c/u>詩多以酒為寫作題材\", \"\u003cu>陶淵明\u003c/u>詩文在當時獨樹一格\", \"作者對\u003cu>陶淵明\u003c/u>極為欣賞崇敬\", \"後世文壇深受\u003cu>陶淵明\u003c/u>的影響\"], \"a\": 3, \"e\": \"(Ｄ)文中闡述\u003cu>陶淵明\u003c/u>的創作特色與美德，並說明作者對其崇仰之情，而未提及後世文壇是否深受\u003cu>陶淵明\u003c/u>的影響。(Ａ)由「\u003cu>陶淵明\u003c/u>詩篇篇有酒」可知(Ｂ)由「其文章不群……莫之與京」可知(Ｃ)由「余愛嗜其文……恨不同時」可知。\", \"pt\": 1}, {\"s\": 2, \"n\": \"6(1)\", \"g\": \"t6\", \"p\": \"\u003cp>首段作者所說的「卻別有所感」，指的是？\u003c/p>\", \"o\": [\"群生荷壯觀的綠浪，令單株望塵莫及\", \"群生荷抗風的能力，非單株所可比擬\", \"荷雖予人正直形象，卻有搖擺的一面\", \"荷之單株與群生皆有可觀，各擅勝場\"], \"a\": 1, \"e\": \"從文章最後一段「群生荷其抗禦疾風之力，非單株所能有者，若離群而立，倖存者幾許呢？」可知應選(Ｂ)。\", \"pt\": 1}, {\"s\": 2, \"n\": \"6(2)\", \"g\": \"t6\", \"p\": \"\u003cp>下列何者\u003cu class=\\\"dbl\\\">不是\u003c/u>文中荷遇疾風時的表現？\u003c/p>\", \"o\": [\"一柄柄蓮莖上的碧葉被捲成滾滾綠浪\", \"荷葉上承托著大大小小的、滾動著的晶瑩水珠\", \"忽而由東向西搖擺，忽而又由西向東搖擺\", \"互不撞擊，互不擠軋，更不彼此躲藏，層次分明，順乎自然\"], \"a\": 1, \"e\": \"(Ｂ)「每張荷葉上都承托著大大小小的、滾動著的晶瑩水珠」為靜態描寫，並非是遇疾風時的姿態。\", \"pt\": 1}, {\"s\": 2, \"n\": \"6(3)\", \"g\": \"t6\", \"p\": \"\u003cp>根據本文，下列敘述何者正確？\u003c/p>\", \"o\": [\"作者因閱讀〈愛蓮說〉一文，特於荷花生日當天前往賞荷\", \"群生荷能如此雄勁抵禦疾風，得力於中通外直的蓮莖\", \"文中「承露盤」與「紅若塗朱」指的是相同之物\", \"文中的蓮橋位於東門以北，\u003cu>荷花渡\u003c/u>以南\"], \"a\": 3, \"e\": \"(Ｄ)「從東門進園，北行數百步」、「過蓮橋，行至荷花渡南岸」可知蓮橋位於東門以北，荷花渡以南。\", \"pt\": 1}];\n\n\nconst L = [\"A\",\"B\",\"C\",\"D\"];\nconst KEY = \"chi4-paper\";\nconst TOTAL = Q.reduce((s,q)=>s+q.pt,0);\nconst fmt = x => Math.round(x*10)/10;\nconst isMulti = q => Array.isArray(q.a);\nconst sameSet = (x,y) => Array.isArray(x) && x.length===y.length && x.every((v,k)=>v===y[k]);\nconst correct = i => Q[i].open ? state.ans[i]===\"ok\" : isMulti(Q[i]) ? sameSet(state.ans[i],Q[i].a) : state.ans[i]===Q[i].a;\nconst keyText = q => isMulti(q) ? q.a.map(k=>\"（\"+L[k]+\"）\").join(\"\") : \"（\"+L[q.a]+\"）\";\nconst $ = id => document.getElementById(id);\nconst esc = s => s.replace(/[&\u003c>\"]/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst tag = q => q.tg || (!SECS[q.s].group ? q.n : q.n.replace(/\\((\\d)\\)/,\"-$1\"));\n\nlet state = {mode:\"practice\", ans:{}, submitted:false, onlyWrong:false, focus:null};\ntry{ const s = JSON.parse(localStorage.getItem(KEY)||\"null\"); if(s && s.ans) state = Object.assign(state,s); }catch(e){}\nconst save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };\n\nconst graded = ()=> state.mode===\"practice\" || state.submitted;\nconst isWrong = i => graded() && (i in state.ans) && !correct(i);\n\nfunction bodyHTML(i){\n  const q = Q[i];\n  if(!q.open){\n    const imgs = q.o.every(t=>t.includes(\"\u003cimg\"));\n    const multi = isMulti(q) ? `\u003cdiv class=\"multibar ui\">\u003cspan class=\"hint\">可複選，選好後按「送出答案」\u003c/span>\u003cbutton class=\"tbtn send\" data-send=\"${i}\">送出答案\u003c/button>\u003c/div>` : \"\";\n    return `\u003cdiv class=\"opts${imgs?\" imgopts\":\"\"}\">${optsHTML(i)}\u003c/div>${multi}`;\n  }\n  return `${q.pre||\"\"}\u003ctextarea class=\"ans ui\" data-q=\"${i}\" rows=\"3\" placeholder=\"先寫下你的答案…\">\u003c/textarea>\n    \u003cdiv class=\"openbar ui\">\u003cbutton class=\"tbtn reveal\" data-rv=\"${i}\">看參考答案\u003c/button>\u003cspan class=\"hint\" id=\"hint${i}\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"ref ui hide\" id=\"ref${i}\">\u003cdiv>\u003cstrong>參考答案：\u003c/strong>${esc(q.r)}\u003c/div>\n      \u003cdiv class=\"selfrow\">對照後自評：\u003cbutton class=\"tbtn self\" data-self=\"${i}\" data-v=\"ok\">我答對了\u003c/button>\u003cbutton class=\"tbtn self\" data-self=\"${i}\" data-v=\"no\">我答錯了\u003c/button>\u003c/div>\u003c/div>`;\n}\nfunction optsHTML(i){\n  return Q[i].o.map((t,oi)=>`\u003cbutton class=\"opt\" data-q=\"${i}\" data-o=\"${oi}\">\u003cspan class=\"k\">（${L[oi]}）\u003c/span>\u003cspan class=\"ot\">${t}\u003c/span>\u003c/button>`).join(\"\");\n}\nfunction build(){\n  $(\"secs\").innerHTML = SECS.map((s,k)=>`\u003cdiv class=\"sec\">\u003ch2>${s.name}\u003c/h2>\u003cspan class=\"ui\">${s.note}\u003c/span>\u003c/div>\u003cdiv id=\"sec${k}\">\u003c/div>`).join(\"\");\n  $(\"gridwrap\").innerHTML = SECS.map((s,k)=>`\u003ch3>${s.name}\u003c/h3>\u003cdiv class=\"grid\" id=\"grid${k}\">\u003c/div>`).join(\"\");\n  SECS.forEach((sec,k)=>{\n  if(!sec.group){\n  $(\"sec\"+k).innerHTML = Q.map((q,i)=>q.s!==k?\"\":`\n    \u003csection class=\"card item\" id=\"q${i}\" data-items=\"${i}\">\n      \u003cdiv class=\"no\">${q.n}.\u003c/div>\n      \u003cdiv>${q.g?`\u003cdiv class=\"mat\">${G[q.g].html}\u003c/div>`:\"\"}\n        \u003cdiv class=\"prompt\">${q.p}\u003c/div>${bodyHTML(i)}\u003cdiv class=\"fb hide\" id=\"fb${i}\">\u003c/div>\u003c/div>\n    \u003c/section>`).join(\"\");\n  return; }\n  const order = [];\n  Q.forEach((q,i)=>{ if(q.s===k && !order.includes(q.g)) order.push(q.g); });\n  $(\"sec\"+k).innerHTML = order.map(g=>{\n    const ids = Q.map((q,i)=>q.g===g?i:-1).filter(i=>i>=0);\n    return `\u003csection class=\"card\" id=\"grp-${g}\" data-items=\"${ids.join(\",\")}\">\n      \u003cp class=\"ghead\">${G[g].label.replace(\"題組 \",\"\").replace(/^(\\d+)/,\"$1.\")}\u003c/p>\n      \u003cdiv class=\"mat\">${G[g].html}\u003c/div>\n      ${ids.map(i=>{const m=Q[i].m||Q[i].n.match(/\\((\\d)\\)/)[1];\n        return `\u003cdiv class=\"sub\" id=\"q${i}\">\u003cdiv class=\"prompt\">${/^\u003cp>/.test(Q[i].p) ? Q[i].p.replace(/^\u003cp>/,\"\u003cp>（\"+m+\"）\") : \"\u003cp>（\"+m+\"）\u003c/p>\"+Q[i].p}\u003c/div>${bodyHTML(i)}\u003cdiv class=\"fb hide\" id=\"fb${i}\">\u003c/div>\u003c/div>`}).join(\"\")}\n    \u003c/section>`;\n  }).join(\"\");\n  });\n  SECS.forEach((s,k)=>{\n    $(\"grid\"+k).innerHTML = Q.map((q,i)=>q.s===k?`\u003cbutton class=\"num\" data-go=\"${i}\">${tag(q)}\u003c/button>`:\"\").join(\"\");\n  });\n  $(\"stTotal\").textContent = Q.length;\n  document.querySelectorAll(\".opt\").forEach(b=>b.onclick=()=>pick(+b.dataset.q,+b.dataset.o));\n  document.querySelectorAll(\".send\").forEach(b=>b.onclick=()=>sendMulti(+b.dataset.send));\n  document.querySelectorAll(\".num\").forEach(b=>b.onclick=()=>jump(+b.dataset.go));\n  document.querySelectorAll(\".ans\").forEach(ta=>{ ta.value = (state.txt||{})[ta.dataset.q]||\"\"; ta.oninput=()=>{ state.txt=state.txt||{}; state.txt[ta.dataset.q]=ta.value; save(); }; });\n  document.querySelectorAll(\".reveal\").forEach(b=>b.onclick=()=>{ if(!graded()) return; state.rev=state.rev||{}; state.rev[b.dataset.rv]=1; save(); paintQ(+b.dataset.rv); });\n  document.querySelectorAll(\".self\").forEach(b=>b.onclick=()=>selfGrade(+b.dataset.self, b.dataset.v));\n  $(\"ttl\").textContent = TITLE; $(\"stMax\").textContent = fmt(TOTAL);\n\n}\n\nfunction selfGrade(i,v){\n  if(!graded() || (i in state.ans)) return;\n  state.ans[i]=v; save(); paintQ(i); paintStats(); paintResult();\n}\nfunction sendMulti(i){\n  const s = (state.sel||{})[i] || [];\n  if(!s.length || (i in state.ans) || !graded()) return;\n  state.ans[i] = s.slice().sort(); save(); paintQ(i); paintStats();\n  nextAfter(i);\n}\nfunction pick(i,o){\n  if(state.mode===\"practice\" && (i in state.ans)) return;\n  if(state.mode===\"test\" && state.submitted) return;\n  if(isMulti(Q[i])){\n    state.sel = state.sel||{}; const s = new Set(state.sel[i]||[]);\n    s.has(o) ? s.delete(o) : s.add(o);\n    state.sel[i] = [...s].sort();\n    if(state.mode===\"test\"){ if(state.sel[i].length) state.ans[i]=state.sel[i]; else delete state.ans[i]; }\n    save(); paintQ(i); paintStats(); return;\n  }\n  state.ans[i]=o; save();\n  paintQ(i); paintStats();\n  if(state.mode===\"practice\") nextAfter(i);\n}\n// practice: slide to the next unanswered question after showing feedback\nfunction nextAfter(i){\n  const nxt = Q.findIndex((q,j)=>j>i && !(j in state.ans) && w,30px);margin:0;line-height:1.3;letter-spacing:1px}\n.stats{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--muted);font-size:15px}\n.stats b{color:var(--ink);font-size:18px}\n.stats .g b{color:var(--ok)} .stats .r b{color:var(--bad)}\n.row2{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 8px}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}\n.seg button,.tbtn{font:inherit;font-size:15px;padding:8px 14px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--navy);color:var(--navy-ink);font-weight:700}\n.tbtn{border:1px solid var(--line);border-radius:10px}\n.tbtn[aria-pressed=\"true\"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}\n.tbtn:disabled{color:var(--muted);opacity:.55;cursor:default}\n.tbtn.submit{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}\nbutton:focus-visible{outline:3px solid var(--navy);outline-offset:2px}\ndetails.map{border:1px solid var(--line);border-radius:8px}\ndetails.map summary{cursor:pointer;padding:4px 10px;font-size:15px;color:var(--muted)}\n.grid-wrap{max-height:min(38vh,280px);overflow:auto;padding:0 10px 10px}\n.grid-wrap h3{font-size:13px;font-weight:500;color:var(--muted);margin:8px 0 6px}\n.grid{display:flex;flex-wrap:wrap;gap:6px}\n.num{font:inherit;font-size:14px;min-width:44px;height:36px;padding:0 6px;border-radius:7px;border:1px solid transparent;background:var(--chip);color:var(--ink);cursor:pointer}\n.num.done{background:var(--pick);border-color:var(--navy)}\n.num.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}\n.num.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700}\n\n/* paper */\nmain{max-width:900px;margin:0 auto;padding:22px 18px 80px}\n.sec{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);margin:26px 0 14px;padding-bottom:4px}\n.sec h2{font-size:20px;font-weight:900;margin:0}\n.sec span{font-size:13px;color:var(--muted)}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:0 0 14px;scroll-margin-top:var(--topH,160px)}\n.item{display:grid;grid-template-columns:44px 1fr;gap:0 8px}\n.item>.no{font-weight:900;font-size:18px;color:var(--muted)}\n.mat p{margin:0 0 10px}\n.mat .src{font-weight:600}\n.mat figure{margin:12px 0;text-align:center}\n.mat figure img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}\n.mat figcaption{font-size:13px;color:var(--muted)}\n.mat .tag{display:none}\n.ghead{font-weight:900;font-size:18px;margin:0 0 6px}\n.sub{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;scroll-margin-top:var(--topH,160px)}\n.prompt{margin:0 0 10px}\n.opts{display:grid;gap:8px}\n.opt{display:flex;gap:6px;text-align:left;width:100%;font:inherit;line-height:1.6;color:var(--ink);background:var(--surface);\n  border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}\n.opt .k{flex:none;color:var(--muted)}\n.opt:hover:not(:disabled){border-color:var(--navy)}\n.opt:disabled{cursor:default}\n.opt.pick{background:var(--pick);border-color:var(--navy)}\n.opt.right{background:var(--ok-bg);border-color:var(--ok)}\n.opt.right .k{color:var(--ok);font-weight:700}\n.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}\n.opt.wrong .k{color:var(--bad);font-weight:700}\n.fb{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:15px;line-height:1.75}\n.fb.ok{background:var(--ok-bg)} .fb.no{background:var(--bad-bg)}\n.fb strong{margin-right:6px} .fb.ok strong{color:var(--ok)} .fb.no strong{color:var(--bad)}\n.hide{display:none!important}\n.prompt p{margin:0 0 8px} .prompt img,.mat img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;display:block;margin:8px auto}\n.mat p:has(> img:only-child){text-align:center}\nu.wavy{text-decoration:underline wavy;text-underline-offset:3px;text-decoration-thickness:1px}\nu.dbl{text-decoration:underline double;text-underline-offset:3px}\n.opt .ot img{max-height:200px;max-width:100%;height:auto;display:block;background:#fff}\n.imgopts{grid-template-columns:repeat(2,minmax(0,1fr))}\n.imgopts .opt{flex-direction:column;align-items:flex-start}\n.opt.miss{border-color:var(--ok);border-style:dashed}\n.opt.miss .k{color:var(--ok);font-weight:700}\n.multibar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}\n.multibar .hint{font-size:13px;color:var(--muted)}\n.tbl{border-collapse:collapse;margin:8px 0 12px;font-size:15px;width:100%}\n.tbl th,.tbl td{border:1px solid var(--ink);padding:4px 10px;text-align:center}\n.tbl th{font-weight:600;background:var(--chip)}\ntextarea.ans{width:100%;font-size:16px;line-height:1.6;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}\ntextarea.ans:focus{outline:2px solid var(--navy);border-color:var(--navy)}\n.openbar{display:flex;align-items:center;gap:10px;margin-top:8px}\n.openbar .hint{font-size:13px;color:var(--muted)}\n.ref{margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--pick);font-size:15px;line-height:1.75}\n.selfrow{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n.self[aria-pressed=\"true\"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}\n.endbar{text-align:center;margin:24px 0}\n.endbar .tbtn{font-size:17px;padding:12px 26px}\n.empty{text-align:center;color:var(--muted);padding:30px 0}\n.result{background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:18px 22px;margin:0 0 14px;text-align:center}\n.result b{font-size:28px}\n@media (max-width:560px){\n  .card{padding:16px 14px}.item{grid-template-columns:32px 1fr}\n  .top{padding-left:12px;padding-right:12px}.seg button,.tbtn{padding:7px 10px;font-size:14px}\n  .stats{font-size:13px}.stats b{font-size:16px}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"top ui\" id=\"top\">\n \u003cdiv class=\"top-in\">\n  \u003cdiv class=\"row1\">\n    \u003ch1 id=\"ttl\">\u003c/h1>\n    \u003cdiv class=\"stats\">\n      \u003cspan>已作答 \u003cb id=\"stDone\">0\u003c/b> / \u003cspan id=\"stTotal\">\u003c/span>\u003c/span>\n      \u003cspan>得分 \u003cb id=\"stScore\">0\u003c/b> / \u003cspan id=\"stMax\">\u003c/span>\u003c/span>\n      \u003cspan class=\"g\">答對 \u003cb id=\"stOk\">0\u003c/b>\u003c/span>\n      \u003cspan class=\"r\">答錯 \u003cb id=\"stNo\">0\u003c/b>\u003c/span>\n      \u003cspan>答對率 \u003cb id=\"stRate\">–\u003c/b>\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"row2\">\n    \u003cdiv class=\"seg\" role=\"group\" aria-label=\"作答模式\">\n      \u003cbutton id=\"mPractice\" aria-pressed=\"true\">練習：選了就對答案\u003c/button>\n      \u003cbutton id=\"mTest\" aria-pressed=\"false\">測驗：交卷再對答案\u003c/button>\n    \u003c/div>\n    \u003cbutton class=\"tbtn\" id=\"onlyWrong\" aria-pressed=\"false\">只看錯題\u003c/button>\n    \u003cbutton class=\"tbtn\" id=\"redoWrong\" disabled>重練錯題\u003c/button>\n    \u003cbutton class=\"tbtn hide\" id=\"showAll\" aria-pressed=\"true\">重練中・顯示全部\u003c/button>\n    \u003cbutton class=\"tbtn\" id=\"reset\">重新作答\u003c/button>\n    \u003cbutton class=\"tbtn submit hide\" id=\"submitTop\">交卷\u003c/button>\n  \u003c/div>\n  \u003cdetails class=\"map\" id=\"map\" open>\n    \u003csummary>題號一覽（點題號可跳轉）\u003c/summary>\n    \u003cdiv class=\"grid-wrap\" id=\"gridwrap\">\u003c/div>\n  \u003c/details>\n \u003c/div>\n\u003c/div>\n\n\u003cmain id=\"paper\">\n  \u003cdiv class=\"result ui hide\" id=\"result\">\u003c/div>\n  \u003cdiv id=\"secs\">\u003c/div>\n  \u003cp class=\"empty ui hide\" id=\"empty\">目前沒有錯題 👍\u003c/p>\n  \u003cdiv class=\"endbar ui hide\" id=\"endbar\">\u003cbutton class=\"tbtn submit\" id=\"submitEnd\">交卷\u003c/button>\u003c/div>\n\u003c/main>\n\n\u003cscript>\nconst TITLE = \"國文第五課 生命中的碎珠　試卷・互動練習\";\nconst SECS = [{\"name\": \"單一選擇題\", \"note\": \"每題 4 分，共 100 分\", \"group\": false}];\nconst G = {};\nconst Q = [{\"s\": 0, \"n\": \"1\", \"p\": \"\u003cp>關於\u003cu class=\\\"wavy\\\">生命中的碎珠\u003c/u>的主旨，可用下列哪個詞語來形容？\u003c/p>\", \"o\": [\"寸陰尺璧\", \"錙銖必較\", \"時不我與\", \"時過境遷\"], \"a\": 0, \"e\": \"(Ａ)寸陰尺璧：亦作「尺璧寸陰」。(Ｂ)錙銖必較：斤斤計較。錙銖，音ㄗ　ㄓㄨ。(Ｃ)時不我與：比喻錯失時機，後悔莫及。(Ｄ)時過境遷：時間流走，境況也隨之改變。\", \"pt\": 4}, {\"s\": 0, \"n\": \"2\", \"p\": \"\u003cp>下列何者所說，與〈生命中的碎珠〉題旨所提到的最相符？\u003c/p>\", \"o\": [\"\u003cu>萍悅\u003c/u>：我在停等紅燈的時候，會使用手機瀏覽他人的限時動態\", \"\u003cu>飛朋\u003c/u>：我會安排計畫表，並且確實按表操課，確保進度是正確的\", \"\u003cu>纖研\u003c/u>：我會在搭乘捷運的通勤時間，背誦英文單字\", \"\u003cu>磐銘\u003c/u>：休息是為了走更長遠的路，因此每到假日我都會睡到日上三竿\"], \"a\": 2, \"e\": \"本課的題旨是，善用零碎的時間，並充實自己，故選(Ｃ)。(Ａ)看似運用時間，但不是在充實自己，同時這個行為是會被取締的(Ｂ)有計畫表很好，但不符合運用零碎時間(Ｄ)運用太多時間休息，不符合題旨。\", \"pt\": 4}, {\"s\": 0, \"n\": \"3\", \"p\": \"\u003cp>「沒有一樣事物，比現在的按鍵電話更能具體地說明這是一個分秒必爭的世界了。」本句句義，最接近以下何者？\u003c/p>\", \"o\": [\"沒有一樣事物不能證明，現在的按鍵電話說明了這是一個分秒必爭的世界\", \"現在的按鍵電話比起其他事物，更能具體說明這是一個分秒必爭的世界\", \"現在的按鍵電話並不能比其他事物更能說明這是一個分秒必爭的世界\", \"每樣事物都比現在的按鍵電話更能說明這是一個分秒必爭的世界\"], \"a\": 1, \"e\": \"題幹與(Ｂ)皆指按鍵電話最能說明這是一個分秒必爭的世界。(Ａ)是指要靠各種事物去證明按鍵電話說明世界分秒必爭，而非靠按鍵電話去證明世界分秒必爭。(Ｃ)和(Ｄ)的意思與題幹意思完全相反。\", \"pt\": 4}, {\"s\": 0, \"n\": \"4\", \"p\": \"\u003cp>「能不能掌握、利用它們，讓每天的生活更加充實，就全靠我們自己了。」可見把握時間用的是一種怎樣的態度？\u003c/p>\", \"o\": [\"人云亦云\", \"天助自助\", \"如人飲水\", \"操之在我\"], \"a\": 3, \"e\": \"全靠自己，也就是操控在自己手裡。故選(Ｄ)。\", \"pt\": 4}, {\"s\": 0, \"n\": \"5\", \"p\": \"\u003cp>在〈生命的碎珠〉一文中提到，\u003cu>甘迺迪\u003c/u>總統「常常在他接見的第一位客人起身離去，第二位客人尚未踏進會客室之前，也必拿起手邊的書籍閱讀」，其原因何者最適切？\u003c/p>\", \"o\": [\"對於接待的外賓的學識淺薄感到無奈，想藉機諷刺\", \"想利用所有可利用的時間來充實自己\", \"身為一國的領導人，想營造出良好的形象，以利自己的政治生涯\", \"想盡可能加強總統府上下的讀書風氣\"], \"a\": 1, \"e\": \"(Ｂ)甘迺迪利用接見兩位客人之間的空檔讀書，正是善用零碎時間充實自己。(Ａ)文中並沒有提到，也並非要諷刺外賓(Ｃ)文中並沒有提到，儘管有提升形象，但無法判斷與政治生涯的相關性(Ｄ)文中未提及。\", \"pt\": 4}, {\"s\": 0, \"n\": \"6\", \"p\": \"\u003cp>「勸君莫惜金縷衣，勸君惜取少年時。花開堪折直須折，莫待無花空折枝。」（\u003cu>杜秋娘\u003c/u>　\u003cu class=\\\"wavy\\\">金縷衣\u003c/u>）關於本詩的敘述，下列何者正確？\u003c/p>\", \"o\": [\"要愛惜青春的容顏\", \"嬌嫩的花朵比金縷衣更珍貴\", \"輕利重義才是君子的作為\", \"勸告年輕人要愛惜光陰\"], \"a\": 3, \"e\": \"題幹譯：勸你切莫只愛惜榮華富貴（以金縷衣比喻榮華富貴），勸你更應珍惜少年的時光。（少年時光）就似盛開的花朵，能摘折時就該摘折。不要等到花枯萎凋零，想再摘折時，卻只剩下空餘的枝枒了。詩意在勸年輕人珍惜光陰，故選(Ｄ)。\", \"pt\": 4}, {\"s\": 0, \"n\": \"7\", \"p\": \"\u003cp>\u003cu class=\\\"wavy\\\">生命中的碎珠\u003c/u>一文中，提到了一個放滿了大小石頭的箱子，最後還可以容納細沙，還可以注入不少清水。這個比喻意旨為何？\u003c/p>\", \"o\": [\"容量的大小，端看會不會收納物品\", \"我們可以利用許多零星、分散的時間\", \"水是最好的包容者\", \"體積越小越可以融入，身段越低越容易生存\"], \"a\": 1, \"e\": \"以還可以容納細沙的空隙比喻還能拿來利用的零碎時間，故選(Ｂ)。\", \"pt\": 4}, {\"s\": 0, \"n\": \"8\", \"p\": \"\u003cp>〈生命中的碎珠〉最後一段說：「那的確是一宗可觀的財富」，請以你對課文的了解，判斷下列哪句話與課文中的財富最相似？\u003c/p>\", \"o\": [\"千金難買早知道\", \"書中自有黃金屋\", \"時間就是金錢\", \"時間，是最老練的雕刻家\"], \"a\": 2, \"e\": \"(Ａ)強調知識的重要(Ｂ)古代勸人讀書，以為只要書讀得好，富貴利祿自然到來(Ｄ)說明歲月催人老的趕慨；只有(Ｃ)是說明時間是很珍貴，需要珍惜的。\", \"pt\": 4}, {\"s\": 0, \"n\": \"9\", \"p\": \"\u003cp>「明日復明日，明日何其多，我生待明日，萬事成蹉跎。」（\u003cu class=\\\"wavy\\\">明日歌\u003c/u>）關於本詩，下列何者敘述「錯誤」？\u003c/p>\", \"o\": [\"人之所以失敗往往因為因循怠惰\", \"韶光易逝，如果不好好把握常常會招致失敗\", \"不可預見的未來才是挑戰\", \"「明日何其多」正是許多人拖延的藉口\"], \"a\": 2, \"e\": \"題幹譯：明天之後還有明天，「明天」是那麼的多啊！如果一生甚麼事情都等待明天才去做，結果只會一事無成，虛度光陰。(Ｃ)詩意是勸人把握今天、不要拖延，並不是說「不可預見的未來才是挑戰」。\", \"pt\": 4}, {\"s\": 0, \"n\": \"10\", \"p\": \"\u003cp>「少年易老學難成，一寸光陰不可輕。未覺池塘春草夢，階前梧葉已秋聲。」（\u003cu>朱熹\u003c/u>　\u003cu class=\\\"wavy\\\">偶成\u003c/u>）請問下列何者與本詩意思相近？\u003c/p>\", \"o\": [\"水到渠成，自然成功\", \"及時當勉勵，歲月不待人\", \"博學多聞，力學不倦\", \"但願人長久，千里共嬋娟\"], \"a\": 1, \"e\": \"(Ｂ)由「少年易老學難成」可知。\", \"pt\": 4}, {\"s\": 0, \"n\": \"11\", \"p\": \"\u003cp>\u003cu>朱自清\u003c/u>　\u003cu class=\\\"wavy\\\">匆匆\u003c/u>：「洗手的時候，日子從水盆裡過去；吃飯的時候，日子從飯碗裡過去。當你覺察它去的匆匆了伸出手遮擋時，它又從遮擋的手指間過去。天黑時，你躺在床上，它便伶伶俐俐地從你身上跨過，從你腳邊飛走了。」這段文字主要是告訴我們什麼道理？\u003c/p>\", \"o\": [\"人常在生活中浪費掉時間\", \"時間是隨時隨地的在流逝著\", \"要用更有效的方式防止時間流失\", \"既然時間流逝無從阻止，就乾脆放棄\"], \"a\": 1, \"e\": \"題幹意指在生活中時間點滴流逝著，不論何時何地，從不曾停止，故選(Ｂ)。\", \"pt\": 4}, {\"s\": 0, \"n\": \"12\", \"p\": \"\u003cp>\u003cimg src=\\\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAdsAAAI5CAYAAADpHpAgAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAIdUAACHVAQSctJ0AAP+lSUR 喻。\", \"pt\": 4}, {\"s\": 0, \"n\": \"16\", \"p\": \"\u003cp>廣告必須引起觀眾注意，因此好的廣告要有創意，下列何者運用了「諧音」技巧？\u003c/p>\", \"o\": [\"分秒必蒸——快鍋\", \"及時行樂——鐘表行\", \"撥雲見日——\u003cu>日本\u003c/u>航空\", \"全家就是你家——便利商店\"], \"a\": 0, \"e\": \"(Ａ)「分秒必蒸」諧音「分秒必爭」，用來替快鍋做廣告。\", \"pt\": 4}, {\"s\": 0, \"n\": \"17\", \"p\": \"\u003cp>下列「　」中的字，何組讀音前後相同？\u003c/p>\", \"o\": [\"「從」容自如／天「從」人願\", \"「撇」開／「撇」嘴\", \"古「剎」／一「剎」那\", \"「盛」況空前／「盛」飯\"], \"a\": 2, \"e\": \"(Ａ)ㄘㄨㄥ／ㄘㄨㄥˊ(Ｂ)ㄆㄧㄝ／ㄆㄧㄝˇ(Ｃ)ㄔㄚˋ(Ｄ)ㄕㄥˋ／ㄔㄥˊ。\", \"pt\": 4}, {\"s\": 0, \"n\": \"18\", \"p\": \"\u003cp>下列各句，何者用字完全正確？\u003c/p>\", \"o\": [\"生活中的鎖事雖然細碎，只要善用時間仍然可以從容完成\", \"現代人生活忙錄，常常忽略對他人的關心\", \"等到日上三竿，市聲頂沸時，她才蓬頭垢面地出現在市集\", \"驀然回首，我愛撒嬌的小女兒將嫁為人婦\"], \"a\": 3, \"e\": \"(Ａ)鎖→瑣(Ｂ)錄→碌(Ｃ)頂→鼎。\", \"pt\": 4}, {\"s\": 0, \"n\": \"19\", \"p\": \"\u003cp>下列「盛」字的意思關係為何？(甲)「盛」年(乙)「盛」怒(丙)豐「盛」(丁)「盛」舉\u003c/p>\", \"o\": [\"甲丁同\", \"乙丙同\", \"甲丙同\", \"乙丁同\"], \"a\": 2, \"e\": \"(甲)(丙)興旺、繁茂、豐富(乙)極，表程度之深(丁)大規模的。\", \"pt\": 4}, {\"s\": 0, \"n\": \"20\", \"p\": \"\u003cp>下列「　」中的字，何組意思相同？\u003c/p>\", \"o\": [\"「致」勝關鍵／興「致」盎然\", \"延年「益」壽／精「益」求精\", \"入不「敷」出／不「敷」使用\", \"流「露」喜悅／「露」了口風\"], \"a\": 2, \"e\": \"(Ａ)獲得／情趣(Ｂ)增加／更加(Ｃ)足夠(Ｄ)顯現／洩露。\", \"pt\": 4}, {\"s\": 0, \"n\": \"21\", \"p\": \"\u003cp>下列的「是」字何者「並非」表賓語提前的作用？\u003c/p>\", \"o\": [\"寸陰「是」競\", \"主義「是」從\", \"馬首「是」瞻\", \"「是」非曲直\"], \"a\": 3, \"e\": \"(Ｄ)「是非」的「是」是對、正確的意思。(Ａ)(Ｂ)(Ｃ)的「是」都是把賓語提前的助詞，原本的語序是：競寸陰、從主義、瞻馬首。\", \"pt\": 4}, {\"s\": 0, \"n\": \"22\", \"p\": \"\u003cp>「勤奮不懈」之於「玩日愒歲」屬反義詞，猶如「分秒必爭」之於下列何者？\u003c/p>\", \"o\": [\"蹉跎歲月\", \"爭分奪秒\", \"及時趕上\", \"當機立斷\"], \"a\": 0, \"e\": \"(Ａ)蹉跎歲月：虛度光陰，與「分秒必爭」意思相反。(Ｂ)爭分奪秒與「分秒必爭」是近義詞。(Ｄ)當機立斷：抓住時機，立刻作出決斷。\", \"pt\": 4}, {\"s\": 0, \"n\": \"23\", \"p\": \"\u003cp>成語中有句「滴水穿石」，滴水之所以能夠穿石那是因為什麼原因？\u003c/p>\", \"o\": [\"無可自拔\", \"精益求精\", \"觸類旁通\", \"持之以恆\"], \"a\": 3, \"e\": \"(Ｄ)持之以恆：長久堅持下去。滴水能穿石，靠的就是長久不斷。(Ｃ)觸類旁通：理解此一事物的知識或原理，進而推知其他同類的事理。\", \"pt\": 4}, {\"s\": 0, \"n\": \"24\", \"p\": \"\u003cp>下列成語的配對，何組的關係為反義詞？\u003c/p>\", \"o\": [\"揮金如土／克勤克儉\", \"江心補漏／臨渴掘井\", \"莫衷一是／無所適從\", \"從容自如／輕鬆自在\"], \"a\": 0, \"e\": \"(Ａ)揮金如土（浪費）與克勤克儉（節儉）意思相反。(Ｂ)(Ｃ)(Ｄ)都是近義詞。\", \"pt\": 4}, {\"s\": 0, \"n\": \"25\", \"p\": \"\u003cp>電視臺舉辦了一個益智節目，一次四人同時上臺，待主持人抽出題目後，十秒內，參賽者必須依據要求回答出三個正確答案。這次，主持人抽到的是「形容時間極短的成語」下列何者成功晉級？\u003c/p>\", \"o\": [\"\u003cu>天天\u003c/u>：刻不容緩、曇花一現、時不我與\", \"\u003cu>龐龐\u003c/u>：咫尺天涯、分秒必爭、時空壓縮\", \"\u003cu>安安\u003c/u>：稍縱即逝、俯仰之間、白駒過隙\", \"\u003cu>凜凜\u003c/u>：一日三秋、日新月異、日月星辰\"], \"a\": 2, \"e\": \"(Ａ)時不我與：比喻錯失時機，後悔莫及。(Ｂ)咫尺天涯：比喻相距雖近，卻不能相見，如同相隔千里／時空壓縮，並非成語(Ｄ)一日三秋：形容思念殷切／日月星辰並非成語，僅是詞語。\", \"pt\": 4}];\n\n\nconst L = [\"A\",\"B\",\"C\",\"D\"];\nconst KEY = \"chi5-paper\";\nconst TOTAL = Q.reduce((s,q)=>s+q.pt,0);\nconst fmt = x => Math.round(x*10)/10;\nconst isMulti = q => Array.isArray(q.a);\nconst sameSet = (x,y) => Array.isArray(x) && x.length===y.length && x.every((v,k)=>v===y[k]);\nconst correct = i => Q[i].open ? state.ans[i]===\"ok\" : isMulti(Q[i]) ? sameSet(state.ans[i],Q[i].a) : state.ans[i]===Q[i].a;\nconst keyText = q => isMulti(q) ? q.a.map(k=>\"（\"+L[k]+\"）\").join(\"\") : \"（\"+L[q.a]+\"）\";\nconst $ = id => document.getElementById(id);\nconst esc = s => s.replace(/[&\u003c>\"]/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst tag = q => q.tg || (!SECS[q.s].group ? q.n : q.n.replace(/\\((\\d)\\)/,\"-$1\"));\n\nlet state = {mode:\"practice\", ans:{}, submitted:false, onlyWrong:false, focus:null};\ntry{ const s = JSON.parse(localStorage.getItem(KEY)||\"null\"); if(s && s.ans) state = Object.assign(state,s); }catch(e){}\nconst save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };\n\nconst graded = ()=> state.mode===\"practice\" || state.submitted;\nconst isWrong = i => graded() && (i in state.ans) && !correct(i);\n\nfunction bodyHTML(i){\n  const q = Q[i];\n  if(!q.open){\n    const imgs = q.o.every(t=>t.includes(\"\u003cimg\"));\n    const multi = isMulti(q) ? `\u003cdiv class=\"multibar ui\">\u003cspan class=\"hint\">可複選，選好後按「送出答案」\u003c/span>\u003cbutton class=\"tbtn send\" data-send=\"${i}\">送出答案\u003c/button>\u003c/div>` : \"\";\n    return `\u003cdiv class=\"opts${imgs?\" imgopts\":\"\"}\">${optsHTML(i)}\u003c/div>${multi}`;\n  }\n  return `${q.pre||\"\"}\u003ctextarea class=\"ans ui\" data-q=\"${i}\" rows=\"3\" placeholder=\"先寫下你的答案…\">\u003c/textarea>\n    \u003cdiv class=\"openbar ui\">\u003cbutton class=\"tbtn reveal\" data-rv=\"${i}\">看參考答案\u003c/button>\u003cspan class=\"hint\" id=\"hint${i}\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"ref ui hide\" id=\"ref${i}\">\u003cdiv>\u003cstrong>參考答案：\u003c/strong>${esc(q.r)}\u003c/div>\n      \u003cdiv class=\"selfrow\">對照後自評：\u003cbutton class=\"tbtn self\" data-self=\"${i}\" data-v=\"ok\">我答對了\u003c/button>\u003cbutton class=\"tbtn self\" data-self=\"${i}\" data-v=\"no\">我答錯了\u003c/button>\u003c/div>\u003c/div>`;\n}\nfunction optsHTML(i){\n  return Q[i].o.map((t,oi)=>`\u003cbutton class=\"opt\" data-q=\"${i}\" data-o=\"${oi}\">\u003cspan class=\"k\">（${L[oi]}）\u003c/span>\u003cspan class=\"ot\">${t}\u003c/span>\u003c/button>`).join(\"\");\n}\nfunction build(){\n  $(\"secs\").innerHTML = SECS.map((s,k)=>`\u003cdiv class=\"sec\">\u003ch2>${s.name}\u003c/h2>\u003cspan class=\"ui\">${s.note}\u003c/span>\u003c/div>\u003cdiv id=\"sec${k}\">\u003c/div>`).join(\"\");\n  $(\"gridwrap\").innerHTML = SECS.map((s,k)=>`\u003ch3>${s.name}\u003c/h3>\u003cdiv class=\"grid\" id=\"grid${k}\">\u003c/div>`).join(\"\");\n  SECS.forEach((sec,k)=>{\n  if(!sec.group){\n  $(\"sec\"+k).innerHTML = Q.map((q,i)=>q.s!==k?\"\":`\n    \u003csection class=\"card item\" id=\"q${i}\" data-items=\"${i}\">\n      \u003cdiv class=\"no\">${q.n}.\u003c/div>\n      \u003cdiv>${q.g?`\u003cdiv class=\"mat\">${G[q.g].html}\u003c/div>`:\"\"}\n        \u003cdiv class=\"prompt\">${q.p}\u003c/div>${bodyHTML(i)}\u003cdiv class=\"fb hide\" id=\"fb${i}\">\u003c/div>\u003c/div>\n    \u003c/section>`).join(\"\");\n  return; }\n  const order = [];\n  Q.forEach((q,i)=>{ if(q.s===k && !order.includes(q.g)) order.push(q.g); });\n  $(\"sec\"+k).innerHTML = order.map(g=>{\n    const ids = Q.map((q,i)=>q.g===g?i:-1).filter(i=>i>=0);\n    return `\u003csection class=\"card\" id=\"grp-${g}\" data-items=\"${ids.join(\",\")}\">\n      \u003cp class=\"ghead\">${G[g].label.replace(\"題組 \",\"\").replace(/^(\\d+)/,\"$1.\")}\u003c/p>\n      \u003cdiv class=\"mat\">${G[g].html}\u003c/div>\n      ${ids.map(i=>{const m=Q[i].m||Q[i].n.match(/\\((\\d)\\)/)[1];\n        return `\u003cdiv class=\"sub\" id=\"q${i}\">\u003cdiv class=\"prompt\">${/^\u003cp>/.test(Q[i].p) ? Q[i].p.replace(/^\u003cp>/,\"\u003cp>（\"+m+\"）\") : \"\u003cp>（\"+m+\"）\u003c/p>\"+Q[i].p}\u003c/div>${bodyHTML(i)}\u003cdiv class=\"fb hide\" id=\"fb${i}\">\u003c/div>\u003c/div>`}).join(\"\")}\n    \u003c/section>`;\n  }).join(\"\");\n  });\n  SECS.forEach((s,k)=>{\n    $(\"grid\"+k).innerHTML = Q.map((q,i)=>q.s===k?`\u003cbutton class=\"num\" data-go=\"${i}\">${tag(q)}\u003c/button>`:\"\").join(\"\");\n  });\n  $(\"stTotal\").textContent = Q.length;\n  document.querySelectorAll(\".opt\").forEach(b=>b.onclick=()=>pick(+b.dataset.q,+b.dataset.o));\n  document.querySelectorAll(\".send\").forEach(b=>b.onclick=()=>sendMulti(+b.dataset.send));\n  document.querySelectorAll(\".num\").forEach(b=>b.onclick=()=>jump(+b.dataset.go));\n  document.querySelectorAll(\".ans\").forEach(ta=>{ ta.value = (state.txt||{})[ta.dataset.q]||\"\"; ta.oninput=()=>{ state.txt=state.txt||{}; state.txt[ta.dataset.q]=ta.value; save(); }; });\n  document.querySelectorAll(\".reveal\").forEach(b=>b.onclick=()=>{ if(!graded()) return; state.rev=state.rev||{}; state.rev[b.dataset.rv]=1; save(); paintQ(+b.dataset.rv); });\n  document.querySelectorAll(\".self\").forEach(b=>b.onclick=()=>selfGrade(+b.dataset.self, b.dataset.v));\n  $(\"ttl\").textContent = TITLE; $(\"stMax\").textContent = fmt(TOTAL);\n\n}\n\nfunction selfGrade(i,v){\n  if(!graded() || (i in state.ans)) return;\n  state.ans[i]=v; save(); paintQ(i); paintStats(); paintResult();\n}\nfunction sendMulti(i){\n  const s = (state.sel||{})[i] || [];\n  if(!s.length || (i in state.ans) || !graded()) return;\n  state.ans[i] = s.slice().sort(); save(); paintQ(i); paintStats();\n  nextAfter(i);\n}\nfunction pick(i,o){\n  if(state.mode===\"practice\" && (i in state.ans)) return;\n  if(state.mode===\"test\" && state.submitted) return;\n  if(isMulti(Q[i])){\n    state.sel = state.sel||{}; const s = new Set(state.sel[i]||[]);\n    s.has(o) ? s.delete(o) : s.add(o);\n    state.sel[i] = [...s].sort();\n    if(state.mode===\"test\"){ if(state.sel[i].length) state.ans[i]=state.sel[i]; else delete state.ans[i]; }\n    save(); paintQ(i); paintStats(); return;\n  }\n  state.ans[i]=o; save();\n  paintQ(i); paintStats();\n  if(state.mode===\"practice\") nextAfter(i);\n}\n// practice: slide to the next unanswered question after showing feedback\nfunction nextAfter(i){\n  const nxt = Q.findIndex((q,j)=>j>i && !(j in state.ans) && visible(j));\n  if(nxt\u003c0) return;\n  if(!correct(i)) return;   // wrong: stay so the explanation can be read\n  setTimeout(()=>jump(nxt,true), 650);\n}\nfunction jump(i,soft){\n  if(!visible(i)){ state.onlyWrong=false; state.focus=null; save(); paintAll(); }\n  let el = $(\"q\"+i);\n  const card = el.closest(\"[data-items]\");\n  if(el.classList.contains(\"sub\") && card.dataset.items.split(\",\")[0]==String(i)) el = card;  // first sub: show the material too\n  if(!soft && window.innerWidth\u003c800) $(\"map\").open = false;\n  setTopH();\n  el.scrollIntoView({behavior: soft?\"smooth\":\"auto\", block: soft && el===$(\"q\"+i) ? \"center\":\"start\"});\n}\nfunction paintQ(i){\n  const q = Q[i], a = state.ans[i], has = i in state.ans, g = graded();\n  if(q.open){\n    const rev = (state.rev||{})[i] || has;\n    $(\"ref\"+i).classList.toggle(\"hide\", !(g && rev));\n    const rb = document.querySelector(`.reveal[data-rv=\"${i}\"]`);\n    rb.classList.toggle(\"hide\", g && rev); rb.disabled = !g;\n    $(\"hint\"+i).textContent = g ? \"\" : \"交卷後可看參考答案並自評\";\n    document.querySelectorAll(`.self[data-self=\"${i}\"]`).forEach(b=>{ b.disabled = has; b.setAttribute(\"aria-pressed\", a===b.dataset.v); });\n    const ta = document.querySelector(`.ans[data-q=\"${i}\"]`); ta.value = (state.txt||{})[i]||\"\";\n    const fb = $(\"fb\"+i);\n    if(has && g){ fb.className = \"fb ui \"+(a===\"ok\"?\"ok\":\"no\"); fb.innerHTML = `\u003cstrong>${a===\"ok\"?\"自評：答對\":\"自評：答錯\"}\u003c/strong>${q.e}`; }\n    else fb.className = \"fb hide\";\n    const n = document.querySelector(`.num[data-go=\"${i}\"]`);\n    n.className = \"num\" + (has && g ? (a===\"ok\"?\" ok\":\" no\") : ((state.txt||{})[i] ? \" done\" : \"\"));\n    return;\n  }\n  if(isMulti(q)){\n    const sel = new Set((has ? a : (state.sel||{})[i]) || []);\n    document.querySelectorAll(`.opt[data-q=\"${i}\"]`).forEach(b=>{\n      const oi = +b.dataset.o; b.className = \"opt\";\n      if(has && g){ if(q.a.includes(oi)) b.classList.add(sel.has(oi)?\"right\":\"miss\"); else if(sel.has(oi)) b.classList.add(\"wrong\"); }\n      else if(sel.has(oi)) b.classList.add(\"pick\");\n      b.disabled = (g && has) || (state.mode===\"test\" && state.submitted);\n    });\n    const sb = document.querySelector(`.send[data-send=\"${i}\"]`);\n    sb.classList.toggle(\"hide\", state.mode===\"test\" || has); sb.disabled = !sel.size;\n    const fb = $(\"fb\"+i);\n    if(has && g){ const ok = correct(i); fb.className = \"fb ui \"+(ok?\"ok\":\"no\");\n      fb.innerHTML = `\u003cstrong>${ok?\"答對了！\":\"答錯了，正確答案是\"+keyText(q)}\u003c/strong>${q.e}`; }\n    else fb.className = \"fb hide\";\n    const n = document.querySelector(`.num[data-go=\"${i}\"]`);\n    n.className = \"num\" + (has ? (g ? (correct(i)?\" ok\":\" no\") : \" done\") : \"\");\n    return;\n  }\n  document.querySelectorAll(`.opt[data-q=\"${i}\"]`).forEach(b=>{\n    const oi = +b.dataset.o;\n    b.className = \"opt\";\n    if(has && g){\n      if(oi===q.a) b.classList.add(\"right\");\n      else if(oi===a) b.classList.add(\"wrong\");\n    } else if(has && oi===a <script>QZ["c6"]="\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-Hant\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>國文第六課 鳥 互動測驗\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;900&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --canvas:#EFF0EC; --surface:#FFFFFF; --ink:#1E2430; --muted:#5F6673; --line:#D9DCD6;\n  --navy:#2A4A7F; --navy-ink:#FFFFFF; --chip:#EEF0EA;\n  --ok:#1E7A46; --ok-bg:#E4F3E9; --bad:#B3261E; --bad-bg:#FBE9E7; --pick:#DCE6F5;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n  color-scheme:light;\n}\n@media (prefers-color-scheme: dark){\n  :root{\n    --canvas:#14171C; --surface:#1D2128; --ink:#E9ECF1; --muted:#A3AAB6; --line:#323844;\n    --navy:#8FB0E8; --navy-ink:#10151F; --chip:#272C35;\n    --ok:#6FD39C; --ok-bg:#173326; --bad:#FF8F84; --bad-bg:#3E2020; --pick:#26344D;\n    color-scheme:dark;\n  }\n}\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;background:var(--canvas);color:var(--ink);\n  font-family:\"Noto Serif TC\",\"PMingLiU\",serif;font-size:17px;line-height:1.9}\n.ui{font-family:\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",system-ui,sans-serif}\n\n/* top bar */\n.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);\n  padding:12px 18px 10px;padding-top:calc(12px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}\n.top-in{max-width:1080px;margin:0 auto}\n.row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px 18px;flex-wrap:wrap}\nh1{font-family:\"Noto Serif TC\",serif;font-weight:900;font-size:clamp(22px,4vw,30p erline wavy;text-underline-offset:3px;text-decoration-thickness:1px}\nu.dbl{text-decoration:underline double;text-underline-offset:3px}\n.opt .ot img{max-height:200px;max-width:100%;height:auto;display:block;background:#fff}\n.imgopts{grid-template-columns:repeat(2,minmax(0,1fr))}\n.imgopts .opt{flex-direction:column;align-items:flex-start}\n.opt.miss{border-color:var(--ok);border-style:dashed}\n.opt.miss .k{color:var(--ok);font-weight:700}\n.multibar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}\n.multibar .hint{font-size:13px;color:var(--muted)}\n.tbl{border-collapse:collapse;margin:8px 0 12px;font-size:15px;width:100%}\n.tbl th,.tbl td{border:1px solid var(--ink);padding:4px 10px;text-align:center}\n.tbl th{font-weight:600;background:var(--chip)}\ntextarea.ans{width:100%;font-size:16px;line-height:1.6;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}\ntextarea.ans:focus{outline:2px solid var(--navy);border-color:var(--navy)}\n.openbar{display:flex;align-items:center;gap:10px;margin-top:8px}\n.openbar .hint{font-size:13px;color:var(--muted)}\n.ref{margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--pick);font-size:15px;line-height:1.75}\n.selfrow{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n.self[aria-pressed=\"true\"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}\n.endbar{text-align:center;margin:24px 0}\n.endbar .tbtn{font-size:17px;padding:12px 26px}\n.empty{text-align:center;color:var(--muted);padding:30px 0}\n.result{background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:18px 22px;margin:0 0 14px;text-align:center}\n.result b{font-size:28px}\n@media (max-width:560px){\n  .card{padding:16px 14px}.item{grid-template-columns:32px 1fr}\n  .top{padding-left:12px;padding-right:12px}.seg button,.tbtn{padding:7px 10px;font-size:14px}\n  .stats{font-size:13px}.stats b{font-size:16px}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"top ui\" id=\"top\">\n \u003cdiv class=\"top-in\">\n  \u003cdiv class=\"row1\">\n    \u003ch1 id=\"ttl\">\u003c/h1>\n    \u003cdiv class=\"stats\">\n      \u003cspan>已作答 \u003cb id=\"stDone\">0\u003c/b> / \u003cspan id=\"stTotal\">\u003c/span>\u003c/span>\n      \u003cspan>得分 \u003cb id=\"stScore\">0\u003c/b> / \u003cspan id=\"stMax\">\u003c/span>\u003c/span>\n      \u003cspan class=\"g\">答對 \u003cb id=\"stOk\">0\u003c/b>\u003c/span>\n      \u003cspan class=\"r\">答錯 \u003cb id=\"stNo\">0\u003c/b>\u003c/span>\n      \u003cspan>答對率 \u003cb id=\"stRate\">–\u003c/b>\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"row2\">\n    \u003cdiv class=\"seg\" role=\"group\" aria-label=\"作答模式\">\n      \u003cbutton id=\"mPractice\" aria-pressed=\"true\">練習：選了就對答案\u003c/button>\n      \u003cbutton id=\"mTest\" aria-pressed=\"false\">測驗：交卷再對答案\u003c/button>\n    \u003c/div>\n    \u003cbutton class=\"tbtn\" id=\"onlyWrong\" aria-pressed=\"false\">只看錯題\u003c/button>\n    \u003cbutton class=\"tbtn\" id=\"redoWrong\" disabled>重練錯題\u003c/button>\n    \u003cbutton class=\"tbtn hide\" id=\"showAll\" aria-pressed=\"true\">重練中・顯示全部\u003c/button>\n    \u003cbutton class=\"tbtn\" id=\"reset\">重新作答\u003c/button>\n    \u003cbutton class=\"tbtn submit hide\" id=\"submitTop\">交卷\u003c/button>\n  \u003c/div>\n  \u003cdetails class=\"map\" id=\"map\" open>\n    \u003csummary>題號一覽（點題號可跳轉）\u003c/summary>\n    \u003cdiv class=\"grid-wrap\" id=\"gridwrap\">\u003c/div>\n  \u003c/details>\n \u003c/div>\n\u003c/div>\n\n\u003cmain id=\"paper\">\n  \u003cdiv class=\"result ui hide\" id=\"result\">\u003c/div>\n  \u003cdiv id=\"secs\">\u003c/div>\n  \u003cp class=\"empty ui hide\" id=\"empty\">目前沒有錯題 👍\u003c/p>\n  \u003cdiv class=\"endbar ui hide\" id=\"endbar\">\u003cbutton class=\"tbtn submit\" id=\"submitEnd\">交卷\u003c/button>\u003c/div>\n\u003c/main>\n\n\u003cscript>\nconst TITLE = \"國文第六課 鳥　試卷・互動練習\";\nconst SECS = [{\"name\": \"單一選擇題\", \"note\": \"每題 4 分，共 100 分\", \"group\": false}];\nconst G = {};\nconst Q = [{\"s\": 0, \"n\": \"1\", \"p\": \"\u003cp>關於〈鳥〉一文對鳥聲的描寫，下列敘述何者\u003cu class=\\\"dbl\\\">錯誤\u003c/u>？\u003c/p>\", \"o\": [\"作者從音樂的觀點描述鳥鳴聲，使人對鳥聲的節奏、音質、韻律都能有如聞其聲的具體感受\", \"以「吱吱喳喳」、「呱呱噪啼」呼應「不知有多少個春天的早晨，這樣的鳥聲把我從夢境喚起」\", \"「簡直是一派和諧的交響樂」使用譬喻手法，寫出百鳥齊鳴，同時營造出喜悅和樂的氣氛\", \"以杜鵑哀淒的啼叫襯托內心的酸楚，此種情感類似於「日暮鄉關何處是，煙波江上使人愁」\"], \"a\": 1, \"e\": \"文中寫道：「窗外是一片鳥囀，不是吱吱喳喳的麻雀，不是呱呱噪啼的烏鴉」由此可知喚醒作者的鳥聲不是「吱吱喳喳」、「呱呱噪啼」。\", \"pt\": 4}, {\"s\": 0, \"n\": \"2\", \"p\": \"\u003cp>「若要有效保護雛鳥，巢的構築還有許多要注意的地方。例如鳥會選擇較為隱密的築巢地點，以減低蛋與雛鳥被天敵掠食的風險。另外，有些鳥類會在巢中添加新鮮葉子，鳥類學家認為，這些葉子就如人們利用天然植物萃取物製造的驅蟲劑一般，能夠減少巢中雛鳥遭受寄生蟲侵害的機會。研究顯示，有些在都市繁殖的鳥甚至會叼取菸屁股塞進牠們的巢中，利用菸草驅逐巢內寄生蟲。」（〈科學人雜誌．鳥巢也會演化〉）根據本文，下列敘述何者正確？\u003c/p>\", \"o\": [\"鳥類築巢是因鳥巢能幫助繁殖與孵蛋\", \"鳥類先找到適合築巢的地點並築好巢，以利交配\", \"在都市繁殖的鳥利用菸屁股築巢，以免雛鳥受寄生蟲侵害\", \"鳥類會利用天然植物萃取物製造的驅蟲劑除蟲\"], \"a\": 2, \"e\": \"(Ａ)鳥類築巢是因為想保護雛鳥，減低蛋與雛鳥被天敵掠食的風險。(Ｂ)文章沒有提到築好巢可以利於交配。(Ｃ)文章有提到，故答案選(Ｃ)。(Ｄ)鳥類是在巢中添加新鮮葉子，非天然植物萃取物製造的驅蟲劑除蟲。\", \"pt\": 4}, {\"s\": 0, \"n\": \"3\", \"p\": \"\u003cp>\u003cu>柏克海德\u003c/u>《鳥的感官．後記》：「要了解鳥類如何體驗世界，利用人類的感覺系統只能算是起點，只要能辨別牠們具備我們沒有的感覺，只要我們不自動假設牠們跟我們共有的感覺一模一樣，就可以略窺鳥類的感覺世界。」根據這段文字，下列敘述何者正確？\u003c/p>\", \"o\": [\"人類窮極一生也無從了解鳥類的感覺世界\", \"人類不應以自我想法妄加揣測鳥類的感覺\", \"人類與鳥類的感覺體驗在多數情境下雷同\", \"人類對於野生鳥類的感官世界已知之甚詳\"], \"a\": 1, \"e\": \"根據內文可推知，不以人類的思維、感受窺探鳥類世界，便是認識鳥類世界的第一關鍵。\", \"pt\": 4}, {\"s\": 0, \"n\": \"4\", \"p\": \"\u003cp>下列「　」中的形似字，何組讀音相同？\u003c/p>\", \"o\": [\"阿「諛」諂媚／面貌豐「腴」\", \"刀鋒「銳」利／成長「蛻」變\", \"飲「啄」方便／不容置「喙」\", \"穠「纖」合度／「懺」悔不已\"], \"a\": 0, \"e\": \"(Ａ)ㄩˊ(Ｂ)ㄖㄨㄟˋ／ㄊㄨㄟˋ(Ｃ)ㄓㄨㄛˊ／ㄏㄨㄟˋ(Ｄ)ㄒㄧㄢ／ㄔㄢˋ。(Ｃ)不容置喙：不容許插嘴或批評。\", \"pt\": 4}, {\"s\": 0, \"n\": \"5\", \"p\": \"\u003cp>下列「　」中的字，何者讀音前後相同？\u003c/p>\", \"o\": [\"這張入場「券」可供員工「眷」屬使用\", \"「悶」熱的午後就像「燜」燒鍋一樣令人難耐\", \"低沉而單「調」的旋律，令我更加「惆」悵\", \"「隔」著柵欄看到鸚鵡羽「翮」不整，真令人於心不忍\"], \"a\": 3, \"e\": \"(Ａ)ㄑㄩㄢˋ／ㄐㄩㄢˋ(Ｂ)ㄇㄣ／ㄇㄣˋ(Ｃ)ㄉㄧㄠˋ／ㄔㄡˊ(Ｄ)ㄍㄜˊ。\", \"pt\": 4}, {\"s\": 0, \"n\": \"6\", \"p\": \"\u003cp>下列文句，何者用字完全正確？〔93.第一次基測〕\u003c/p>\", \"o\": [\"本班同學的卡片設計非常有創意，令人嘆為觀止\", \"今年高考，哥哥終於金榜提名，我們都為他感到高興\", \"企鵝的超人氣招來了大批遊客，使得動物園市聲頂沸、熱鬧非凡\", \"許多家長安排孩子上才藝班，讓孩子不得休息，實在是偃苗助長\"], \"a\": 0, \"e\": \"(Ｂ)提→題(Ｃ)頂→鼎(Ｄ)偃→揠。\", \"pt\": 4}, {\"s\": 0, \"n\": \"7\", \"p\": \"\u003cp>下列選項「　」中的字，何組意思相同？\u003c/p>\", \"o\": [\"淒「絕」的哀樂／嘆賞不「絕」\", \"盤「旋」／凱「旋」歸來\", \"臨風「顧」盼／奮不「顧」身\", \"留蚊「於」素帳中／步「於」中庭\"], \"a\": 3, \"e\": \"(Ａ)極／止、停(Ｂ)繞著轉動／回(Ｃ)看／關注(Ｄ)在。\", \"pt\": 4}, {\"s\": 0, \"n\": \"8\", \"p\": \"\u003cp>下列「　」中的字，何者是實指顏色？\u003c/p>\", \"o\": [\"那「釉」綠的瓷器，令人愛不釋手\", \"學會用「丹」田發音，聲音會更宏亮\", \"「黛」青的山巒綿延到天際，是此地最美的景致\", \"他再三地犯錯，所有人都「灰」心至極\"], \"a\": 2, \"e\": \"(Ａ)瓷器上的藥料，燒製後可使東西發亮(Ｂ)丹田：人體臍下一寸半或三寸的地方(Ｄ)沮喪。\", \"pt\": 4}, {\"s\": 0, \"n\": \"9\", \"p\": \"\u003cp>下列「　」中的狀聲詞運用，何者\u003cu class=\\\"dbl\\\">不恰當\u003c/u>？\u003c/p>\", \"o\": [\"聽！此刻窗外「颯颯」的風聲，似乎在訴說著失戀者的悲苦\", \"黃昏時，無數麻雀聚集在那屋簷下，「呢呢喃喃」地竊竊私語\", \"孤雁「嘎嘎」地叫醒長夜的寂寞\", \"春天萬物甦醒，蟲鳥也「啁啾」地唱起歌來\"], \"a\": 1, \"e\": \"(Ｂ)宜改為「吱吱喳喳」。\", \"pt\": 4}, {\"s\": 0, \"n\": \"10\", \"p\": \"\u003cp>日常用語中，我們常藉動物、昆蟲的特性來表達某種特殊涵義，如「鷹派」形容主張採取強勢手段的人士、團體，「鴿派」則是形容主張採取柔性溫和手段的人士或團體。下列各句「　」中與動物相關的慣用語，何者正確？\u003c/p>\", \"o\": [\"想確保3C產業「地頭蛇」的地位，絕非容易之事\", \"他明明跟我約好在火車站見面，卻把我「放鴿子」，讓人難以再相信他\", \"他處事敏捷果斷，極有效率，被班上同學奉為「變色龍」\", \"\u003cu>小強\u003c/u>個性堅毅，有「笑面虎」的特質，即使屢遭挫折也不輕易低頭\"], \"a\": 1, \"e\": \"(Ａ)「地頭蛇」指橫行地方、欺壓人民的強人。可改為「領頭羊」或「龍頭」。(Ｂ)「放鴿子」指爽約的行為。(Ｃ)「變色龍」比喻在政壇上擅長變化、偽裝的人。(Ｄ)「笑面虎」比喻面善心惡的人。\", \"pt\": 4}, {\"s\": 0, \"n\": \"11\", \"p\": \"\u003cp>下列「　」中的成語，何者使用「不當」？\u003c/p>\", \"o\": [\"\u003cu>野崎\u003c/u>年紀輕輕就具有「鴻鵠之志」，目光遠大\", \"\u003cu>結月\u003c/u>和\u003cu>阿政\u003c/u>離別後，\u003cu>阿政\u003c/u>的音訊就「杳如黃鶴」，下落不明\", \"在這水鳥觀賞區，他們竟然在烤鳥，真是「焚琴煮鶴」，令人氣憤\", \"\u003cu>伊格西\u003c/u>和\u003cu>蘿希\u003c/u>之間感情融洽，可說是「烏合之眾」\"], \"a\": 3, \"e\": \"(Ｄ)宜改為「莫逆之交」。\", \"pt\": 4}, {\"s\": 0, \"n\": \"12\", \"p\": \"\u003cp>下列何者運用了「聽覺」摹寫？\u003c/p>\", \"o\": [\"稻田裡佇立著一隻白鷺，拳著一條腿，縮著頸子\", \"牠倏地振翅飛去，牠不回頭，牠不徘徊，牠像虹似地一下就消逝了\", \"黎明時，窗外是一片鳥囀，不是吱吱喳喳的麻雀，不是呱呱噪啼的烏鴉，那一片聲音是清脆的，是嘹亮的\", \"有時候「一行白鷺上青天」，背後還襯著黛青的山色和釉綠的梯田\"], \"a\": 2, \"e\": \"(Ａ)(Ｂ)(Ｄ)視覺摹寫。\", \"pt\": 4}, {\"s\": 0, \"n\": \"13\", \"p\": \"\u003cp>下列選項，哪一文句\u003cu class=\\\"dbl\\\">有語病\u003c/u>？\u003c/p>\", \"o\": [\"雖然他貌不驚人，但是大家都很喜歡他\", \"世界上的生物動物，沒有比鳥更俊俏的\", \"在白晝，聽不到鳥鳴，但是看得見鳥的形體\", \"\u003cu>楊\u003c/u>小姐天生一副金嗓子，唱起歌來嘹亮有致，令人羨慕\"], \"a\": 1, \"e\": \"(Ｂ)刪「動物」。\", \"pt\": 4}, {\"s\": 0, \"n\": \"14\", \"p\": \"\u003cp>下列文句，何者的抒情成分最「淡薄」？\u003c/p>\", \"o\": [\"有的是胸襟上帶著一塊照眼的顏色\", \"客夜聞此，說不出的酸楚\", \"好銳利的喜悅刺上我的心頭\", \"再令人觸目的就是那些偶然一見的囚在籠裡的小鳥兒了，但是我不忍看\"], \"a\": 0, \"e\": \"(Ａ)僅視覺摹寫，未抒情。\", \"pt\": 4}, {\"s\": 0, \"n\": \"15\", \"p\": \"\u003cp>\u003cu class=\\\"wavy\\\">鳥\u003c/u>一文中提到籠中鳥「牠的苦悶，大概是僅次於黏在膠紙上的蒼蠅；牠的快樂，大概是僅優於在標本室裡住著罷？」關於這段話，下列何者說明正確？\u003c/p>\", \"o\": [\"「僅次於」、「僅優於」有強調和比較的作用\", \"作者認為應該把鳥關在標本室欣賞\", \"鳥比蒼蠅還要苦悶\", \"「大概」透露出肯定的語氣\"], \"a\": 0, \"e\": \"(Ｂ)作者認為鳥應回歸自然(Ｃ)蒼蠅比鳥苦悶(Ｄ)推測的語氣。\", \"pt\": 4}, {\"s\": 0, \"n\": \"16\", \"p\": \"\u003cp>關於\u003cu>梁實秋\u003c/u> \u003cu class=\\\"wavy\\\">鳥\u003c/u>一文文句的說明，下列何者正確？\u003c/p>\", \"o\": [\"牠像虹似地一下就消逝了——寫鳥兒飛去的惆悵之情\", \"一行白鷺上青天——寫鳥類群聚守紀的習性\", \"腳上像是有彈簧——寫鳥類展翅高飛的迅捷\", \"入夜也還能聽見那像哭又像笑的鴟梟的怪叫——寫對鳥鳴痛惡之感\"], \"a\": 0, \"e\": \"(Ｂ)寫動態與色彩美(Ｃ)寫鳥跳盪的靈巧(Ｄ)沒有表達痛惡之感。\", \"pt\": 4}, {\"s\": 0, \"n\": \"17\", \"p\": \"\u003cp>「一行白鷺上青天」生動描繪鳥的動態美，請問下列何者\u003cu class=\\\"dbl\\\">並非\u003c/u>描寫鳥的動態句子？\u003c/p>\", \"o\": [\"天鵝用粉紅色的腳掌滑著湖水向前游，湖面上蕩起一圈圈波紋，遠遠望去好像白色的帆船在水中晃來晃去\", \"一隻猛禽平張著雙翅從天空直插下去，幾乎觸到地面，忽又撲動翅膀發出猛烈的聲響斜刺天空\", \"靈巧可愛的小燕子，一雙像剪刀的尾巴，在細雨中斜飛，在晨光中翻飄，在柳絮中昂首，在薄霧中迴旋\", \"兩隻喜鵲站在樹枝上，黑白相間的羽毛在陽光的映照下油光發亮，間或閃耀出華麗的亮藍色，煞是好看\"], \"a\": 3, \"e\": \"題幹所問的是動態句子，(Ｄ)是描寫喜鵲的羽毛，是靜態句子，故選(Ｄ)。\", \"pt\": 4}, {\"s\": 0, \"n\": \"18\", \"p\": \"\u003cp>下列何者\u003cu class=\\\"dbl\\\">不屬於\u003c/u>動態的描寫？\u003c/p>\", \"o\": [\"牠像虹似地一下就消逝了，牠留下的是無限的迷惘\", \"稻田裡佇立著一隻白鷺，拳著一條腿，縮著頸子\", \"牠倏地振翅飛去，牠不回顧，牠不徘徊\", \"就是抓小雞的鳶鷹，啾啾地叫著，在天空盤旋\"], \"a\": 1, \"e\": \"(Ｂ)靜態的描寫。\", \"pt\": 4}, {\"s\": 0, \"n\": \"19\", \"p\": \"\u003cp>〈鳥〉一文中：「由遠叫到近，由近叫到遠，一聲急似一聲，竟是淒絕的哀樂。客夜聞此，說不出的酸楚！」這段話所描寫的景象最接近下列何者？\u003c/p>\", \"o\": [\"隨意春芳歇，王孫自可留\", \"欲窮千里目，更上一層樓\", \"白日放歌須縱酒，青春作伴好還鄉\", \"\u003cu>姑蘇\u003c/u>城外\u003cu>寒山寺\u003c/u>，夜半鐘聲到客船\"], \"a\": 3, \"e\": \"題幹與(Ｄ)作客他鄉，因鄉愁無法成眠。\", \"pt\": 4}, {\"s\": 0, \"n\": \"20\", \"p\": \"\u003cp>「鄉情所以難忘，是對風景裡的人的牽掛。」（\u003cu>子敏\u003c/u>）這兩句話的心情，與下列何者詩句最為接近？\u003c/p>\", \"o\": [\"竹喧歸浣女，蓮動下漁舟\", \"近鄉情更怯，不敢問來人\", \"夕陽無限好，只是近黃昏\", \"晚來天欲雪，能飲一杯無\"], \"a\": 1, \"e\": \"題幹為「對家鄉的思念牽掛之情」與(Ｂ)（\u003cu>李頻\u003c/u>　渡漢江）同。(Ａ)山中的人物活動（\u003cu>王維\u003c/u>　山居秋暝）(Ｃ)對人生的感嘆（\u003cu>李商隱\u003c/u>　登樂遊原）(Ｄ)朋友相聚（\u003cu>白居易\u003c/u>　問劉十九）。\", \"pt\": 4}, {\"s\": 0, \"n\": \"21\", \"p\": \"\u003cp>「栗背林鴝有時會飛來我置身的巨岩下，在小徑上跳兩下停一下，一副既緊張又從容的樣子。雄鳥的顏色華麗莊重，搭配得真美：墨黑的頭頸上，明顯的一道細長的白眉，上胸和兩側肩膀上的羽毛橘紅色，下身是柔和的棕青。雌鳥的色澤就拙樸多了。」請問上文栗背林鴝的雄鳥，最有可能是下列何選項？\u003c/p>\", \"o\": [\"\u003cimg src=\\\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAj0AAALACAMAAABPQzP0AAADAFBMVEUDARUNFBEbGxoNDSIYHCIcHTMcKRYNJi0JKTMNMj0WIycTLjcUMz0jGRYjHBooHhskHyAoIB4kKSwnLTQqMi0pMzowJyUyKiQ1LCo7JiExLTc5Mi47NjUPNEEVOkcnK0UqN0UpPVAzOUk3PVYZQTsgST42QT4aQU4dRVQnQ0sjS1krW0UlUV44R0Y7Ql4/UE03U10iTWIqWGcpW3Y9RGI4W2c0XnEuYU81aVU8dFYvYG0rYH4xYW41aHM9dGQ+cX5LLidBOjdbNitcODFkOi1nPjNFQzRFQTtJRzdJQT1LST5SSjxSUz9rQjd4RzpIRkVCSFlCUk5HWFdTTklVVEVYV1ZETGpHT3BDW2hMVXZZXWVRWnxOYl5BfFxfYUtdYF9EYW1IaXdCe2JMcX1WaGVTbXtccm1Wcn5sTURlVkZlXlt0TUR8U0p/XFRjZU1obVJtcVdyakx2aF18dEx2d1VoZ2ZpbXNkdG5jeHRya2l4d2h4dnYtXoItZYgvapM2Z4EwbZk/coE+c5FUXoFEboFJc4NKepJaY4hfaZBZdYNUfpFibJNgeYVncpt4f4Jwf5NteaNyfqpGgmFMiXNTlW9ZkH1qgXx9gWp0g39KgY5OhpNWiplfi6BpgIxmipZmkZx2h4Z3jJd8kY13kZlhjaFpkqV1ga53mqZ8oKp9obKBTD+ETkGKUUWVV0ueXFCBelSBcW2Ef32hXlODfoGKhlqTjF2Zkl+Ih3iclmGphn6jnGStp3ayrX6FhoaGjpCGko2El5mRjIqWloeamZiKnKaUnqKZo5yNoKqJqLSTpaqZq7SesK6btLqjnp2mppu7uJmqqaekrrKtsqintbezr6G4uay4trSYtcGsusGzvcCuwL+/wba6x8m0ydHBvZjBvrfJxKTHxrrRzrzKycjEzdLP0cnI09bRz8DY1cXU0tHQ19rU293Z19bc3NTd3NvO3OLY3+Ld5Obg3trl49nr6+fp7vHv8O3u8vTw7+nx8Oz09PP19/j3+Pj49/b5+Pb///+NVul9AAAAAWJLR0QAiAUdSAAAAAxjbVBQSkNtcDA3MTIAAAADSABzvAAAlPZJREFUeF7tvQtgXPV95wvCiW3ZRxrNeByvkd2x1OqFZT1sJ8GPZbV3U+qURLEdvxYTpPq1y703JLtxKmrsJZd6yRDSJWwvhQa6JpDsNm035SZNe9Ob1F5DHJKwl0BxSeouN4E4huC92JZ57JWY+/39/o/zP2fOzJyZOfOS/v8E x/U3h1H/F66aNjvumXT/fLPXeSc5njq5iz8DIvi3026w/v0DGVD6umR83puIpfPOefNgR87NN3n/hVNT3acTxXO2BDwce3eyHLh8aLfaE+6DRFr3Z6wrfOlvgly4c+/Ox36oNXPTtDSNw1+6zu/LLnp23gWnjxnH/jkIKXmr7zzkFD+0L6n+4BB55rhKwh4mMz/UPtr57uHsfwXCPk8D9zyPgY/LOav+PU+WvppXP+rcPBx8KPd8A5lefaA2ro6mOqPzvoXHvoDC94if4FrWvzlXP+1cPyPs7L57wCw7DOzovnvAKD/z9LLVi0DyneyQAAAABJRU5ErkJggg==\\\" alt=\\\"附圖\\\">\"], \"a\": 3, \"e\": \"從「明顯的一道細長的白眉」可知應選(Ｄ)。(Ａ)喜鵲。(Ｂ)冠羽畫眉。(Ｃ)綠繡眼。\", \"pt\": 4}, {\"s\": 0, \"n\": \"22\", \"p\": \"\u003cp>「一鍋杜鵑被地氣熬了一個冬天，三月裡便忍不住沸沸揚揚起來，成日裡噴紅濺紫，把一座死火山開成了活火山。」（\u003cu>張曉風\u003c/u>　\u003cu class=\\\"wavy\\\">沸點及其他\u003c/u>）這段文句運用轉化法生動描寫杜鵑花，但其中「不包含」下列何者？\u003c/p>\", \"o\": [\"熬煮的美味\", \"開花的季節\", \"繽紛的色彩\", \"蓬勃的生機\"], \"a\": 0, \"e\": \"(Ｂ)由「三月裡」可知開花季節為春天(Ｃ)由「噴紅濺紫」可知(Ｄ)由「活火山」可知。\", \"pt\": 4}, {\"s\": 0, \"n\": \"23\", \"p\": \"\u003cp>「時常有些顏色以驚異興奮的姿態跳進我的眼睛。那顏色與視覺接觸的一剎那，就立時激起一種甜蜜欲醉的情緒。它使我聯想到一些生命中美好的事物和快樂的記憶。像一張張抽象的矇矓的畫幅，以不可捉摸、無法言傳、而又異常強烈的力量，激起心情的一片迴盪。」（\u003cu>羅蘭\u003c/u>）依據本文內容所述，下列何者屬於此種「對生命中美好的事物和快樂記憶的聯想」？\u003c/p>\", \"o\": [\"在淺灰色的柏油路上，忽然駛過一輛深粉紅色的小轎車，這種鮮見的車色，可能源自一位年輕女孩的選擇\", \"櫥窗內各色各樣的蛋糕撩亂了我的目光，一時之間我拿不定主意，黑的發亮是巧克力口味，好吃卻不能讓人驚豔\", \"忘不了八歲過年時一件軟軟的、紅綠相間的「華絲葛」棉袍。儘管它紅得豔、綠得俗。但就是那俗與豔，才畫得出那個時代的童年，和那個時代除夕的歡娛\", \"展卷一看，白卷上的墨字密密麻麻，答案格上依舊虛位以待，倒是綠色筆四處塗鴉，難怪那血淋淋的零分憤怒地被掛在右上角\"], \"a\": 2, \"e\": \"題幹強調對生命中快樂記憶的聯想，故選(Ｃ)。\", \"pt\": 4}, {\"s\": 0, \"n\": \"24\", \"p\": \"\u003cp>「在溪澗裡，我所關注的溪鳥們是最高統治者。牠們是寡頭的君父，控制著一個小而近乎封閉的獨立世界。大如魚蝦、青蛙、小至蚊蚋、蜉蝣等昆蟲都是覓食的對象。在自然環境競爭激烈的生活下，一如其他地區的動物，牠們也時有爭執，時有互助的情形出現。比較其他地區如沼澤、森林，溪鳥們顯然生活於一個簡單的食物網裡，也如同長期定居於小型社區的公民，位於食物鏈最高點的樞紐上，牠們必須相互依賴，藉以獲得下層食物的平穩與充裕。」（\u003cu>劉克襄\u003c/u>　\u003cu class=\\\"wavy\\\">溪澗的旅次\u003c/u>）關於本文，下列何者敘述正確？\u003c/p>\", \"o\": [\"溪澗與外界聯繫甚密\", \"溪鳥位居統治者高位卻仍須他者援助\", \"溪澗中的食物網比沼澤、森林複雜\", \"對於所有地區的動物而言，既競爭又互助十分罕見\"], \"a\": 1, \"e\": \"(Ａ)為小而近乎封閉的獨立世界(Ｃ)為較簡單的食物網(Ｄ)一如其他地區的動物，牠們也時有爭執，時有互助的情形出現。\", \"pt\": 4}, {\"s\": 0, \"n\": \"25\", \"p\": \"\u003cp>幼時念的\u003cu>祖逖\u003c/u>「雞鳴即起」，舞劍救國的典故，一直給我溫溫的記憶。我是城市裡長大的。但，在南方的城市，漁港的街道，養雞的人家還是普遍的，朦朧的清晨，先有雞鳴。那雄渾、高亢、昂拔的雞鳴，不畏風雨和冬寒，更令人要留戀被窩裡的殘夢了。父親總是第一個起來，趕著去半夜入港的漁船剛開的魚市工作。後來在書中念到\u003cu class=\\\"wavy\\\">詩經\u003c/u>的句子：「風雨如晦，雞鳴不已，既見君子，云胡不喜！」我是真真的感動了。在那風雨淒淒，昏晦的夜末，雞鳴不休……終至帶來一位至親至愛的人，穿過風風雨雨，時間嘈雜的甬道，走過來……。多美的\u003cu class=\\\"wavy\\\">詩經\u003c/u>裡的人呀！於是雞鳴對我，就不止是黎明的呼喚了。在\u003cu>紐約\u003c/u>幾年，一次也沒聽過雞鳴，一次也沒有。我曾焦躁地等待，等待雞鳴的狂喜……。終於我再次聽到那雄辯般的雞鳴了。南\u003cu>臺灣\u003c/u>的冬日是莫須有的，我奔上屋頂平臺上，\u003cu>中央山脈\u003c/u>破光處，像\u003cu>荷馬\u003c/u>史詩上描述的玫瑰色的光芒，浩浩湧出來。檳榔、椰子、老屋、水田，被點化而現形了。四面八方的雞鳴像清流滔滔洗濯石塊，呈現給我亮潔蓬勃的、夢寐思求的吾土與吾民。\u003c/p>\\n\u003cp>（節錄自\u003cu>洪素麗\u003c/u>　\u003cu class=\\\"wavy\\\">雞鳴\u003c/u>）\u003c/p>\\n\u003cp>下列何者「不是」作者在文中抒發的情意？（註：①風雨如晦，雞鳴不已：風雨晦暗不明，雞鳴仍不止息。②云：句首語氣詞。③胡：何也。）\u003c/p>\", \"o\": [\"童年的溫暖記憶\", \"對父親早起養家的感念\", \"文學撞擊心靈的感動\", \"返鄉後驚覺物事全非的惆悵\"], \"a\": 3, \"e\": \"(Ｄ)由「四面八方的雞鳴像清流滔滔洗濯石塊，呈現給我亮潔蓬勃的、夢寐思求的吾土與吾民」可知雞鳴依舊，並非物事全非。\", \"pt\": 4}];\n\n\nconst L = [\"A\",\"B\",\"C\",\"D\"];\nconst KEY = \"chi6-paper\";\nconst TOTAL = Q.reduce((s,q)=>s+q.pt,0);\nconst fmt = x => Math.round(x*10)/10;\nconst isMulti = q => Array.isArray(q.a);\nconst sameSet = (x,y) => Array.isArray(x) && x.length===y.length && x.every((v,k)=>v===y[k]);\nconst correct = i => Q[i].open ? state.ans[i]===\"ok\" : isMulti(Q[i]) ? sameSet(state.ans[i],Q[i].a) : state.ans[i]===Q[i].a;\nconst keyText = q => isMulti(q) ? q.a.map(k=>\"（\"+L[k]+\"）\").join(\"\") : \"（\"+L[q.a]+\"）\";\nconst $ = id => document.getElementById(id);\nconst esc = s => s.replace(/[&\u003c>\"]/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst tag = q => q.tg || (!SECS[q.s].group ? q.n : q.n.replace(/\\((\\d)\\)/,\"-$1\"));\n\nlet state = {mode:\"practice\", ans:{}, submitted:false, onlyWrong:false, focus:null};\ntry{ const s = JSON.parse(localStorage.getItem(KEY)||\"null\"); if(s && s.ans) state = Object.assign(state,s); }catch(e){}\nconst save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };\n\nconst graded = ()=> state.mode===\"practice\" || state.submitted;\nconst isWrong = i => graded() && (i in state.ans) && !correct(i);\n\nfunction bodyHTML(i){\n  const q = Q[i];\n  if(!q.open){\n    const imgs = q.o.every(t=>t.includes(\"\u003cimg\"));\n    const multi = isMulti(q) ? `\u003cdiv class=\"multibar ui\">\u003cspan class=\"hint\">可複選，選好後按「送出答案」\u003c/span>\u003cbutton class=\"tbtn send\" data-send=\"${i}\">送出答案\u003c/button>\u003c/div>` : \"\";\n    return `\u003cdiv class=\"opts${imgs?\" imgopts\":\"\"}\">${optsHTML(i)}\u003c/div>${multi}`;\n  }\n  return `${q.pre||\"\"}\u003ctextarea class=\"ans ui\" data-q=\"${i}\" rows=\"3\" placeholder=\"先寫下你的答案…\">\u003c/textarea>\n    \u003cdiv class=\"openbar ui\">\u003cbutton class=\"tbtn reveal\" data-rv=\"${i}\">看參考答案\u003c/button>\u003cspan class=\"hint\" id=\"hint${i}\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"ref ui hide\" id=\"ref${i}\">\u003cdiv>\u003cstrong>參考答案：\u003c/strong>${esc(q.r)}\u003c/div>\n      \u003cdiv class=\"selfrow\">對照後自評：\u003cbutton class=\"tbtn self\" data-self=\"${i}\" data-v=\"ok\">我答對了\u003c/button>\u003cbutton class=\"tbtn self\" data-self=\"${i}\" data-v=\"no\">我答錯了\u003c/button>\u003c/div>\u003c/div>`;\n}\nfunction optsHTML(i){\n  return Q[i].o.map((t,oi)=>`\u003cbutton class=\"opt\" data-q=\"${i}\" data-o=\"${oi}\">\u003cspan class=\"k\">（${L[oi]}）\u003c/span>\u003cspan class=\"ot\">${t}\u003c/span>\u003c/button>`).join(\"\");\n}\nfunction build(){\n  $(\"secs\").innerHTML = SECS.map((s,k)=>`\u003cdiv class=\"sec\">\u003ch2>${s.name}\u003c/h2>\u003cspan class=\"ui\">${s.note}\u003c/span>\u003c/div>\u003cdiv id=\"sec${k}\">\u003c/div>`).join(\"\");\n  $(\"gridwrap\").innerHTML = SECS.map((s,k)=>`\u003ch3>${s.name}\u003c/h3>\u003cdiv class=\"grid\" id=\"grid${k}\">\u003c/div>`).join(\"\");\n  SECS.forEach((sec,k)=>{\n  if(!sec.group){\n  $(\"sec\"+k).innerHTML = Q.map((q,i)=>q.s!==k?\"\":`\n    \u003csection class=\"card item\" id=\"q${i}\" data-items=\"${i}\">\n      \u003cdiv class=\"no\">${q.n}.\u003c/div>\n      \u003cdiv>${q.g?`\u003cdiv class=\"mat\">${G[q.g].html}\u003c/div>`:\"\"}\n        \u003cdiv class=\"prompt\">${q.p}\u003c/div>${bodyHTML(i)}\u003cdiv class=\"fb hide\" id=\"fb${i}\">\u003c/div>\u003c/div>\n    \u003c/section>`).join(\"\");\n  return; }\n  const order = [];\n  Q.forEach((q,i)=>{ if(q.s===k && !order.includes(q.g)) order.push(q.g); });\n  $(\"sec\"+k).innerHTML = order.map(g=>{\n    const ids = Q.map((q,i)=>q.g===g?i:-1).filter(i=>i>=0);\n    return `\u003csection class=\"card\" id=\"grp-${g}\" data-items=\"${ids.join(\",\")}\">\n      \u003cp class=\"ghead\">${G[g].label.replace(\"題組 \",\"\").replace(/^(\\d+)/,\"$1.\")}\u003c/p>\n      \u003cdiv class=\"mat\">${G[g].html}\u003c/div>\n      ${ids.map(i=>{const m=Q[i].m||Q[i].n.match(/\\((\\d)\\)/)[1];\n        return `\u003cdiv class=\"sub\" id=\"q${i}\">\u003cdiv class=\"prompt\">${/^\u003cp>/.test(Q[i].p) ? Q[i].p.replace(/^\u003cp>/,\"\u003cp>（\"+m+\"）\") : \"\u003cp>（\"+m+\"）\u003c/p>\"+Q[i].p}\u003c/div>${bodyHTML(i)}\u003cdiv class=\"fb hide\" id=\"fb${i}\">\u003c/div>\u003c/div>`}).join(\"\")}\n    \u003c/section>`;\n  }).join(\"\");\n  });\n  SECS.forEach((s,k)=>{\n    $(\"grid\"+k).innerHTML = Q.map((q,i)=>q.s===k?`\u003cbutton class=\"num\" data-go=\"${i}\">${tag(q)}\u003c/button>`:\"\").join(\"\");\n  });\n  $(\"stTotal\").textContent = Q.length;\n  document.querySelectorAll(\".opt\").forEach(b=>b.onclick=()=>pick(+b.dataset.q,+b.dataset.o));\n  document.querySelectorAll(\".send\").forEach(b=>b.onclick=()=>sendMulti(+b.dataset.send));\n  document.querySelectorAll(\".num\").forEach(b=>b.onclick=()=>jump(+b.dataset.go));\n  document.querySelectorAll(\".ans\").forEach(ta=>{ ta.value = (state.txt||{})[ta.dataset.q]||\"\"; ta.oninput=()=>{ state.txt=state.txt||{}; state.txt[ta.dataset.q]=ta.value; save(); }; });\n  document.querySelectorAll(\".reveal\").forEach(b=>b.onclick=()=>{ if(!graded()) return; state.rev=state.rev||{}; state.rev[b.dataset.rv]=1; save(); paintQ(+b.dataset.rv); });\n  document.querySelectorAll(\".self\").forEach(b=>b.onclick=()=>selfGrade(+b.dataset.self, b.dataset.v));\n  $(\"ttl\").textContent = TITLE; $(\"stMax\").textContent = fmt(TOTAL);\n\n}\n\nfunction selfGrade(i,v){\n  if(!graded() || (i in state.ans)) return;\n  state.ans[i]=v; save(); paintQ(i); paintStats(); paintResult();\n}\nfunction sendMulti(i){\n  const s = (state.sel||{})[i] || [];\n  if(!s.length || (i in state.ans) || !graded()) return;\n  state.ans[i] = s.slice().sort(); save(); paintQ(i); paintStats();\n  nextAfter(i);\n}\nfunction pick(i,o){\n  if(state.mode===\"practice\" && (i in state.ans)) return;\n  if(state.mode===\"test\" && state.submitted) return;\n  if(isMulti(Q[i])){\n    state.sel = state.sel||{}; const s = new Set(state.sel[i]||[]);\n    s.has(o) ? s.delete(o) : s.add(o);\n    state.sel[i] = [...s].sort();\n    if(state.mode===\"test\"){ if(state.sel[i].length) state.ans[i]=state.sel[i]; else delete state.ans[i]; }\n    save(); paintQ(i); paintStats(); return;\n  }\n  state.ans[i]=o; save();\n  paintQ(i); paintStats();\n  if(state.mode===\"practice\") nextAfter(i);\n}\n// practice: slide to the next unanswered question after showing feedback\nfunction nextAfter(i){\n  const nxt = Q.findIndex((q,j)=>j>i && !(j in state.ans) && visible(j));\n  if(nxt\u003c0) return;\n  if(!correct(i)) return;   // wrong: stay so the explanation can be read\n  setTimeout(()=>jump(nxt,true), 650);\n}\nfunction jump(i,soft){\n  if(!visible(i)){ state.onlyWrong=false; state.focus=null; save(); paintAll(); }\n  let el = $(\"q\"+i);\n  const card = el.closest(\"[data-items]\");\n  if(el.classList.contains(\"sub\") && card.dataset.items.split(\",\")[0]==String(i)) el = card;  // first sub: show the material too\n  if(!soft && window.innerWidth\u003c800) $(\"map\").open = false;\n  setTopH();\n  el.scrollIntoView({behavior: soft?\"smooth\":\"auto\", block: soft && el===$(\"q\"+i) ? \"center\":\"start\"});\n}\nfunction paintQ(i){\n  const q = Q[i], a = state.ans[i], has = i in state.ans, g = graded();\n  if(q.open){\n    const rev = (state.rev||{}
